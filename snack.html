<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>QT — Forex Live</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--g:#2ebd85;--r:#f6465d;--bg:#151a28;--card:#222a3e;--card2:#1b2233;--ln:#2f3952;--tx:#eaeef7;--mu:#858ea3}body{background:#0d1120;display:flex;justify-content:center;font-family:Tahoma,Arial,sans-serif;color:var(--tx)}.app{width:100%;max-width:430px;height:100vh;height:100dvh;max-height:960px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;direction:ltr}.tb{display:flex;align-items:center;gap:7px;padding:max(3px,env(safe-area-inset-top)) 10px 3px}.av{width:33px;height:33px;border-radius:50%;border:2px solid #a45cf0;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 30%,#3a2b57,#181226);box-shadow:0 0 8px #a45cf099}.gf{position:relative;width:30px;height:30px;border-radius:8px;background:#26304c;display:grid;place-items:center;font-size:17px}.gf i{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#3b4568;color:#cdd4e8;font-size:8px;font-style:normal;display:grid;place-items:center}.ac{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:3px 9px;display:flex;align-items:center;justify-content:space-between}.acr{font-size:9px;color:var(--mu)}.acr b{color:var(--g);font-weight:600}.acb{font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.1}.chv{color:var(--mu);font-size:12px}.wl{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#31c98f,#1d9c68);display:grid;place-items:center;box-shadow:0 4px 12px #2ebd8559}.wl svg{width:20px;height:20px}.prw{display:flex;gap:6px;padding:1px 10px 3px}.pp{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:600}.pp select{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--tx);font:inherit;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer}.pp option{background:var(--card)}.oi{width:21px;height:21px;border-radius:50%;border:1.6px solid #f0b90b;color:#f0b90b;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}.dt{width:34px;background:var(--card);border:1px solid var(--ln);border-radius:10px;display:grid;place-items:center;color:var(--mu);letter-spacing:2px;font-weight:700}.inf{display:flex;align-items:center;gap:7px;padding:0 11px 2px}.bt{width:25px;height:25px;border-radius:8px;background:#233047;display:grid;place-items:center;flex:none}.bt svg{width:14px;height:14px}.inf .p{font-size:11px;font-weight:700;line-height:1.2}.inf small{color:var(--mu);font-weight:400;font-size:9px}.ch{position:relative;flex:1;min-height:0;overflow:hidden;background:#101728}.ch canvas{position:absolute;inset:0;width:100%;height:100%}.tf{position:absolute;top:4px;left:6px;display:flex;gap:3px;z-index:3}.tf button{background:#222a3ecc;border:1px solid var(--ln);color:var(--mu);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;cursor:pointer}.tf button.active{background:#0064e0;color:#fff;border-color:#0064e0}.sn{padding:2px 12px 3px}.snl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-bottom:2px}.sb{display:flex;height:9px;border-radius:6px;overflow:hidden;background:#000}.sb i{display:block}.sb u{width:3px;background:#dfe3ee;flex:none}.pn{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:2px 12px 4px}.pn label{display:block;text-align:right;font-size:10px;color:var(--mu);margin-bottom:3px}.fld{display:flex;height:35px;background:var(--card2);border:1px solid var(--ln);border-radius:10px;overflow:hidden}.fld b{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}.fld span{width:35px;display:grid;place-items:center;background:var(--card);border-left:1px solid var(--ln);color:var(--mu);flex:none}.fld svg{width:16px;height:16px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1px 12px 4px}.b{height:43px;border:none;border-radius:11px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.b em{font-style:normal;font-size:14px;font-weight:700}.b small{font-size:11px;font-weight:600;opacity:.95}.bg{background:linear-gradient(180deg,#34c491,#25a172);box-shadow:0 5px 14px #2ebd8559}.br{background:linear-gradient(180deg,#f6546a,#e83a52);box-shadow:0 5px 14px #f6465d59}.tax{display:flex;justify-content:space-between;padding:1px 15px 3px;color:var(--mu);font-size:9px}.nv{display:flex;background:#1b2132;border-top:1px solid #283049;padding:3px 4px max(3px,env(safe-area-inset-bottom))}.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu)}.ni small{font-size:8px;white-space:nowrap}.ni.cm small{color:#fff;font-weight:700}.ni>svg{width:17px;height:17px}.cmb{width:29px;height:29px;border-radius:9px;background:#202740;border:2px solid;border-top-color:var(--g);border-bottom-color:var(--r);border-left-color:#3a7d68;border-right-color:#7d3a48;display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 -7px 14px -5px #2ebd858c,0 7px 14px -5px #f6465d8c}svg{display:block}</style></head><body><div class="app"><div class="tb"><div class="av">👧</div><div class="gf">🎁<i>✕</i></div><div class="ac"><div><div class="acr">QT Real&nbsp; <b>حلال</b> &nbsp;USD</div><div class="acb">0.39</div></div><span class="chv">▾</span></div><div class="wl"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></div></div><div class="prw"><div class="pp"><span class="oi">₿</span><select id="sym"><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>USDCHF</option><option>AUDUSD</option><option>USDCAD</option><option>NZDUSD</option><option>EURJPY</option><option>GBPJPY</option><option>XAUUSD</option></select><span class="chv">▾</span></div><div class="dt">•••</div></div><div class="inf"><span class="bt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span><span class="p" id="pr">⌃ …<br><small id="clk">--:--:-- UTC+3</small></span></div><div class="ch" id="ch"><canvas id="chart"></canvas><div class="tf"><button data-interval="1m" class="active">1m</button><button data-interval="5m">5m</button><button data-interval="15m">15m</button><button data-interval="1h">1h</button></div></div><div class="sn"><div class="snl"><b style="color:var(--g)">16%</b><b style="color:var(--r)">84%</b></div><div class="sb"><i style="width:16%;background:var(--g)"></i><u></u><i style="width:84%;background:var(--r)"></i></div></div><div class="pn"><div><label>الزمن</label><div class="fld"><b>00:00:05</b><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span></div></div><div><label>المبلغ</label><div class="fld"><b>16</b><span style="font-size:18px;font-weight:700">$</span></div></div></div><div class="btns"><button class="b bg"><em>شراء</em><small>80%</small></button><button class="b br"><em>بيع</em><small>80%</small></button></div><div class="tax"><span></span><span></span><span></span><span></span></div><div class="nv"><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v14m0 0-3-3m3 3 3-3M16 21V7m0 0-3 3m3-3 3 3"/></svg><small>التداولات</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 13.5a12 12 0 0 1 17 0M6.5 16.8a8 8 0 0 1 11 0"/><circle cx="12" cy="19.6" r="1.5" fill="currentColor" stroke="none"/></svg><small>الرؤى</small></div><div class="ni cm"><span class="cmb">⇅</span><small>Classic mode</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="3"/><path d="M3 19c.6-3.2 2.8-4.8 5.5-4.8s4.9 1.6 5.5 4.8"/><circle cx="16.8" cy="9.5" r="2.4"/><path d="M15.4 14.3c2.9.1 4.7 1.7 5.3 4.7"/></svg><small>تاول الاجتماعي</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><small>المزيد</small></div></div></div><script type="module">import Biquote from 'https://esm.sh/biquote@0.3.0';const bq=new Biquote();const canvas=document.getElementById('chart');const ctx=canvas.getContext('2d');const priceEl=document.getElementById('pr');const clkEl=document.getElementById('clk');const d=document.getElementById('sym');let SYMBOL='EURUSD';let candles=[];let livePrice=null;let currentInterval='1m';function resizeCanvas(){const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}window.addEventListener('resize',resizeCanvas);async function loadCandles(interval){try{const bars=await bq.ohlc(SYMBOL,{interval,limit:100});if(Array.isArray(bars)&&bars.length){candles=bars.map(b=>({time:b.time||b.t,open:+b.open||+b.o,high:+b.high||+b.h,low:+b.low||+b.l,close:+b.close||+b.c}))}draw()}catch(e){console.warn(e)}}async function fetchPrice(){try{const data=await bq.tick(SYMBOL);const mid=+data.mid;if(!(mid>0))return;livePrice=mid;priceEl.innerHTML=(mid>=(candles.length?candles[candles.length-1].open:mid)?'⌃ ':'⌄ ')+mid.toFixed(5)+'<br><small>'+new Date(Date.now()+108e5).toISOString().slice(11,19)+' UTC+3</small>';updateCurrentCandle(mid);draw()}catch(e){}}function updateCurrentCandle(price){if(!candles.length)return;const now=Date.now();const intervalSec={'1m':60,'5m':300,'15m':900,'1h':3600}[currentInterval]||60;const last=candles[candles.length-1];const tSec=last.time>1e12?last.time/1000:last.time;if(now/1000-tSec>=intervalSec){candles.push({time:now/1000,open:price,high:price,low:price,close:price});if(candles.length>100)candles.shift()}else{last.close=price;if(price>last.high)last.high=price;if(price<last.low)last.low=price}}function draw(){const W=canvas.width/(window.devicePixelRatio||1);const H=canvas.height/(window.devicePixelRatio||1);ctx.clearRect(0,0,W,H);if(!candles.length){ctx.fillStyle='#858ea3';ctx.font='13px Tahoma,Arial';ctx.textAlign='center';ctx.fillText('جاري تحميل البيانات…',W/2,H/2);return}const padRight=58,padTop=10,padBottom=20;const chartW=W-padRight,chartH=H-padTop-padBottom;let min=Infinity,max=-Infinity;for(const c of candles){if(c.low<min)min=c.low;if(c.high>max)max=c.high}const range=max-min||1;const pdr=range*.1;min-=pdr;max+=pdr;const priceRange=max-min;const priceToY=p=>padTop+chartH-((p-min)/priceRange)*chartH;const n=candles.length;const candleW=chartW/Math.max(n,60);const bodyW=Math.max(candleW*.7,2);ctx.strokeStyle='#222';ctx.fillStyle='#78829c';ctx.font='11px Tahoma,Arial';ctx.textAlign='left';for(let i=0;i<=5;i++){const y=padTop+(chartH/5)*i;const price=max-(priceRange/5)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();ctx.fillText(price.toFixed(5),chartW+6,y+4)}const off=chartW-n*candleW;candles.forEach((c,i)=>{const x=off+i*candleW+candleW/2;const isUp=c.close>=c.open;const color=isUp?'#2ebd85':'#f6465d';ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,priceToY(c.high));ctx.lineTo(x,priceToY(c.low));ctx.stroke();const openY=priceToY(c.open);const closeY=priceToY(c.close);const topY=Math.min(openY,closeY);const bodyH=Math.max(Math.abs(closeY-openY),1);ctx.fillStyle=color;ctx.fillRect(x-bodyW/2,topY,bodyW,bodyH)});if(livePrice!==null){const y=priceToY(livePrice);ctx.strokeStyle='#3f8cff';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#3f8cff';ctx.fillRect(chartW,y-9,padRight,18);ctx.fillStyle='#fff';ctx.font='bold 11px Tahoma,Arial';ctx.fillText(livePrice.toFixed(5),chartW+5,y+4)}}document.querySelectorAll('.tf button').forEach(btn=>{btn.addEventListener('click',async()=>{document.querySelectorAll('.tf button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentInterval=btn.dataset.interval;await loadCandles(currentInterval)})});d.onchange=function(){SYMBOL=this.value;candles=[];loadCandles(currentInterval)};resizeCanvas();await loadCandles('1m');fetchPrice();setInterval(fetchPrice,1000);setInterval(()=>loadCandles(currentInterval),30000);</script></body></html>
