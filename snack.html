<!-- language: HTML/JS, file: binance_live.html, runtime: modern browsers -->
<!-- *Binance market data streams are public — no API key needed for WebSocket price feeds* -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Live Prices</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:#0b0e11; color:#eaecef;
    padding:20px; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  h1 {
    font-size:20px; color:#f0b90b;
    margin-bottom:4px; font-weight:600;
  }
  .sub {
    font-size:12px; color:#848e9c;
    margin-bottom:20px; font-family:monospace;
  }
  .controls {
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
    justify-content:center;
  }
  select, button {
    padding:10px 16px; background:#1e2329; color:#eaecef;
    border:1px solid #2b3139; border-radius:6px;
    font-size:14px; cursor:pointer;
  }
  button { background:#f0b90b; color:#0b0e11; border-color:#f0b90b; font-weight:600; }
  button:hover { background:#d9a509; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status {
    padding:8px 14px; border-radius:6px; margin-bottom:16px;
    font-size:13px; font-family:monospace;
    width:100%; max-width:480px; text-align:center;
  }
  .connected { background:#1a3a1f; color:#3fb950; }
  .disconnected { background:#3a1a1a; color:#f85149; }
  .connecting { background:#3a2f1a; color:#d29922; }
  .card {
    background:#181a20; border:1px solid #2b3139;
    border-radius:10px; padding:28px 36px; text-align:center;
    width:100%; max-width:480px;
  }
  .symbol {
    font-size:14px; color:#848e9c;
    margin-bottom:8px; font-family:monospace;
  }
  .price {
    font-size:56px; font-weight:700;
    font-variant-numeric:tabular-nums;
    transition:color .12s; letter-spacing:-1px;
  }
  .up { color:#0ecb81; }
  .down { color:#f6465d; }
  .meta {
    font-size:12px; color:#848e9c;
    margin-top:10px; font-family:monospace;
  }
  .stats {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px; margin-top:16px;
  }
  .stat {
    background:#1e2329; border-radius:6px;
    padding:10px 6px; text-align:center;
  }
  .stat-label { font-size:10px; color:#848e9c; margin-bottom:4px; }
  .stat-value { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .log {
    background:#0b0e11; border:1px solid #2b3139;
    border-radius:6px; padding:12px;
    font-family:monospace; font-size:11px;
    max-height:160px; overflow-y:auto;
    color:#848e9c; width:100%; max-width:480px;
    margin-top:16px;
  }
  .log div { padding:2px 0; }
</style>
</head>
<body>

<h1>Binance Live Prices</h1>
<div class="sub">// WebSocket real-time feed</div>

<div class="controls">
  <select id="sym">
    <option value="btcusdt">BTC/USDT</option>
    <option value="ethusdt">ETH/USDT</option>
    <option value="bnbusdt">BNB/USDT</option>
    <option value="solusdt">SOL/USDT</option>
    <option value="xrpusdt">XRP/USDT</option>
    <option value="adausdt">ADA/USDT</option>
    <option value="dogeusdt">DOGE/USDT</option>
  </select>
  <button id="connectBtn">اتصال</button>
  <button id="disconnectBtn" disabled>قطع</button>
</div>

<div id="status" class="status disconnected">غير متصل</div>

<div class="card">
  <div class="symbol" id="symLabel">—</div>
  <div class="price" id="price">—</div>
  <div class="meta" id="meta">آخر تحديث: —</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">أعلى 24س</div>
      <div class="stat-value" id="high">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">أدنى 24س</div>
      <div class="stat-value" id="low">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">تغيير %</div>
      <div class="stat-value" id="chg">—</div>
    </div>
  </div>
</div>

<div class="log" id="log"></div>

<script>
const $ = id => document.getElementById(id);

let ws = null;
let currentSym = null;
let lastPrice = null;
let msgCount = 0;
let lastMsgTime = 0;

function log(msg) {
  const el = $('log');
  const t = new Date().toLocaleTimeString();
  const d = document.createElement('div');
  d.textContent = `[${t}] ${msg}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 40) el.removeChild(el.firstChild);
}

function setStatus(state, text) {
  const el = $('status');
  el.className = 'status ' + state;
  el.textContent = text;
}

// ============================================================
// Connect to Binance WebSocket
// ============================================================
function connect() {
  if (ws) return;

  currentSym = $('sym').value;
  $('symLabel').textContent = currentSym.toUpperCase();
  setStatus('connecting', 'جاري الاتصال...');
  log('Connecting to Binance...');

  // Combined stream: trade + 24h ticker for one symbol
  const url = `wss://stream.binance.com:9443/stream?streams=${currentSym}@trade/${currentSym}@ticker`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('connected', '● متصل — بث لحظي');
    log('Connected: ' + currentSym + '@trade + @ticker');
    msgCount = 0;
    lastMsgTime = Date.now();
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    const data = msg.data;
    if (!data) return;

    msgCount++;

    // Trade event: has 'p' (price) and 'q' (quantity), 'e' = 'trade'
    if (data.e === 'trade') {
      const price = parseFloat(data.p);
      const el = $('price');
      el.textContent = price.toFixed(price > 100 ? 2 : 5);

      if (lastPrice !== null) {
        el.className = 'price ' + (price > lastPrice ? 'up' : price < lastPrice ? 'down' : '');
      }
      lastPrice = price;

      $('meta').textContent = 'آخر صفقة: ' + new Date().toLocaleTimeString() +
                              ' (رسالة #' + msgCount + ')';
    }

    // Ticker event: has 24h stats
    if (data.e === '24hrTicker') {
      $('high').textContent = parseFloat(data.h).toFixed(2);
      $('low').textContent = parseFloat(data.l).toFixed(2);

      const chg = parseFloat(data.P);
      const chgEl = $('chg');
      chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
      chgEl.style.color = chg >= 0 ? '#0ecb81' : '#f6465d';
    }
  };

  ws.onclose = (e) => {
    setStatus('disconnected', '● انقطع — إعادة محاولة...');
    log('Closed: code ' + e.code);
    ws = null;
    setTimeout(connect, 3000);
  };

  ws.onerror = (e) => {
    setStatus('disconnected', '● خطأ في الاتصال');
    log('Error: ' + e.message);
  };

  $('connectBtn').disabled = true;
  $('disconnectBtn').disabled = false;
}

function disconnect() {
  if (ws) {
    ws.onclose = null; // prevent auto-reconnect
    ws.close();
    ws = null;
    log('Manually disconnected');
  }
  setStatus('disconnected', 'غير متصل');
  $('connectBtn').disabled = false;
  $('disconnectBtn').disabled = true;
}

// ============================================================
// Events
// ============================================================
$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', disconnect);

$('sym').addEventListener('change', () => {
  if (ws) {
    disconnect();
    setTimeout(connect, 300);
  }
});

log('Ready. Press اتصال to begin.');
</script>
</body>
</html>
