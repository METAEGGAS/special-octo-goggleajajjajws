<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biquote Live Price</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }
    .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 40px 60px;
        text-align: center;
        min-width: 320px;
    }
    .symbol {
        font-size: 18px;
        color: #888;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .price {
        font-size: 56px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: color 0.2s;
    }
    .change {
        font-size: 16px;
        margin-top: 8px;
        font-weight: 600;
    }
    .up { color: #00c853; }
    .down { color: #ff1744; }
    .status {
        font-size: 12px;
        color: #555;
        margin-top: 12px;
    }
    .flash-up { animation: flashUp 0.3s; }
    .flash-down { animation: flashDown 0.3s; }
    @keyframes flashUp {
        0% { background: #00c85322; }
        100% { background: transparent; }
    }
    @keyframes flashDown {
        0% { background: #ff174422; }
        100% { background: transparent; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="symbol">EUR / USD</div>
    <div class="price" id="price">---.-----</div>
    <div class="change" id="change">0.00%</div>
    <div class="status" id="status">Connecting...</div>
</div>

<script type="module">
    // Biquote — Free real-time market data, no API key, CORS open [citation:2]
    // نستخدم esm.sh لتحميل المكتبة مباشرة في المتصفح
    
    import Biquote from 'https://esm.sh/biquote@0.3.0';

    const bq = new Biquote();
    
    const priceEl = document.getElementById('price');
    const changeEl = document.getElementById('change');
    const statusEl = document.getElementById('status');
    
    let lastMid = null;

    async function fetchPrice() {
        try {
            // tick("EURUSD") — يرجع كائن فيه mid و dayDiffPercent [citation:2]
            const data = await bq.tick("EURUSD");
            
            const mid = data.mid;
            const changePct = data.dayDiffPercent ?? 0;
            
            // تنسيق السعر — 5 خانات عشرية للفوركس
            priceEl.textContent = mid.toFixed(5);
            
            // لون التغيير
            const sign = changePct >= 0 ? '+' : '';
            changeEl.textContent = `${sign}${changePct.toFixed(2)}%`;
            changeEl.className = 'change ' + (changePct >= 0 ? 'up' : 'down');
            
            // تأثير الوميض عند تغير السعر
            if (lastMid !== null && mid !== lastMid) {
                const cls = mid > lastMid ? 'flash-up' : 'flash-down';
                document.querySelector('.card').classList.add(cls);
                setTimeout(() => document.querySelector('.card').classList.remove(cls), 300);
            }
            lastMid = mid;
            
            statusEl.textContent = 'Live • ' + new Date().toLocaleTimeString();
            
        } catch (e) {
            statusEl.textContent = 'Error: ' + e.message;
        }
    }

    // أول استدعاء فوري
    fetchPrice();
    
    // تحديث كل ثانية
    setInterval(fetchPrice, 1000);
</script>

</body>
</html>
