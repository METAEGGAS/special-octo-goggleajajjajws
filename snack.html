<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>QT — Crypto Live</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#2ebd85;--r:#f6465d;--bg:#151a28;--card:#222a3e;--card2:#1b2233;--ln:#2f3952;--tx:#eaeef7;--mu:#858ea3}
body{background:#0d1120;display:flex;justify-content:center;font-family:Tahoma,Arial,sans-serif;color:var(--tx)}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;max-height:960px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;direction:ltr}
.tb{display:flex;align-items:center;gap:9px;padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.av{width:44px;height:44px;border-radius:50%;border:2.5px solid #a45cf0;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle at 35% 30%,#3a2b57,#181226);box-shadow:0 0 8px rgba(164,92,240,.6)}
.gf{position:relative;width:40px;height:40px;border-radius:10px;background:#26304c;display:grid;place-items:center;font-size:21px}
.gf i{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#3b4568;color:#cdd4e8;font-size:9px;font-style:normal;display:grid;place-items:center}
.ac{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:13px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between}
.acr{font-size:11px;color:var(--mu)}.acr b{color:var(--g);font-weight:600}
.acb{font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.chv{color:var(--mu);font-size:14px}
.wl{width:46px;height:46px;border-radius:13px;background:linear-gradient(160deg,#31c98f,#1d9c68);display:grid;place-items:center;box-shadow:0 4px 12px rgba(46,189,133,.35)}
.prw{display:flex;gap:8px;padding:2px 12px 6px}
.pp{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--ln);border-radius:13px;padding:9px 12px;font-size:14.5px;font-weight:600}
.pp select{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font:inherit;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer}
.pp option{background:var(--card)}
.oi{width:27px;height:27px;border-radius:50%;border:1.6px solid #f0b90b;color:#f0b90b;display:grid;place-items:center;flex:none;font-size:15px;font-weight:700}
.dt{width:46px;background:var(--card);border:1px solid var(--ln);border-radius:13px;display:grid;place-items:center;color:var(--mu);letter-spacing:2px;font-weight:700}
.inf{display:flex;align-items:center;gap:10px;padding:2px 14px 4px}
.bt{width:34px;height:34px;border-radius:10px;background:#233047;display:grid;place-items:center;flex:none}
.inf .p{font-size:13px;font-weight:700;line-height:1.25}
.inf small{color:var(--mu);font-weight:400;font-size:11px}
.ch{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.ch canvas{position:absolute;inset:0;width:100%;height:100%}
.zm{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zm button{width:30px;height:30px;border-radius:9px;border:1px solid var(--ln);background:rgba(34,42,62,.92);color:var(--tx);font-size:17px;font-weight:700;cursor:pointer;line-height:1}
.m1{position:absolute;right:64px;top:6px;font-size:12px;color:#aeb6cc;z-index:2}
.cd{position:absolute;right:64px;top:24px;font-size:12px;color:#cdd4e8;z-index:2}
.pp1{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px 0 0 7px;z-index:2;top:50%;background:#3f8cff;color:#fff;box-shadow:0 2px 8px rgba(63,140,255,.5)}
.sn{padding:4px 14px 6px}
.snl{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:4px}
.sb{display:flex;height:13px;border-radius:8px;overflow:hidden;background:#000}
.sb i{display:block}.sb u{width:3px;background:#dfe3ee;flex:none}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:4px 14px 6px}
.pn label{display:block;text-align:right;font-size:12px;color:var(--mu);margin-bottom:5px}
.fld{display:flex;height:46px;background:var(--card2);border:1px solid var(--ln);border-radius:13px;overflow:hidden}
.fld b{flex:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.fld span{width:46px;display:grid;place-items:center;background:var(--card);border-left:1px solid var(--ln);color:var(--mu);flex:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 14px 8px}
.b{height:58px;border:none;border-radius:15px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.b em{font-style:normal;font-size:17px;font-weight:700}.b small{font-size:13px;font-weight:600;opacity:.95}
.bg{background:linear-gradient(180deg,#34c491,#25a172);box-shadow:0 5px 14px rgba(46,189,133,.35)}
.br{background:linear-gradient(180deg,#f6546a,#e83a52);box-shadow:0 5px 14px rgba(246,70,93,.35)}
.tax{display:flex;justify-content:space-between;padding:2px 18px 6px;color:var(--mu);font-size:11px}
.nv{display:flex;background:#1b2132;border-top:1px solid #283049;padding:4px 4px max(6px,env(safe-area-inset-bottom))}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu)}
.ni small{font-size:9.5px;white-space:nowrap}
.ni.cm small{color:#fff;font-weight:700}
.cmb{width:38px;height:38px;border-radius:11px;background:#202740;border:2px solid;border-top-color:var(--g);border-bottom-color:var(--r);border-left-color:#3a7d68;border-right-color:#7d3a48;display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 -7px 14px -5px rgba(46,189,133,.55),0 7px 14px -5px rgba(246,70,93,.55)}
svg{display:block}
</style></head><body><div class="app">
<div class="tb">
 <div class="av">👧</div>
 <div class="gf">🎁<i>✕</i></div>
 <div class="ac"><div><div class="acr">QT Real&nbsp; <b>حساب</b> &nbsp;USD</div><div class="acb">0.39</div></div><span class="chv">▾</span></div>
 <div class="wl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></div>
</div>
<div class="prw">
 <div class="pp"><span class="oi">₿</span><select id="sym"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option><option>XRPUSDT</option><option>DOGEUSDT</option><option>ADAUSDT</option><option>TRXUSDT</option><option>LTCUSDT</option><option>LINKUSDT</option></select><span class="chv">▾</span></div>
 <div class="dt">•••</div>
</div>
<div class="inf">
 <span class="bt"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>
 <span class="p" id="pr">⌃ …<br><small id="clk">--:--:-- UTC+3</small></span>
</div>
<div class="ch">
 <canvas id="cv"></canvas>
 <div class="zm"><button id="zi">+</button><button id="zo">−</button></div>
 <span class="m1">M1</span><span class="cd" id="cd">--:--</span>
 <span class="pp1" id="lp">—</span>
</div>
<div class="sn">
 <div class="snl"><b style="color:var(--g)">16%</b><b style="color:var(--r)">84%</b></div>
 <div class="sb"><i style="width:16%;background:var(--g)"></i><u></u><i style="width:84%;background:var(--r)"></i></div>
</div>
<div class="pn">
 <div><label>الزمن</label><div class="fld"><b>00:00:05</b><span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span></div></div>
 <div><label>المبلغ</label><div class="fld"><b>16</b><span style="font-size:18px;font-weight:700">$</span></div></div>
</div>
<div class="btns">
 <button class="b bg"><em>شراء</em><small>80%</small></button>
 <button class="b br"><em>بيع</em><small>80%</small></button>
</div>
<div class="tax"><span></span><span></span><span></span><span></span></div>
<div class="nv">
 <div class="ni"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v14m0 0-3-3m3 3 3-3M16 21V7m0 0-3 3m3-3 3 3"/></svg><small>التداولات</small></div>
 <div class="ni"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 13.5a12 12 0 0 1 17 0M6.5 16.8a8 8 0 0 1 11 0"/><circle cx="12" cy="19.6" r="1.5" fill="currentColor" stroke="none"/></svg><small>الرؤى</small></div>
 <div class="ni cm"><span class="cmb">⇅</span><small>Classic mode</small></div>
 <div class="ni"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="3"/><path d="M3 19c.6-3.2 2.8-4.8 5.5-4.8s4.9 1.6 5.5 4.8"/><circle cx="16.8" cy="9.5" r="2.4"/><path d="M15.4 14.3c2.9.1 4.7 1.7 5.3 4.7"/></svg><small>تاول الاجتماعي</small></div>
 <div class="ni"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><small>المزيد</small></div>
</div>
</div><script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),lp=document.getElementById('lp'),cd=document.getElementById('cd'),pr=document.getElementById('pr'),clk=document.getElementById('clk'),tq=document.querySelectorAll('.tax span');
let SYM='BTCUSDT',K=[],cw=9,off=0,ws=null,drag=null,pinch=0;
const fmt=p=>p>=1000?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(6);
async function load(){try{const a=await(await fetch('https://api.binance.com/api/v3/klines?symbol='+SYM+'&interval=1m&limit=300')).json();K=a.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],ct:k[6]}));off=0;sub();draw();}catch(e){x.clearRect(0,0,cv.width,cv.height);draw();}}
function sub(){if(ws)ws.close();ws=new WebSocket('wss://stream.binance.com:9443/ws/'+SYM.toLowerCase()+'@kline_1m');ws.onmessage=e=>{const k=JSON.parse(e.data).k,c={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,ct:k.T};if(K.length&&c.t===K[K.length-1].t)K[K.length-1]=c;else K.push(c);draw();};}
function zoom(f){cw=Math.max(2,Math.min(44,cw*f));draw();}
function draw(){
 const W=cv.clientWidth,H=cv.clientHeight,d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
 const PW=58,CW=W-PW;
 if(!K.length){x.fillStyle='#858ea3';x.font='13px Tahoma';x.textAlign='center';x.fillText('جاري تحميل البيانات من بينانس…',CW/2,H/2);return}
 const n=Math.max(5,Math.floor(CW/cw));off=Math.max(0,Math.min(off,K.length-n));
 const s=Math.max(0,K.length-n-off),v=K.slice(s,K.length-off);
 let mn=1/0,mx=-1/0;v.forEach(c=>{if(c.l<mn)mn=c.l;if(c.h>mx)mx=c.h});
 const pd=(mx-mn)*.08||1;mn-=pd;mx+=pd;const y=p=>(mx-p)/(mx-mn)*(H-26)+8;
 x.strokeStyle='rgba(255,255,255,.055)';x.fillStyle='#78829c';x.font='11px Tahoma';x.textAlign='left';x.lineWidth=1;
 for(let i=0;i<=4;i++){const p=mn+(mx-mn)*i/4,yy=y(p);x.beginPath();x.moveTo(0,yy);x.lineTo(CW,yy);x.stroke();x.fillText(fmt(p),CW+5,yy+3)}
 [.25,.5,.75].forEach(f=>{x.beginPath();x.moveTo(CW*f,0);x.lineTo(CW*f,H);x.stroke()});
 const bw=Math.max(1,cw*.62);
 v.forEach((c,i)=>{const X=(i+.5)*cw,up=c.c>=c.o;x.strokeStyle=x.fillStyle=up?'#2ebd85':'#f6465d';x.lineWidth=Math.max(1,cw*.14);
  x.beginPath();x.moveTo(X,y(c.h));x.lineTo(X,y(c.l));x.stroke();
  const t=y(Math.max(c.o,c.c)),b=y(Math.min(c.o,c.c));x.fillRect(X-bw/2,t,bw,Math.max(1,b-t));});
 const L=K[K.length-1],yy=y(L.c);
 if(yy>-10&&yy<H+10){x.strokeStyle='#3f8cff';x.setLineDash([4,4]);x.beginPath();x.moveTo(0,yy);x.lineTo(CW,yy);x.stroke();x.setLineDash([]);lp.style.top=Math.max(10,Math.min(H-10,yy))+'px';lp.textContent=fmt(L.c);}
 const step=Math.max(1,Math.floor(v.length/4));
 for(let i=0;i<4;i++){const c=v[Math.min(v.length-1,i*step)];tq[i].textContent=c?new Date(c.t).toTimeString().slice(0,5):''}
 const r=Math.max(0,L.ct-Date.now());cd.textContent=String(Math.floor(r/6e4)).padStart(2,'0')+':'+String(Math.floor(r/1e3)%60).padStart(2,'0');
 pr.innerHTML=(L.c>=L.o?'⌃ ':'⌄ ')+fmt(L.c)+'<br><small>'+clk.textContent+'</small>';
}
cv.addEventListener('pointerdown',e=>{if(e.pointerType=='touch'&&e.isPrimary==false)return;drag={x:e.clientX,off};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){off=Math.round(drag.off+(e.clientX-drag.x)/cw);draw()}});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.18:1/1.18)},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length==2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom(d/pinch);pinch=d}},{passive:false});
cv.addEventListener('touchend',()=>pinch=0);
document.getElementById('zi').onclick=()=>zoom(1.3);
document.getElementById('zo').onclick=()=>zoom(1/1.3);
document.getElementById('sym').onchange=e=>{SYM=e.target.value;K=[];lp.textContent='—';load();};
addEventListener('resize',draw);
setInterval(()=>{const t=new Date(Date.now()+108e5);clk.textContent=t.toISOString().slice(11,19)+' UTC+3';draw();},1000);
draw();load();
</script></body></html>
