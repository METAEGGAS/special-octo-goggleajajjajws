<!-- language: HTML/JS, file: binance_chart_15s.html, runtime: modern browsers -->
<!-- *Binance has no native 15s kline — candles are built client-side from @trade stream* -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Live + Chart (15s)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:#0b0e11; color:#eaecef;
    padding:16px; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  h1 { font-size:18px; color:#f0b90b; margin-bottom:4px; font-weight:600; }
  .sub { font-size:11px; color:#848e9c; margin-bottom:14px; font-family:monospace; }
  .controls {
    display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;
    justify-content:center;
  }
  select, button {
    padding:8px 14px; background:#1e2329; color:#eaecef;
    border:1px solid #2b3139; border-radius:6px;
    font-size:13px; cursor:pointer;
  }
  button { background:#f0b90b; color:#0b0e11; border-color:#f0b90b; font-weight:600; }
  button:hover { background:#d9a509; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status {
    padding:6px 12px; border-radius:6px; margin-bottom:10px;
    font-size:12px; font-family:monospace;
    width:100%; max-width:900px; text-align:center;
  }
  .connected { background:#1a3a1f; color:#3fb950; }
  .disconnected { background:#3a1a1a; color:#f85149; }
  .connecting { background:#3a2f1a; color:#d29922; }
  .toprow {
    display:grid; grid-template-columns:1fr auto;
    gap:12px; width:100%; max-width:900px;
    align-items:center; margin-bottom:10px;
  }
  .pricebox {
    background:#181a20; border:1px solid #2b3139;
    border-radius:8px; padding:12px 18px;
    display:flex; align-items:baseline; gap:14px;
  }
  .symbol { font-size:13px; color:#848e9c; font-family:monospace; }
  .price {
    font-size:28px; font-weight:700;
    font-variant-numeric:tabular-nums;
    transition:color .12s;
  }
  .up { color:#0ecb81; }
  .down { color:#f6465d; }
  .chg { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stats {
    display:flex; gap:12px;
    background:#181a20; border:1px solid #2b3139;
    border-radius:8px; padding:12px 18px;
    font-size:12px;
  }
  .stat-label { color:#848e9c; margin-left:4px; }
  #chart {
    width:100%; max-width:900px;
    height:420px;
    background:#181a20;
    border:1px solid #2b3139;
    border-radius:8px;
    overflow:hidden;
  }
  @media(max-width:640px){
    .toprow { grid-template-columns:1fr; }
    #chart { height:300px; }
    .price { font-size:22px; }
  }
</style>
</head>
<body>

<h1>Binance Live + Chart (15s)</h1>
<div class="sub">// 15-second candles built from @trade stream</div>

<div class="controls">
  <select id="sym">
    <option value="btcusdt">BTC/USDT</option>
    <option value="ethusdt">ETH/USDT</option>
    <option value="bnbusdt">BNB/USDT</option>
    <option value="solusdt">SOL/USDT</option>
    <option value="xrpusdt">XRP/USDT</option>
    <option value="adausdt">ADA/USDT</option>
    <option value="dogeusdt">DOGE/USDT</option>
  </select>
  <button id="connectBtn">اتصال</button>
  <button id="disconnectBtn" disabled>قطع</button>
</div>

<div id="status" class="status disconnected">غير متصل</div>

<div class="toprow">
  <div class="pricebox">
    <span class="symbol" id="symLabel">—</span>
    <span class="price" id="price">—</span>
  </div>
  <div class="stats">
    <div>أعلى: <span id="high">—</span></div>
    <div>أدنى: <span id="low">—</span></div>
    <div>تغيير: <span id="chg">—</span></div>
  </div>
</div>

<div id="chart"></div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = id => document.getElementById(id);
const INTERVAL_MS = 15000;      // 15 seconds
const MAX_CANDLES = 500;        // keep chart light

let ws = null;
let chart = null;
let candleSeries = null;
let currentSym = null;
let lastPrice = null;

// Current (building) candle state
let currentCandle = null;       // { time, open, high, low, close }
let candleHistory = [];         // closed candles

// ============================================================
// Chart setup
// ============================================================
function initChart() {
  const container = $('chart');
  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: '#181a20' },
      textColor: '#d1d4dc',
    },
    grid: {
      vertLines: { color: '#2b3139' },
      horzLines: { color: '#2b3139' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2b3139' },
    timeScale: {
      borderColor: '#2b3139',
      timeVisible: true,
      secondsVisible: true,
    },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#0ecb81',
    downColor: '#f6465d',
    borderUpColor: '#0ecb81',
    borderDownColor: '#f6465d',
    wickUpColor: '#0ecb81',
    wickDownColor: '#f6465d',
  });

  const resizeObs = new ResizeObserver(() => {
    chart.applyOptions({
      width: container.clientWidth,
      height: container.clientHeight,
    });
  });
  resizeObs.observe(container);
  chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
}

// ============================================================
// Build 15s history from REST @ 1s candles
// Binance supports 1s interval via REST — we aggregate 15 of them
// ============================================================
async function loadHistory15s(symbol) {
  // Fetch 1s klines for the last ~200 minutes (enough for 500 candles of 15s)
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol.toUpperCase()}&interval=1s&limit=1000`;
  const res = await fetch(url);
  const raw = await res.json();

  // Aggregate 1s candles into 15s buckets
  const buckets = new Map();
  for (const k of raw) {
    const openTimeMs = k[0];
    const bucketMs = Math.floor(openTimeMs / INTERVAL_MS) * INTERVAL_MS;
    const bucketTime = Math.floor(bucketMs / 1000);

    const o = parseFloat(k[1]);
    const h = parseFloat(k[2]);
    const l = parseFloat(k[3]);
    const c = parseFloat(k[4]);

    if (!buckets.has(bucketTime)) {
      buckets.set(bucketTime, { time: bucketTime, open: o, high: h, low: l, close: c });
    } else {
      const b = buckets.get(bucketTime);
      b.high = Math.max(b.high, h);
      b.low  = Math.min(b.low, l);
      b.close = c;
    }
  }

  const candles = Array.from(buckets.values()).sort((a, b) => a.time - b.time);

  // Drop the last (partial) bucket — it will be rebuilt live
  const lastBucket = Math.floor(Date.now() / INTERVAL_MS) * INTERVAL_MS / 1000;
  const filtered = candles.filter(c => c.time < lastBucket);

  candleHistory = filtered.slice(-MAX_CANDLES);
  candleSeries.setData(candleHistory);

  if (candleHistory.length) {
    lastPrice = candleHistory[candleHistory.length - 1].close;
    $('price').textContent = lastPrice.toFixed(lastPrice > 100 ? 2 : 5);
  }
  return candleHistory;
}

// ============================================================
// Candle building from @trade stream
// ============================================================
function onTrade(price) {
  const nowMs = Date.now();
  const bucketMs = Math.floor(nowMs / INTERVAL_MS) * INTERVAL_MS;
  const bucketTime = Math.floor(bucketMs / 1000);

  if (!currentCandle || currentCandle.time !== bucketTime) {
    // Close previous candle if any (already pushed live — just finalize)
    if (currentCandle) {
      candleHistory.push(currentCandle);
      if (candleHistory.length > MAX_CANDLES) candleHistory.shift();
    }
    // Start new candle
    currentCandle = {
      time: bucketTime,
      open: price,
      high: price,
      low: price,
      close: price,
    };
  } else {
    // Update existing candle
    currentCandle.high = Math.max(currentCandle.high, price);
    currentCandle.low  = Math.min(currentCandle.low, price);
    currentCandle.close = price;
  }

  candleSeries.update(currentCandle);
}

// ============================================================
// Connect
// ============================================================
function connect() {
  if (ws) return;

  currentSym = $('sym').value;
  $('symLabel').textContent = currentSym.toUpperCase();
  setStatus('connecting', 'تحميل البيانات التاريخية...');

  (async () => {
    try {
      await loadHistory15s(currentSym);
      setStatus('connecting', 'جاري الاتصال بالبث اللحظي...');
      openSocket();
    } catch (e) {
      setStatus('disconnected', '● فشل تحميل البيانات: ' + e.message);
      console.error(e);
    }
  })();
}

function openSocket() {
  const sym = currentSym;
  const url = `wss://stream.binance.com:9443/stream?streams=${sym}@trade/${sym}@ticker`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('connected', `● متصل — ${sym.toUpperCase()} @ 15s`);
    $('connectBtn').disabled = true;
    $('disconnectBtn').disabled = false;
    currentCandle = null;
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    const d = msg.data;
    if (!d) return;

    // Trade → build candle + update ticker
    if (d.e === 'trade') {
      const price = parseFloat(d.p);

      const el = $('price');
      el.textContent = price.toFixed(price > 100 ? 2 : 5);
      if (lastPrice !== null) {
        el.className = 'price ' + (price > lastPrice ? 'up' : price < lastPrice ? 'down' : '');
      }
      lastPrice = price;

      onTrade(price);
    }

    // Ticker → 24h stats
    if (d.e === '24hrTicker') {
      $('high').textContent = parseFloat(d.h).toFixed(2);
      $('low').textContent = parseFloat(d.l).toFixed(2);
      const chg = parseFloat(d.P);
      const chgEl = $('chg');
      chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
      chgEl.style.color = chg >= 0 ? '#0ecb81' : '#f6465d';
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', '● انقطع — إعادة محاولة...');
    ws = null;
    setTimeout(() => { if (!ws) connect(); }, 3000);
  };

  ws.onerror = () => setStatus('disconnected', '● خطأ في الاتصال');
}

function disconnect() {
  if (ws) {
    ws.onclose = null;
    ws.close();
    ws = null;
  }
  currentCandle = null;
  setStatus('disconnected', 'غير متصل');
  $('connectBtn').disabled = false;
  $('disconnectBtn').disabled = true;
}

function setStatus(state, text) {
  const el = $('status');
  el.className = 'status ' + state;
  el.textContent = text;
}

// ============================================================
// Events
// ============================================================
$('connectBtn').addEventListener('click', connect);
$('disconnectBtn').addEventListener('click', disconnect);

$('sym').addEventListener('change', () => {
  if (ws) { disconnect(); setTimeout(connect, 300); }
});

initChart();
</script>
</body>
</html>
