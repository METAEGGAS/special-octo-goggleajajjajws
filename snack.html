<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>QT — Forex Live</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--g:#2ebd85;--r:#f6465d;--bg:#151a28;--card:#222a3e;--card2:#1b2233;--ln:#2f3952;--tx:#eaeef7;--mu:#858ea3}body{background:#0d1120;display:flex;justify-content:center;font-family:Tahoma,Arial,sans-serif;color:var(--tx)}.app{width:100%;max-width:430px;height:100vh;height:100dvh;max-height:960px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;direction:ltr}.tb{display:flex;align-items:center;gap:7px;padding:max(3px,env(safe-area-inset-top)) 10px 3px}.av{width:33px;height:33px;border-radius:50%;border:2px solid #a45cf0;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 30%,#3a2b57,#181226);box-shadow:0 0 8px #a45cf099}.gf{position:relative;width:30px;height:30px;border-radius:8px;background:#26304c;display:grid;place-items:center;font-size:17px}.gf i{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#3b4568;color:#cdd4e8;font-size:8px;font-style:normal;display:grid;place-items:center}.ac{flex:1;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:3px 9px;display:flex;align-items:center;justify-content:space-between}.acr{font-size:9px;color:var(--mu)}.acr b{color:var(--g);font-weight:600}.acb{font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.1}.chv{color:var(--mu);font-size:12px}.wl{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,#31c98f,#1d9c68);display:grid;place-items:center;box-shadow:0 4px 12px #2ebd8559}.wl svg{width:20px;height:20px}.prw{display:flex;gap:6px;padding:1px 10px 3px}.pp{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:600}.pp select{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--tx);font:inherit;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer}.pp option{background:var(--card)}.oi{width:21px;height:21px;border-radius:50%;border:1.6px solid #f0b90b;color:#f0b90b;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}.dt{width:34px;background:var(--card);border:1px solid var(--ln);border-radius:10px;display:grid;place-items:center;color:var(--mu);letter-spacing:2px;font-weight:700}.inf{display:flex;align-items:center;gap:7px;padding:0 11px 2px}.bt{width:25px;height:25px;border-radius:8px;background:#233047;display:grid;place-items:center;flex:none}.bt svg{width:14px;height:14px}.inf .p{font-size:11px;font-weight:700;line-height:1.2}.inf small{color:var(--mu);font-weight:400;font-size:9px}.ch{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#101728}.ch canvas{position:absolute;inset:0;width:100%;height:100%}.tf{position:absolute;top:4px;left:6px;display:flex;gap:3px;z-index:3}.tf button{background:#222a3ecc;border:1px solid var(--ln);color:var(--mu);font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;cursor:pointer}.tf button.active{background:#0064e0;color:#fff;border-color:#0064e0}.zm{position:absolute;bottom:8px;right:6px;display:flex;flex-direction:column;gap:4px;z-index:3}.zm button{width:26px;height:26px;border-radius:7px;border:1px solid var(--ln);background:#222a3eeb;color:var(--tx);font-size:15px;font-weight:700;cursor:pointer;line-height:1}.sn{padding:2px 12px 3px}.snl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-bottom:2px}.sb{display:flex;height:9px;border-radius:6px;overflow:hidden;background:#000}.sb i{display:block}.sb u{width:3px;background:#dfe3ee;flex:none}.pn{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:2px 12px 4px}.pn label{display:block;text-align:right;font-size:10px;color:var(--mu);margin-bottom:3px}.fld{display:flex;height:35px;background:var(--card2);border:1px solid var(--ln);border-radius:10px;overflow:hidden}.fld b{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}.fld span{width:35px;display:grid;place-items:center;background:var(--card);border-left:1px solid var(--ln);color:var(--mu);flex:none}.fld svg{width:16px;height:16px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1px 12px 4px}.b{height:43px;border:none;border-radius:11px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.b em{font-style:normal;font-size:14px;font-weight:700}.b small{font-size:11px;font-weight:600;opacity:.95}.bg{background:linear-gradient(180deg,#34c491,#25a172);box-shadow:0 5px 14px #2ebd8559}.br{background:linear-gradient(180deg,#f6546a,#e83a52);box-shadow:0 5px 14px #f6465d59}.tax{display:flex;justify-content:space-between;padding:1px 15px 3px;color:var(--mu);font-size:9px}.nv{display:flex;background:#1b2132;border-top:1px solid #283049;padding:3px 4px max(3px,env(safe-area-inset-bottom))}.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu)}.ni small{font-size:8px;white-space:nowrap}.ni.cm small{color:#fff;font-weight:700}.ni>svg{width:17px;height:17px}.cmb{width:29px;height:29px;border-radius:9px;background:#202740;border:2px solid;border-top-color:var(--g);border-bottom-color:var(--r);border-left-color:#3a7d68;border-right-color:#7d3a48;display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 -7px 14px -5px #2ebd858c,0 7px 14px -5px #f6465d8c}svg{display:block}</style></head><body><div class="app"><div class="tb"><div class="av">👧</div><div class="gf">🎁<i>✕</i></div><div class="ac"><div><div class="acr">QT Real&nbsp; <b>حلال</b> &nbsp;USD</div><div class="acb">0.39</div></div><span class="chv">▾</span></div><div class="wl"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></div></div><div class="prw"><div class="pp"><span class="oi">₿</span><select id="sym"><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>USDCHF</option><option>AUDUSD</option><option>USDCAD</option><option>NZDUSD</option><option>EURJPY</option><option>GBPJPY</option><option>XAUUSD</option></select><span class="chv">▾</span></div><div class="dt">•••</div></div><div class="inf"><span class="bt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span><span class="p" id="pr">⌃ …<br><small id="clk">--:--:-- UTC+3</small></span></div><div class="ch" id="ch"><canvas id="chart"></canvas><div class="tf"><button data-interval="1m" class="active">1m</button><button data-interval="5m">5m</button><button data-interval="15m">15m</button><button data-interval="1h">1h</button></div><div class="zm"><button id="zi">+</button><button id="zo">−</button></div></div><div class="sn"><div class="snl"><b style="color:var(--g)">16%</b><b style="color:var(--r)">84%</b></div><div class="sb"><i style="width:16%;background:var(--g)"></i><u></u><i style="width:84%;background:var(--r)"></i></div></div><div class="pn"><div><label>الزمن</label><div class="fld"><b>00:00:05</b><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span></div></div><div><label>المبلغ</label><div class="fld"><b>16</b><span style="font-size:18px;font-weight:700">$</span></div></div></div><div class="btns"><button class="b bg"><em>شراء</em><small>80%</small></button><button class="b br"><em>بيع</em><small>80%</small></button></div><div class="tax"><span></span><span></span><span></span><span></span></div><div class="nv"><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v14m0 0-3-3m3 3 3-3M16 21V7m0 0-3 3m3-3 3 3"/></svg><small>التداولات</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 13.5a12 12 0 0 1 17 0M6.5 16.8a8 8 0 0 1 11 0"/><circle cx="12" cy="19.6" r="1.5" fill="currentColor" stroke="none"/></svg><small>الرؤى</small></div><div class="ni cm"><span class="cmb">⇅</span><small>Classic mode</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="3"/><path d="M3 19c.6-3.2 2.8-4.8 5.5-4.8s4.9 1.6 5.5 4.8"/><circle cx="16.8" cy="9.5" r="2.4"/><path d="M15.4 14.3c2.9.1 4.7 1.7 5.3 4.7"/></svg><small>تاول الاجتماعي</small></div><div class="ni"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><small>المزيد</small></div></div></div><script type="module">import Biquote from 'https://esm.sh/biquote@0.3.0';const bq=new Biquote();const canvas=document.getElementById('chart');const ctx=canvas.getContext('2d');const ch=document.getElementById('ch');const priceEl=document.getElementById('pr');const d=document.getElementById('sym');let SYMBOL='EURUSD';let candles=[];let livePrice=null;let currentInterval='1m';let W=0,H=0,DPR=1;let ppc=12,ppcT=12,ppcMin=4,ppcMax=60;let ri=0,riT=0,fol=1;let pMin=0,pMax=1,pMinT=0,pMaxT=1;let dLo=1,dHi=0,dr=1;let T=1,pt=0;let mode=0,moved=0,px0=0,py0=0,KX=0,KY=0,bRi=0,bLo=0,bHi=0,bPP=0,pDX=0,pDY=0,tapT=0,tapX=0,tapY=0;const G=new Map();const PAD_R=58;function cx(v,a,b){return v<a?a:v>b?b:v}function NF(v){if(!(v>0))return'—';if(v>=1e3)return v.toFixed(2);if(v>=10)return v.toFixed(3);return v.toFixed(5)}function resize(){DPR=window.devicePixelRatio||1;const r=ch.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}function dRng(){dLo=1e9;dHi=-1e9;for(const k of candles){if(k.h>dHi)dHi=k.h;if(k.l<dLo)dLo=k.l}if(!(dHi>dLo)){const v=dHi||1;dLo=v*.99;dHi=v*1.01}dr=dHi-dLo||1}function riMx(){return candles.length?candles.length-1+(PAD_R/ppcT)*0.5:0}function clRi(){riT=cx(riT,candles.length?Math.min(2,candles.length-1):0,riMx())}function fit(){if(!candles.length)return;riT=candles.length-1;const chartW=W-PAD_R;const vis=chartW/ppcT;const i0=Math.max(0,Math.floor(riT-vis));const i1=Math.min(candles.length-1,Math.ceil(riT));let lo=1e9,hi=-1e9;for(let k=i0;k<=i1;k++){if(candles[k].h>hi)hi=candles[k].h;if(candles[k].l<lo)lo=candles[k].l}if(!(hi>lo)){lo=candles[candles.length-1].l;hi=candles[candles.length-1].h}const pdr=(hi-lo)*.08||Math.abs(hi)*.001||.001;pMinT=lo-pdr;pMaxT=hi+pdr;pMin=pMinT;pMax=pMaxT}async function loadCandles(interval){try{const bars=await bq.ohlc(SYMBOL,{interval,limit:300});if(Array.isArray(bars)&&bars.length){candles=bars.map(b=>{let t=b.time||b.t||0;if(t<1e12)t*=1000;return{t,open:+b.open||+b.o,high:+b.high||+b.h,low:+b.low||+b.l,close:+b.close||+b.c}});dRng();fol=1;fit()}draw()}catch(e){console.warn('ohlc',e)}}function updateLiveCandle(price){if(!candles.length)return;const now=Date.now();const iv={'1m':60,'5m':300,'15m':900,'1h':3600}[currentInterval]||60;const last=candles[candles.length-1];const tSec=last.t>1e12?last.t/1000:last.t;if(now/1000-tSec>=iv){candles.push({t:now,open:price,high:price,low:price,close:price});if(candles.length>1500)candles.shift()}else{last.close=price;if(price>last.high)last.high=price;if(price<last.low)last.low=price}if(price>dHi)dHi=price;if(price<dLo)dLo=price;dr=dHi-dLo||1}async function fetchPrice(){try{const data=await bq.tick(SYMBOL);const mid=+data.mid;if(!(mid>0))return;const prev=livePrice;livePrice=mid;updateLiveCandle(mid);const arrow=prev===null?'⌃':mid>=prev?'⌃':'⌄';priceEl.innerHTML=arrow+' '+mid.toFixed(5)+'<br><small>'+new Date(Date.now()+108e5).toISOString().slice(11,19)+' UTC+3</small>'}catch(e){}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101728';ctx.fillRect(0,0,W,H);if(!candles.length){ctx.fillStyle='#858ea3';ctx.font='13px Tahoma,Arial';ctx.textAlign='center';ctx.fillText('جاري تحميل البيانات…',W/2,H/2);return}const chartW=W-PAD_R;const chartH=H;if(fol)riT=candles.length-1+(PAD_R/ppcT)*0.5;ppcT=cx(ppcT,ppcMin,ppcMax);clRi();const vis=chartW/ppcT;if(Math.abs(ppcT-ppc)<0.01)ppc=ppcT;else ppc+=(ppcT-ppc)*T;if(Math.abs(ppcT-ppc)<0.002)ppc=ppcT;if(Math.abs(riT-ri)<0.01)ri=riT;else ri+=(riT-ri)*T;if(Math.abs(riT-ri)<0.001)ri=riT;const rg0=pMaxT-pMinT;if(Math.abs(pMaxT-pMax)<rg0*1e-4)pMax=pMaxT;else pMax+=(pMaxT-pMax)*T;if(Math.abs(pMinT-pMin)<rg0*1e-4)pMin=pMinT;else pMin+=(pMinT-pMin)*T;if(!(pMax>pMin)){pMax=pMinT+1e-6;pMin=pMinT}const lc=livePrice||candles[candles.length-1].c;if(fol){const mg=(pMaxT-pMinT)*.06;if(lc>pMaxT-mg)pMaxT=lc+mg;if(lc<pMinT+mg)pMinT=lc-mg}const X=k=>chartW-(ri-k)*ppc;const Y=p=>(pMax-p)/(pMax-pMin)*chartH;ctx.fillStyle='#141a29';ctx.fillRect(chartW,0,PAD_R,H);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.moveTo(chartW+.5,0);ctx.lineTo(chartW+.5,H);ctx.stroke();const rng=pMax-pMin;const steps=5;ctx.strokeStyle='rgba(255,255,255,.06)';ctx.font='11px Tahoma,Arial';ctx.textAlign='left';for(let i=0;i<=steps;i++){const y=(chartH/steps)*i;const price=pMax-(rng/steps)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(chartW,y);ctx.stroke();ctx.fillStyle='#78829c';ctx.fillText(NF(price),chartW+6,y+4)}const MS=[1,2,5,10,15,30,60,120,180,240,360,720,1440,2880,10080];let mst=10080;for(const m of MS){if(m*ppc>=80){mst=m;break}}const i0=Math.max(0,Math.floor(ri-vis)-2);const i1=Math.min(candles.length-1,Math.ceil(ri)+2);const cw=Math.max(1,.62*ppc);const ww=Math.max(1,.14*ppc);ctx.font='10px Tahoma,Arial';ctx.textAlign='center';for(let k=i0;k<=i1;k++){const c=candles[k];if(c.l>pMax||c.h<pMin)continue;const x=X(k);if(x<-cw-2||x>chartW+cw+2)continue;const up=c.close>=c.open;const col=up?'#2ebd85':'#f6465d';ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,Y(c.high));ctx.lineTo(x,Y(c.low));ctx.stroke();const oy=Y(c.open);const cy=Y(c.close);const topY=Math.min(oy,cy);const bodyH=Math.max(Math.abs(cy-oy),1);ctx.fillStyle=col;ctx.fillRect(x-cw/2,topY,cw,bodyH)}ctx.font='10px Tahoma,Arial';ctx.textAlign='center';for(let k=i0;k<=i1;k++){if(Math.round(candles[k].t/60000)%mst)continue;const x=X(k);if(x<22||x>chartW-22)continue;const dd=new Date(candles[k].t);const txt=mst>=1440?('0'+(dd.getMonth()+1)).slice(-2)+'/'+('0'+dd.getDate()).slice(-2):('0'+dd.getHours()).slice(-2)+':'+('0'+dd.getMinutes()).slice(-2);const tw=ctx.measureText(txt).width;ctx.fillStyle='rgba(16,23,40,.75)';ctx.fillRect(x-tw/2-4,H-15,tw+8,14);ctx.fillStyle='#78829c';ctx.fillText(txt,x,H-8)}if(livePrice!==null&&livePrice>=pMin&&livePrice<=pMax){const ly=Y(livePrice);ctx.strokeStyle='#3f8cff';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(chartW,ly);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#3f8cff';ctx.fillRect(chartW,ly-9,PAD_R,18);ctx.fillStyle='#fff';ctx.font='bold 11px Tahoma,Arial';ctx.textAlign='left';ctx.fillText(livePrice.toFixed(5),chartW+5,ly+4)}}function fr(now){requestAnimationFrame(fr);const dt=pt?Math.min(70,now-pt):16;pt=now;T=1-Math.exp(-dt/60);resize();draw()}function zoomAt(ax,f){if(!candles.length)return;const chartW=W-PAD_R;const np=cx(ppcT*f,ppcMin,ppcMax);if(np===ppcT)return;ax=cx(ax,0,chartW);const ia=riT-(chartW-ax)/ppcT;ppcT=np;riT=ia+(chartW-ax)/np;clRi();if(ax<chartW-2)fol=0}function zoomYAt(ay,f){const rp=pMaxT-pMinT;if(!(rp>0))return;const na=cx(ay,0,H)/H;const pa=pMaxT-na*rp;const nr=cx(rp/f,dr/400,dr*60);pMaxT=pa+na*nr;pMinT=pMaxT-nr}ch.addEventListener('pointerdown',ev=>{if(ev.target.closest('.tf')||ev.target.closest('.zm'))return;G.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});try{ch.setPointerCapture(ev.pointerId)}catch(_){}if(G.size===1){const r0=ch.getBoundingClientRect();const nw=Date.now();px0=ev.clientX;py0=ev.clientY;mode=ev.clientX-r0.left>W-PAD_R?3:1;moved=0;if(nw-tapT<300&&Math.abs(ev.clientX-tapX)<28&&Math.abs(ev.clientY-tapY)<28){tapT=0;fol=1;fit()}else{tapT=nw;tapX=ev.clientX;tapY=ev.clientY}}else if(G.size===2){mode=2;const a=[];G.forEach(v=>a.push(v));pDX=Math.abs(a[0].x-a[1].x);pDY=Math.abs(a[0].y-a[1].y);moved=0}});ch.addEventListener('pointermove',ev=>{const o=G.get(ev.pointerId);if(!o)return;o.x=ev.clientX;o.y=ev.clientY;if(mode===1&&G.size===1){const dx=ev.clientX-px0;const dy=ev.clientY-py0;if(!moved){if(Math.abs(dx)<3&&Math.abs(dy)<3)return;moved=1;KX=px0;KY=py0;bRi=riT;bLo=pMinT;bHi=pMaxT;bPP=ppcT}ppcT=bPP;fol=0;riT=bRi-(ev.clientX-KX)/ppcT;clRi();const rp=bHi-bLo;const pxp=rp/H;const dym=ev.clientY-KY;if(pxp>0&&Math.abs(dym)>1.5){pMaxT=bHi+dym*pxp;pMinT=bLo+dym*pxp}}else if(mode===3&&G.size===1){if(!moved){if(Math.abs(ev.clientY-py0)<2)return;moved=1;KY=py0;bLo=pMinT;bHi=pMaxT}const RT=ch.getBoundingClientRect().top;const na=cx(KY-RT,0,H)/H;const pa=bHi-na*(bHi-bLo);const f=Math.exp((ev.clientY-KY)*.006);const nr=cx((bHi-bLo)*f,dr/400,dr*60);pMaxT=pa+na*nr;pMinT=pMaxT-nr}else if(mode===2&&G.size>=2){const a=[];G.forEach(v=>a.push(v));const dx2=Math.abs(a[0].x-a[1].x);const dy2=Math.abs(a[0].y-a[1].y);const mx=(a[0].x+a[1].x)/2;const my=(a[0].y+a[1].y)/2;const r2=ch.getBoundingClientRect();if(pDX>4&&dx2>4&&Math.abs(dx2/pDX-1)>.002){zoomAt(mx-r2.left,dx2/pDX);pDX=dx2}if(pDY>12&&dy2>12&&Math.abs(dy2/pDY-1)>.004){zoomYAt(my-r2.top,dy2/pDY);pDY=dy2}}});function upf(ev){if(!G.has(ev.pointerId))return;G.delete(ev.pointerId);if(G.size===0){mode=0;moved=0;if(riT>=riMx()-.5)fol=1}else if(G.size===1){const a=[];G.forEach(v=>a.push(v));px0=a[0].x;py0=a[0].y;mode=a[0].x-ch.getBoundingClientRect().left>W-PAD_R?3:1;moved=0}}ch.addEventListener('pointerup',upf);ch.addEventListener('pointercancel',upf);ch.addEventListener('wheel',ev=>{ev.preventDefault();const r2=ch.getBoundingClientRect();const ax=cx(ev.clientX-r2.left,0,W-PAD_R-1);if(ev.ctrlKey)zoomYAt(ev.clientY-r2.top,Math.exp(-Math.max(-100,Math.min(100,ev.deltaY))*.01));else zoomAt(ax,Math.exp(.002*-Math.max(-100,Math.min(100,ev.deltaY))))},{passive:false});document.getElementById('zi').onclick=()=>zoomAt(fol?W-PAD_R:(W-PAD_R)/2,1.3);document.getElementById('zo').onclick=()=>zoomAt(fol?W-PAD_R:(W-PAD_R)/2,1/1.3);document.querySelectorAll('.tf button').forEach(btn=>{btn.addEventListener('click',async()=>{document.querySelectorAll('.tf button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentInterval=btn.dataset.interval;await loadCandles(currentInterval)})});d.onchange=function(){SYMBOL=this.value;candles=[];livePrice=null;loadCandles(currentInterval)};resize();await loadCandles('1m');fetchPrice();setInterval(fetchPrice,1000);setInterval(()=>loadCandles(currentInterval),60000);requestAnimationFrame(fr);</script></body></html>
