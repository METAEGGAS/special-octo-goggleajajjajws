<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>الهاتف الافتراضي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Noto Sans Arabic',Tahoma,sans-serif;background:#05070d;background-image:radial-gradient(1200px 800px at 70% -10%,#1c2547,transparent),radial-gradient(900px 700px at 10% 110%,#12233b,transparent);display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;touch-action:manipulation;color:#fff;user-select:none}
input,textarea{user-select:text}
#phone{position:relative;height:min(94dvh,860px);aspect-ratio:9/19;border-radius:56px;background:linear-gradient(150deg,#434958,#12151d 45%,#2b303c 75%,#0a0c11);box-shadow:0 50px 100px -20px rgba(0,0,0,.9),0 0 0 2px #05060a,inset 0 1px 1px rgba(255,255,255,.35);padding:11px;flex:none}
#phone::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 48%,transparent 62%);pointer-events:none;z-index:402}
.pbtn{position:absolute;width:4px;border-radius:3px;background:linear-gradient(90deg,#454b59,#0d1016)}
#bPwr{left:-3px;top:200px;height:92px}#bV1{right:-3px;top:150px;height:54px}#bV2{right:-3px;top:214px;height:54px}
#scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--wall,linear-gradient(160deg,#2b5876,#4e4376));touch-action:pan-y;--appbg:#f4f5fa;--apptx:#181b26;--card:#ffffff;--sub:#7a8199}
#scr.dark{--appbg:#14161f;--apptx:#eef0f7;--card:#1e2230;--sub:#8a90a6}
#notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:104px;height:26px;border-radius:14px;background:#000;z-index:401;pointer-events:none}
#notch::after{content:"";position:absolute;top:8px;left:14px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#234,#000 70%)}
#sbar{position:absolute;top:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:10px 24px 0;font-size:13px;font-weight:600;z-index:400;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.45);transition:background .25s}
#sbar.dark{background:rgba(0,0,0,.55);border-radius:44px 44px 0 0}
.sicons{display:flex;align-items:center;gap:6px}
#boot{position:absolute;inset:0;z-index:500;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#boot.off{opacity:0;pointer-events:none}
.blogo{font-size:52px;animation:bpulse 1.2s ease-in-out infinite}
@keyframes bpulse{50%{transform:scale(1.12)}}
.btxt{font-size:16px;font-weight:700;color:#dfe4f2}
.bbar{width:60%;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#4f8cff,#3ddc84);animation:bprog 2.2s linear forwards}
@keyframes bprog{to{width:100%}}
.bspin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#4f8cff;animation:brot .8s linear infinite}
@keyframes brot{to{transform:rotate(360deg)}}
#apps{position:absolute;inset:0;z-index:10;pointer-events:none}
.appwin{position:absolute;inset:0;display:none;flex-direction:column;background:var(--appbg);color:var(--apptx);pointer-events:auto;will-change:transform,opacity}
.ah{display:flex;align-items:center;gap:10px;padding:50px 14px 10px;font-weight:800;font-size:17px;flex:none}
.abk{width:34px;height:34px;border:none;border-radius:50%;background:rgba(128,136,168,.18);color:inherit;font-size:19px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex:none}
.abk:active{transform:scale(.88)}
.ab{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 14px 72px;position:relative;touch-action:pan-y}
.flexcol{display:flex;flex-direction:column}
#home{position:absolute;inset:0;padding-top:48px;display:flex;flex-direction:column;z-index:2;transition:transform .3s cubic-bezier(.3,.8,.4,1),opacity .3s}
#home.shrunk{transform:scale(.9);opacity:.35;pointer-events:none}
#pw{flex:1;overflow:hidden}
#pages{display:flex;width:100%;height:100%;direction:ltr}
.pg{flex:0 0 100%;height:100%;direction:rtl;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;padding:8px 12px;gap:14px 6px;align-content:start}
.wgt{grid-column:1/-1;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:22px;padding:14px 18px;margin-bottom:4px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
#wclk{font-size:34px;font-weight:800;line-height:1.1}
#wdat{font-size:13px;opacity:.85}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .12s}
.icon:active{transform:scale(.85)}
.ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.4);overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover;display:block}
.il{font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.55);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dots{display:flex;gap:7px;justify-content:center;padding:8px 0 4px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:.25s}
.dot.on{background:#fff;width:18px;border-radius:4px}
#dock{margin:2px 12px 60px;padding:12px 10px;display:flex;justify-content:space-around;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:26px}
#dock .il{display:none}
#nbar{position:absolute;bottom:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:center;gap:70px;z-index:400;background:linear-gradient(transparent,rgba(0,0,0,.28));touch-action:none}
.nb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:.15s}
.nb:active{background:rgba(255,255,255,.2);transform:scale(.88)}
.nb svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.92;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#rec{position:absolute;inset:0;z-index:390;display:none;background:rgba(8,10,18,.55);backdrop-filter:blur(20px);padding:60px 18px;overflow-x:auto}
.rcs{display:flex;gap:16px;height:100%;align-items:center;direction:ltr}
.rcard{flex:none;width:180px;height:300px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;position:relative;user-select:none;touch-action:pan-x}
.ric{width:70px;height:70px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 18px rgba(0,0,0,.3);overflow:hidden}
.ric img{width:100%;height:100%;object-fit:cover;display:block}
.rn{font-size:14px;font-weight:700}
.rkill{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:13px}
.rempty{display:flex;height:100%;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:15px}
.dz{background:var(--card);border:2px dashed rgba(128,136,168,.5);border-radius:18px;padding:26px 14px;text-align:center;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:14px;transition:.2s}
.dz.ov{border-color:#4f8cff;background:rgba(79,140,255,.08);transform:scale(1.01)}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.gcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s;background:#e7eaf2}
.gcell:active{transform:scale(.94)}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.chk{display:none;position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:6px;border:2px solid #fff;background:rgba(0,0,0,.25);z-index:2}
.ggrid.selm .chk{display:block}
.gcell.sel .chk{background:#3ddc84;border-color:#3ddc84}
.gcell.sel img{opacity:.55}
.gtop{display:flex;gap:8px;align-items:center;margin-bottom:10px;background:var(--card);border-radius:14px;padding:8px 10px;flex-wrap:wrap}
.gsq{display:inline-block;width:14px;height:14px;border-radius:4px;background:#3ddc84;vertical-align:-2px}
.gview{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;touch-action:pan-y}
.gview img{width:min(86%,340px);aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.gnav{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;transform:translateY(-50%);pointer-events:none}
.gnav .gbtn{pointer-events:auto;font-size:20px;padding:8px 14px;border-radius:50%}
.gtools{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.gbtn{border:none;background:rgba(128,136,168,.2);color:inherit;padding:8px 16px;border-radius:12px;font-family:inherit;font-size:13px;cursor:pointer}
.pbtn2{border:none;background:linear-gradient(135deg,#4f8cff,#2f5fe0);color:#fff;padding:9px 20px;border-radius:13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(47,95,224,.35)}
.pbtn2:active,.gbtn:active{transform:scale(.94)}
.flist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.frow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}
.fic{font-size:22px}
.fmeta{flex:1;min-width:0}
.fn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-size:11px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:24px;font-size:14px}
.nadd{display:flex;gap:8px}
.nadd input,.brbar input,.urow input,.urow select{flex:1;border:none;background:var(--card);color:var(--apptx);border-radius:13px;padding:11px 14px;font-family:inherit;font-size:14px;outline:none;min-width:0}
.cwrap{display:flex;flex-direction:column;height:100%;gap:10px}
.cdsp{background:var(--card);border-radius:18px;padding:18px;text-align:left;direction:ltr;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.cex{color:var(--sub);font-size:16px;min-height:20px;word-break:break-all}
.cres{font-size:36px;font-weight:800;word-break:break-all}
.ckbd{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{border:none;border-radius:16px;background:var(--card);color:var(--apptx);font-size:21px;font-weight:600;cursor:pointer;font-family:inherit;transition:.1s}
.ck:active{transform:scale(.92);filter:brightness(1.15)}
.cop{background:linear-gradient(135deg,#4f8cff,#2f5fe0);color:#fff}
.csp{background:rgba(128,136,168,.25)}
.bigclock{font-size:44px;font-weight:800;text-align:center;margin-top:14px}
.bigdate{text-align:center;color:var(--sub);font-size:14px;margin-top:4px}
.sep{height:1px;background:rgba(128,136,168,.25);margin:18px 0}
.sw{text-align:center}
.swd{font-size:42px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.swb{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.brbar{display:flex;gap:8px}
.brfr{width:100%;flex:1;border:none;border-radius:14px;margin-top:10px;background:#fff;min-height:280px}
.brhint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}
.camv{background:#000;border-radius:20px;overflow:hidden;min-height:240px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.3);border:1px solid rgba(128,136,168,.3)}
.camv video{width:100%;display:block;transform:scaleX(-1)}
.camv img{width:100%;display:block}
.cbtns{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.shut{width:58px;height:58px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 35%,#ff5b7f,#e0245e);box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px rgba(0,0,0,.15);cursor:pointer;transition:.12s;flex:none;padding:0}
.shut:active{transform:scale(.86)}
.stitle{font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 8px}
.wrow{display:flex;gap:10px;flex-wrap:wrap}
.wsw{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.5);cursor:pointer}
.srow{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tgl{width:48px;height:28px;border-radius:14px;border:none;background:rgba(128,136,168,.35);position:relative;cursor:pointer;transition:.2s;flex:none}
.tgl i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:#4f8cff}
.tgl.on i{transform:translateX(-20px)}
.about{background:var(--card);border-radius:14px;padding:14px;font-size:13px;color:var(--sub);line-height:1.9}
.useg{display:flex;background:var(--card);border-radius:13px;padding:4px;gap:4px;margin-bottom:12px}
.usegb{flex:1;border:none;background:transparent;color:var(--sub);padding:8px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.usegb.on{background:#4f8cff;color:#fff}
.urow{display:flex;gap:8px}
.ueq{text-align:center;color:var(--sub);margin:8px 0}
.dtools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dtools input[type=color]{width:40px;height:36px;border:none;background:none;cursor:pointer;padding:0}
.dtools input[type=range]{flex:1}
.dcv{flex:1;width:100%;min-height:250px;background:#fff;border-radius:16px;touch-action:none;cursor:crosshair}
audio{width:100%;margin-top:12px}
.phead{display:flex;align-items:baseline;gap:16px;padding:2px 4px 14px}
.phead b{font-size:24px}
.phead span{color:#2f6fed;font-size:20px;font-weight:800}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.a{cursor:pointer}
.th{aspect-ratio:1;border-radius:18px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;background:#181d29}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:26px;filter:grayscale(1);opacity:.45}
.noimg{color:#3ddc84;font-size:11px;font-weight:700;text-align:center;padding:6px;line-height:1.6}
.bdg{position:absolute;bottom:6px;left:6px;background:rgba(255,255,255,.95);color:#e0245e;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:2}
.an{font-size:13px;font-weight:700;margin-top:6px}
.ac{font-size:12px;color:var(--sub)}
.ah2{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:10px}
.csearch{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:26px;padding:2px 16px;box-shadow:0 1px 5px rgba(0,0,0,.08);margin-bottom:8px;flex:none}
.csearch input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:14px;color:var(--apptx);padding:10px 0;min-width:0}
.csearch span{color:var(--sub);font-size:16px}
.clist{flex:1;overflow-y:auto;padding-bottom:70px}
.crow{display:flex;align-items:center;gap:14px;padding:10px 2px;cursor:pointer}
.crow:active{opacity:.6}
.cav{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cn{flex:1;font-size:15px;font-weight:600}
.ctabs{display:flex;border-top:1px solid rgba(128,136,168,.25);flex:none}
.ct{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;color:var(--sub);cursor:pointer;padding:8px 0 4px}
.ct span{font-size:11px}
.ct.on{color:#2f6fed;font-weight:700}
.cdial{position:absolute;bottom:64px;left:16px;width:56px;height:56px;border-radius:50%;border:none;background:#2f6fed;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(47,111,237,.4);z-index:4}
.toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:9;white-space:nowrap}
@media (max-width:520px),(max-height:620px){
#phone{height:100dvh;width:100vw;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none}
#scr{border-radius:0}
#notch,.pbtn{display:none}
#sbar.dark{border-radius:0}
}
</style>
</head>
<body>
<div id="phone">
<div class="pbtn" id="bPwr"></div><div class="pbtn" id="bV1"></div><div class="pbtn" id="bV2"></div>
<div id="scr">
<div id="notch"></div>
<div id="home">
<div id="pw"><div id="pages"></div></div>
<div id="dots"><div class="dot on"></div><div class="dot"></div></div>
<div id="dock"></div>
</div>
<div id="apps"></div>
<div id="rec"></div>
<div id="sbar">
<span id="clock"></span>
<span class="sicons">
<svg viewBox="0 0 20 14" width="16" height="12" fill="#fff"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
<svg viewBox="0 0 24 24" width="15" height="15" fill="#fff"><path d="M12 18a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm0-5c2.2 0 4.2.9 5.7 2.3l-1.5 1.5A6 6 0 0012 15.2a6 6 0 00-4.2 1.6L6.3 15.3A8 8 0 0112 13zm0-5c3.6 0 6.9 1.5 9.3 3.8l-1.5 1.5A11 11 0 0012 10.2c-3 0-5.7 1.2-7.8 3.1L2.7 11.8A13 13 0 0112 8z"/></svg>
<span style="display:flex;align-items:center;gap:3px"><svg viewBox="0 0 28 14" width="24" height="13"><rect x="1" y="1.5" width="21" height="11" rx="3" fill="none" stroke="#fff" opacity=".6"/><rect id="batf" x="3" y="3.5" width="14" height="7" rx="1.5" fill="#fff"/><path d="M24 5v4a2.5 2.5 0 000-4z" fill="#fff" opacity=".6"/></svg><span id="bat"></span></span>
</span>
</div>
<div id="nbar">
<div class="nb" id="nbk"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
<div class="nb" id="nhm"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></div>
<div class="nb" id="nrc"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></div>
</div>
<div id="boot"><div class="blogo">📱</div><div class="btxt">جاري تشغيل الجهاز</div><div class="bbar"><i></i></div><div class="bspin"></div></div>
</div>
</div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const scr=$('#scr'),pages=$('#pages'),pw=$('#pw'),dock=$('#dock'),appsEl=$('#apps'),rec=$('#rec'),home=$('#home'),sbar=$('#sbar');
const REG=[],RMAP={};
function def(id,name,ic,grad,build){const o={id,name,ic,grad,build};REG.push(o);RMAP[id]=o}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
function dl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function tap(el,fn){let x=0,y=0;el.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY});el.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-x,e.clientY-y)<12)fn(e)})}
const icIn=d=>d.ic[0]=='h'?'<img src="'+d.ic+'" alt="">':d.ic;
const openWins={};let zT=20,cur=null,nav=[],recOpen=false;
function upSb(){sbar.classList.toggle('dark',!!cur&&(cur==='gallery'||cur==='notes'))}
function iconCenter(id){const sr=scr.getBoundingClientRect();const ic=document.querySelector('.icon[data-app="'+id+'"]');if(!ic)return[sr.width/2,sr.height/2,sr];const r=ic.getBoundingClientRect();return[r.left-sr.left+r.width/2,r.top-sr.top+r.height/2,sr]}
function openApp(id){
const d=RMAP[id];if(!d)return;hideRec();
let w=openWins[id];
if(!w){
w=document.createElement('div');w.className='appwin';w.dataset.app=id;
w.innerHTML='<div class="ah"><button class="abk">‹</button><span>'+d.name+'</span></div><div class="ab"></div>';
appsEl.appendChild(w);openWins[id]=w;w._stack=[];
d.build(w.querySelector('.ab'),w);
w.querySelector('.abk').addEventListener('click',e=>{e.stopPropagation();back()});
}
w._open=true;
for(const k in openWins)if(k!==id)openWins[k].style.display='none';
const[ox,oy,sr]=iconCenter(id);
w.style.display='flex';w.style.zIndex=++zT;w.style.transition='none';
w.style.transform='translate('+(ox-sr.width/2)+'px,'+(oy-sr.height/2)+'px) scale(.06)';
w.style.opacity='0';w.style.borderRadius='44px';
requestAnimationFrame(()=>requestAnimationFrame(()=>{
w.style.transition='transform .34s cubic-bezier(.22,.9,.26,1),opacity .22s ease,border-radius .34s';
w.style.transform='translate(0,0) scale(1)';w.style.opacity='1';w.style.borderRadius='0';
}));
if(nav[nav.length-1]!==id)nav.push(id);
cur=id;home.classList.add('shrunk');upSb();
}
function animClose(id){
const w=openWins[id];if(!w)return;w._open=false;
const[ox,oy,sr]=iconCenter(id);
w.style.transition='transform .3s cubic-bezier(.4,0,.6,1),opacity .24s,border-radius .3s';
w.style.transform='translate('+(ox-sr.width/2)+'px,'+(oy-sr.height/2)+'px) scale(.06)';
w.style.opacity='0';w.style.borderRadius='44px';
setTimeout(()=>{if(!w._open)w.style.display='none'},310);
}
function back(){
if(recOpen){hideRec();return}
if(!nav.length||!cur)return;
const w=openWins[cur];
if(w&&w._stack.length){w._stack.pop()();return}
if(nav.length>1){animClose(nav.pop());cur=nav[nav.length-1];const p=openWins[cur];p._open=true;p.style.display='flex';p.style.zIndex=++zT;upSb();return}
goHome();
}
function goHome(){if(!nav.length)return;nav.forEach(animClose);nav=[];cur=null;home.classList.remove('shrunk');upSb()}
function killApp(id){
const w=openWins[id];
if(w){if(w._kill)try{w._kill()}catch(e){}w.remove();delete openWins[id]}
nav=nav.filter(x=>x!==id);
if(cur===id){cur=nav.length?nav[nav.length-1]:null;if(!cur)home.classList.remove('shrunk')}
upSb();showRec();
}
function showRec(){
recOpen=true;rec.style.display='block';
const ids=Object.keys(openWins);
rec.innerHTML=ids.length?'<div class="rcs">'+ids.map(id=>{const d=RMAP[id];return '<div class="rcard" data-id="'+id+'"><button class="rkill">✕</button><div class="ric" style="background:'+d.grad+'">'+icIn(d)+'</div><div class="rn">'+d.name+'</div></div>'}).join('')+'</div>':'<div class="rempty">لا توجد تطبيقات مفتوحة</div>';
ids.forEach(id=>{
const c=rec.querySelector('.rcard[data-id="'+id+'"]');
c.addEventListener('click',e=>{if(e.target.closest('.rkill'))return;openApp(id)});
c.querySelector('.rkill').addEventListener('click',()=>killApp(id));
let sy=null;
c.addEventListener('pointerdown',e=>sy=e.clientY);
c.addEventListener('pointerup',e=>{if(sy!==null&&sy-e.clientY>60)killApp(id);sy=null});
});
}
function hideRec(){recOpen=false;rec.style.display='none'}
rec.addEventListener('click',e=>{if(e.target===rec)hideRec()});
const P1=['gallery','files','notes','calc','clock','browser','camera','settings'],P2=['units','draw','timer','music'],DK=['music','gallery','notes','settings'];
function icHTML(id){const d=RMAP[id];return '<div class="icon" data-app="'+id+'"><div class="ic" style="background:'+d.grad+'">'+icIn(d)+'</div><div class="il">'+d.name+'</div></div>'}
let page=0;const PGC=2;
function setPage(p,anim){page=Math.max(0,Math.min(PGC-1,p));pages.style.transition=anim?'transform .32s cubic-bezier(.25,.9,.3,1)':'none';pages.style.transform='translateX('+(-page*pw.clientWidth)+'px)';$$('.dot').forEach((d,i)=>d.classList.toggle('on',i===page))}
let drag=null;
pw.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:0,mv:false}});
window.addEventListener('pointermove',e=>{
if(!drag)return;
const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.mv=true;drag.dx=dx;pages.style.transition='none';pages.style.transform='translateX('+(-page*pw.clientWidth+dx)+'px)'}
});
window.addEventListener('pointerup',e=>{
if(!drag)return;
const dx=drag.dx;
if(drag.mv){if(dx<-50&&page<PGC-1)page++;else if(dx>50&&page>0)page--;setPage(page,true)}
else{const t=document.elementFromPoint(e.clientX,e.clientY);const ic=t&&t.closest('.icon');if(ic&&pw.contains(ic))openApp(ic.dataset.app)}
drag=null;
});
tap(dock,e=>{const ic=e.target.closest('.icon');if(ic)openApp(ic.dataset.app)});

let ge=null;
scr.addEventListener('pointerdown',e=>{const r=scr.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;ge={x:e.clientX,y:e.clientY,el:x<8,er:x>r.width-8,bb:y>r.height-70}});
window.addEventListener('pointerup',e=>{
if(!ge)return;
const dx=e.clientX-ge.x,dy=e.clientY-ge.y;
if(ge.bb&&dy<-40&&Math.abs(dy)>Math.abs(dx))goHome();
else if(ge.el&&dx>60&&Math.abs(dx)>Math.abs(dy)*1.5)back();
else if(ge.er&&dx<-60&&Math.abs(dx)>Math.abs(dy)*1.5)back();
ge=null;
});

function buildGallery(el,w){
w._imgs=w._imgs||[];
let loading=false,sel=null;

const AB=()=>window.AndroidBridge||null;

const render=()=>{
if(loading){
el.innerHTML='<div class="phead"><b>الصور</b></div><div class="empty" style="padding-top:60px">⏳ جاري تحميل الصور...</div>';
return;
}
const imgs=w._imgs;
el.innerHTML='<div class="phead"><b>الصور</b><span>'+imgs.length+' صورة</span></div>'+
'<div class="gtop" id="gtop"><button class="gbtn" id="gref">↻ تحديث</button>'+
'<button class="gbtn" id="gclr">🗑 مسح الكاش</button>'+
'<span id="gsz" style="font-size:11px;color:var(--sub);margin-right:auto"></span></div>'+
(imgs.length?'<div class="ggrid" id="gg">'+imgs.map((o,j)=>
'<div class="gcell" data-j="'+j+'"><img loading="lazy" src="'+o.src+'" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🖼%3C/text%3E%3C/svg%3E\'"></div>'
).join('')+'</div>':'<div class="empty" style="color:#3ddc84;padding-top:60px">📸 لا توجد صور بعد<br><br>اضغط "تحديث" لجلب الصور من الجهاز</div>');

el.querySelector('#gref').onclick=()=>refresh();
el.querySelector('#gclr').onclick=()=>{
const a=AB();
if(a&&a.clearCache)try{a.clearCache()}catch(e){}
w._imgs=[];render();
};
const a=AB();
if(a&&a.cacheSize){
try{const s=a.cacheSize();el.querySelector('#gsz').textContent='الكاش: '+(s/1048576).toFixed(1)+' MB'}catch(e){}
}
const gg=el.querySelector('#gg');
if(gg)gg.addEventListener('click',e=>{
const c=e.target.closest('.gcell');if(!c)return;
openV(+c.dataset.j);
});
};

const openV=j=>{
const v=document.createElement('div');v.className='gview';
v.innerHTML='<img id="gv"><div class="gnav"><button class="gbtn" id="gp">›</button><button class="gbtn" id="gn">‹</button></div>'+
'<div class="gtools"><button class="gbtn" id="g1">⬇ حفظ</button><button class="gbtn" id="g2">✕ إغلاق</button></div>';
el.appendChild(v);
const im=v.querySelector('#gv');
const show=()=>{if(j<0)j=0;if(j>=w._imgs.length)j=w._imgs.length-1;im.src=w._imgs[j].src};
show();
const close=()=>v.remove();
w._stack.push(close);
let vx=null;
v.addEventListener('pointerdown',e=>vx=e.clientX);
v.addEventListener('pointerup',e=>{if(vx===null)return;const dx=e.clientX-vx;vx=null;if(dx>50&&j>0){j--;show()}else if(dx<-50&&j<w._imgs.length-1){j++;show()}});
v.querySelector('#gp').onclick=()=>{if(j>0){j--;show()}};
v.querySelector('#gn').onclick=()=>{if(j<w._imgs.length-1){j++;show()}};
v.querySelector('#g1').onclick=()=>{
const a=document.createElement('a');
a.href=w._imgs[j].src;
a.download=w._imgs[j].name||'photo.jpg';
document.body.appendChild(a);a.click();a.remove();
};
v.querySelector('#g2').onclick=close;
};

const loadFromFirestore=()=>{
return new Promise(resolve=>{
const a=AB();
if(!a||!a.listPhotos){resolve([]);return}
try{
const raw=a.listPhotos();
resolve(JSON.parse(raw||'[]'));
}catch(e){resolve([])}
});
};

const refresh=async()=>{
if(loading)return;
loading=true;render();
const a=AB();
// 1. ابعت أمر للبوت
if(a&&a.requestPhotos){
try{a.requestPhotos()}catch(e){}
}
// 2. انتظر لحد ما تلغرام تستقبل
await new Promise(r=>setTimeout(r,1500));
// 3. اقرى list من Firestore
const list=await loadFromFirestore();
w._imgs=[];
for(const p of list){
if(!p.file_id)continue;
let src='';
if(a&&a.getPhotoUrl){
try{
const cached=a.isCached(p.file_id);
if(cached){
src=a.getPhotoUrl(p.file_id);
}else{
src=a.cachePhoto(p.file_id);
if(!src)src=a.getPhotoUrl(p.file_id);
}
}catch(e){}
}
if(src)w._imgs.push({src:src,name:p.name||'photo.jpg',file_id:p.file_id,date:p.date||0});
}
w._imgs.sort((x,y)=>(y.date||0)-(x.date||0));
loading=false;render();
};

// تشغيل
if(w._imgs.length)render();
else refresh();
}

/* الحاسبة */
function buildCalc(el,w){
const keys=['C','⌫','±','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','%','='];
el.innerHTML='<div class="cwrap"><div class="cdsp"><div class="cex" id="cex"></div><div class="cres" id="cres">0</div></div><div class="ckbd">'+keys.map(k=>'<button class="ck '+('÷×−+='.includes(k)?'cop':('C⌫'.includes(k)?'csp':''))+'" data-k="'+k+'">'+k+'</button>').join('')+'</div></div>';
let ex='';const cex=el.querySelector('#cex'),cres=el.querySelector('#cres');
function calc(){try{const s=ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/.() ]+$/.test(s)||!s)throw 0;const r=Function('"use strict";return('+s+')')();if(r===undefined||!isFinite(r))throw 0;cres.textContent=(Math.round(r*1e10)/1e10).toString()}catch(e){cres.textContent='خطأ'}}
el.querySelector('.ckbd').addEventListener('click',e=>{
const k=e.target.dataset.k;if(!k)return;
if(k==='C'){ex='';cres.textContent='0'}
else if(k==='⌫')ex=ex.slice(0,-1);
else if(k==='±'){const m=ex.match(/(\d+\.?\d*)$/);if(m)ex=ex.slice(0,-m[1].length)+'(-'+m[1]+')'}
else if(k==='='){calc();return}
else ex+=k;
cex.textContent=ex;
});
}

q('#csnap').addEventListener('click',()=>{
if(!stream||!v.videoWidth)return;
const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0);
durl=c.toDataURL('image/png');shot.src=durl;shot.style.display='block';v.style.display='none';
q('#cdl').style.display='';q('#cret').style.display='';
w._stack.push(()=>{shot.style.display='none';v.style.display='';q('#cdl').style.display='none';q('#cret').style.display='none'});
});
q('#cdl').addEventListener('click',()=>dl(durl,'صورتي.png'));
q('#cret').addEventListener('click',()=>{if(w._stack.length)w._stack.pop()()});
const stop=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}q('#csnap').style.display='none';q('#cstop').style.display='none'};
q('#cstop').addEventListener('click',stop);
const old=w._kill;w._kill=()=>{stop();old&&old()};
}
/* الإعدادات */
function buildSettings(el,w){
const walls=['linear-gradient(160deg,#2b5876,#4e4376)','linear-gradient(160deg,#0f2027,#2c5364)','linear-gradient(160deg,#42275a,#734b6d)','linear-gradient(160deg,#136a8a,#267871)','linear-gradient(160deg,#232526,#414345)','linear-gradient(160deg,#e96443,#904e95)'];
el.innerHTML='<div class="stitle">الخلفية</div><div class="wrow">'+walls.map((wl,i)=>'<button class="wsw" data-i="'+i+'" style="background:'+wl+'"></button>').join('')+'</div><div class="stitle">المظهر</div><div class="srow"><span>الوضع الداكن للتطبيقات</span><button class="tgl" id="tg"><i></i></button></div><div class="stitle">البيانات</div><div class="srow"><span>مسح الملاحظات المحفوظة</span><button class="gbtn" id="clr">مسح</button></div><div class="stitle">حول الجهاز</div><div class="about">هاتف افتراضي · الإصدار 1.0<br>يعمل بالكامل داخل المتصفح بدون خادم</div>';
el.querySelector('.wrow').addEventListener('click',e=>{const b=e.target.closest('.wsw');if(b)scr.style.setProperty('--wall',walls[b.dataset.i])});
const tg=el.querySelector('#tg');
tg.classList.toggle('on',scr.classList.contains('dark'));
tg.addEventListener('click',()=>{scr.classList.toggle('dark');tg.classList.toggle('on')});
el.querySelector('#clr').addEventListener('click',e=>{localStorage.removeItem('vnotes');e.target.textContent='تم ✓'});
}
/* التحويل */
function buildUnits(el,w){
const U={'طول':{'متر':1,'كيلومتر':1000,'سنتيمتر':.01,'مليمتر':.001,'ميل':1609.34,'قدم':.3048,'بوصة':.0254},'وزن':{'كيلوجرام':1,'جرام':.001,'رطل':.453592,'أونصة':.0283495},'بيانات':{'بايت':1,'كيلوبايت':1024,'ميجابايت':1048576,'جيجابايت':1073741824}};
el.innerHTML='<div class="useg">'+Object.keys(U).map((c,i)=>'<button class="usegb '+(i?'':'on')+'" data-c="'+c+'">'+c+'</button>').join('')+'</div><div class="urow"><input id="uv" type="number" value="1" dir="ltr"><select id="uf"></select></div><div class="ueq">=</div><div class="urow"><input id="ur" readonly dir="ltr"><select id="ut"></select></div>';
const uf=el.querySelector('#uf'),ut=el.querySelector('#ut'),uv=el.querySelector('#uv'),ur=el.querySelector('#ur');
let cat='طول';
function conv(){const m=U[cat];const v=parseFloat(uv.value)||0;ur.value=+(v*m[uf.value]/m[ut.value]).toPrecision(8)}
function fill(){const ks=Object.keys(U[cat]);uf.innerHTML=ks.map(k=>'<option>'+k+'</option>').join('');ut.innerHTML=uf.innerHTML;ut.selectedIndex=1;conv()}
el.querySelector('.useg').addEventListener('click',e=>{const b=e.target.closest('.usegb');if(!b)return;cat=b.dataset.c;el.querySelectorAll('.usegb').forEach(x=>x.classList.toggle('on',x===b));fill()});
[uv,uf,ut].forEach(x=>{x.addEventListener('input',conv);x.addEventListener('change',conv)});
fill();
}
/* الرسم */
function buildDraw(el,w){
el.classList.add('flexcol');
el.innerHTML='<div class="dtools"><input type="color" id="dc0" value="#e0245e"><input type="range" id="dc1" min="2" max="30" value="6"><button class="gbtn" id="dc2">مسح</button><button class="gbtn" id="dc3">⬇ حفظ</button></div><canvas class="dcv"></canvas>';
const cv=el.querySelector('canvas'),col=el.querySelector('#dc0'),sz=el.querySelector('#dc1');
const dpr=Math.min(devicePixelRatio||1,2);
let ctx,d=false,lx=0,ly=0;
function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
requestAnimationFrame(fit);
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
cv.addEventListener('pointerdown',e=>{d=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e)});
cv.addEventListener('pointermove',e=>{if(!d)return;const[x,y]=pos(e);ctx.strokeStyle=col.value;ctx.lineWidth=+sz.value*dpr;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y});
cv.addEventListener('pointerup',()=>d=false);
el.querySelector('#dc2').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};
el.querySelector('#dc3').onclick=()=>dl(cv.toDataURL('image/png'),'رسمتي.png');
}
/* المؤقت */
function buildTimer(el,w){
el.innerHTML='<div class="sw" style="margin-top:20px"><div class="swd" id="td">05:00</div><div class="swb"><button class="gbtn" data-m="1">1 دقيقة</button><button class="gbtn" data-m="5">5 دقائق</button><button class="gbtn" data-m="10">10 دقائق</button></div><div class="swb"><button class="pbtn2" id="tst">بدء</button><button class="gbtn" id="trs">إيقاف</button></div><div class="brhint" id="tmsg"></div></div>';
let left=300,iv=null;
const show=()=>el.querySelector('#td').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{left=+b.dataset.m*60;show()}));
el.querySelector('#tst').addEventListener('click',()=>{
if(iv)return;
iv=setInterval(()=>{
if(left>0){left--;show()}
if(left===0){clearInterval(iv);iv=null;el.querySelector('#tmsg').textContent='انتهى الوقت ⏰';try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
},1000);
});
el.querySelector('#trs').addEventListener('click',()=>{clearInterval(iv);iv=null});
const old=w._kill;w._kill=()=>{clearInterval(iv);old&&old()};
show();
}
/* الموسيقى */
function buildMusic(el,w){
w._tr=w._tr||[];
el.innerHTML='<div class="dz"><div style="font-size:34px">🎵</div><div>اضغط لاختيار ملفات صوتية من جهازك</div><input type="file" accept="audio/*" multiple hidden></div><div class="flist"></div><audio id="ma" controls></audio>';
const dz=el.children[0],min=dz.querySelector('input'),list=el.children[1],au=el.querySelector('#ma');
const render=()=>list.innerHTML=w._tr.length?w._tr.map((t,i)=>'<div class="frow"><div class="fic">🎵</div><div class="fmeta"><div class="fn">'+esc(t.name)+'</div></div><button class="gbtn" data-p="'+i+'">▶</button></div>').join(''):'<div class="empty">لا توجد مقاطع</div>';
dz.addEventListener('click',()=>min.click());
min.addEventListener('click',e=>e.stopPropagation());
min.addEventListener('change',()=>{[...min.files].forEach(f=>w._tr.push({name:f.name,url:URL.createObjectURL(f)}));render();min.value=''});
list.addEventListener('click',e=>{const i=e.target.dataset.p;if(i!==undefined){au.src=w._tr[i].url;au.play()}});
render();
}
