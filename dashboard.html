<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quotex Direct</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body{background:#0d1117;color:#e6edf3;min-height:100vh;padding:14px}

.card{background:#161b22;border:1px solid #30363d;border-radius:14px;
  padding:18px;max-width:520px;margin:0 auto 12px}
h1{font-size:17px;font-weight:700;margin-bottom:6px}
.sub{font-size:12px;color:#8b949e;margin-bottom:16px;line-height:1.5}

.label{display:block;font-size:12px;color:#8b949e;margin-bottom:6px;font-weight:600}
.input{width:100%;height:46px;background:#0d1117;border:1px solid #30363d;
  border-radius:10px;padding:0 12px;color:#e6edf3;font-size:12.5px;
  outline:none;font-family:monospace;margin-bottom:12px}
.input:focus{border-color:#1f6feb}

.btn{width:100%;height:48px;border:0;border-radius:10px;
  font-size:14.5px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:active{opacity:.75}
.btn-primary{background:#1f6feb;color:#fff}
.btn-success{background:#238636;color:#fff}
.btn-secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}

.status{padding:11px 14px;border-radius:10px;font-size:13px;
  margin-top:12px;display:none;text-align:center;line-height:1.6}
.status.show{display:block}
.status.ok{background:#0d2818;color:#3fb950;border:1px solid #238636}
.status.err{background:#2d0e0e;color:#f85149;border:1px solid #8b2121}
.status.info{background:#0c2d6b;color:#58a6ff;border:1px solid #1f6feb}
.status.warn{background:#2b1f00;color:#d29922;border:1px solid #9e6a03}

.log{background:#000;padding:10px;border-radius:8px;
  font-family:monospace;font-size:10.5px;color:#8b949e;
  max-height:220px;overflow-y:auto;margin-top:12px;line-height:1.6}
.log .ok{color:#3fb950}
.log .err{color:#f85149}
.log .info{color:#58a6ff}
.log .warn{color:#d29922}

.coin{display:flex;justify-content:space-between;align-items:center;
  background:#0d1117;border:1px solid #30363d;border-radius:10px;
  padding:12px 14px;margin-bottom:6px}
.coin-sym{font-size:14px;font-weight:700}
.coin-price{font-size:15px;font-weight:700;color:#3fb950;
  font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ═══════ 1: بيانات الاتصال ═══════ -->
<div class="card">
  <h1>🔐 بيانات الحساب</h1>
  <p class="sub">من qxbroker.com → F12 → Network → digest</p>

  <label class="label">Token</label>
  <input type="text" id="tokenInput" class="input"
    placeholder="fK5MhIKtuWGG99uKo36s1t4iPMFmeElEltFjQjsp">

  <label class="label">CSRF</label>
  <input type="text" id="csrfInput" class="input"
    placeholder="oJ4YwFLY9XWj2edE5DxTeZ96ln6SUSQEiPq8754n">

  <button class="btn btn-success" onclick="tryConnect()">🔌 محاولة الاتصال</button>
  <button class="btn btn-secondary" onclick="clearLog()">🗑 مسح السجل</button>

  <div class="status" id="connStatus"></div>
  <div class="log" id="log">جاهز...</div>
</div>

<!-- ═══════ 2: الأسعار ═══════ -->
<div class="card">
  <h1>💹 الأسعار</h1>
  <p class="sub">تنعكس مباشرة بعد نجاح الاتصال</p>

  <div id="pricesList">
    <div class="log" style="margin:0">لا توجد أسعار بعد</div>
  </div>

  <button class="btn btn-primary" onclick="fetchPrices()">📊 تحديث الأسعار</button>
  <div class="status" id="priceStatus"></div>
</div>

<script>
// ═══════════════════════════════════════════
//  Log Helper
// ═══════════════════════════════════════════
function log(msg, type) {
  type = type || "info";
  var el = document.getElementById("log");
  var t = new Date().toLocaleTimeString();
  el.innerHTML += '<div class="' + type + '">[' + t + '] ' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}
function clearLog() {
  document.getElementById("log").innerHTML = "جاهز...";
}

function setStatus(id, msg, type) {
  var el = document.getElementById(id);
  el.className = "status show " + type;
  el.innerHTML = msg;
}

// ═══════════════════════════════════════════
//  State
// ═══════════════════════════════════════════
var state = {
  token: null,
  csrf: null,
  socket: null,
  prices: {}
};

// ═══════════════════════════════════════════
//  المحاولة الرئيسية
// ═══════════════════════════════════════════
async function tryConnect() {
  var t = document.getElementById("tokenInput").value.trim();
  var c = document.getElementById("csrfInput").value.trim();

  if (!t) { setStatus("connStatus", "❌ أدخل Token", "err"); return; }
  if (!c) { setStatus("connStatus", "❌ أدخل CSRF", "err"); return; }

  state.token = t;
  state.csrf = c;

  setStatus("connStatus", "🔄 جاري المحاولة...", "info");
  log("بدء الاتصال بـ Quotex", "info");

  // ═══ الخطوة 1: اختبار REST API ═══
  await testRest();

  // ═══ الخطوة 2: محاولة WebSocket ═══
  await testWebSocket();
}

// ═══════════════════════════════════════════
//  1) اختبار REST
// ═══════════════════════════════════════════
async function testRest() {
  log("📡 اختبار REST API...", "info");

  try {
    var res = await fetch("https://qxbroker.com/api/v1/cabinets/digest", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + state.token,
        "X-CSRF-Token": state.csrf,
        "Accept": "application/json"
      },
      credentials: "include"
    });

    log("REST status: " + res.status, res.ok ? "ok" : "err");

    if (res.ok) {
      var data = await res.json();
      log("✅ REST نجح — استلمت بيانات الحساب", "ok");
      if (data && data.data) {
        log("💰 الرصيد: " + (data.data.liveBalance || data.data.demoBalance), "info");
      }
    } else {
      log("❌ REST فشل: " + res.status, "err");
    }
  } catch (e) {
    log("❌ REST error: " + e.message, "err");
    log("→ السبب: CORS (المتصفح بيمنع الاتصال من دومين خارجي)", "warn");
  }
}

// ═══════════════════════════════════════════
//  2) محاولة WebSocket
// ═══════════════════════════════════════════
async function testWebSocket() {
  log("🔌 اختبار WebSocket...", "info");

  var url = "wss://ws2.qxbroker.com/socket.io/?EIO=4&transport=websocket";

  return new Promise(function(resolve) {
    var done = false;

    try {
      var ws = new WebSocket(url);
      state.socket = ws;

      var timer = setTimeout(function() {
        if (done) return;
        done = true;
        log("⏱ انتهى الوقت — السيرفر ما ردش", "err");
        try { ws.close(); } catch (e) {}
        setStatus("connStatus", "❌ فشل — السيرفر ما ردش", "err");
        resolve();
      }, 8000);

      ws.onopen = function() {
        if (done) return;
        log("✅ WebSocket اتصل", "ok");
        ws.send("40");
      };

      ws.onmessage = function(ev) {
        if (done) return;
        var d = ev.data;
        log("← " + d.slice(0, 100), "info");

        if (d.charAt(0) === "0") {
          try { ws.send("40"); } catch (e) {}
          return;
        }

        if (d.indexOf("40") === 0) {
          // فتح القناة — أرسل token
          var payload = JSON.stringify(["authorization", {
            session: state.token,
            token: state.token,
            csrf: state.csrf,
            isDemo: 1
          }]);
          try { ws.send("42" + payload); } catch (e) {}
          log("📤 تم إرسال Token", "info");
        }

        if (d.indexOf("authorization") > -1 || d.indexOf("success") > -1) {
          log("🎉 المصادقة نجحت!", "ok");
          done = true;
          clearTimeout(timer);
          setStatus("connStatus", "✅ متصل!", "ok");
          subscribeAssets(ws);
          resolve();
        }

        if (d.indexOf("error") > -1 || d.indexOf("unauthorized") > -1) {
          log("❌ السيرفر رفض: " + d, "err");
          done = true;
          clearTimeout(timer);
          setStatus("connStatus", "❌ رفض السيرفر", "err");
          try { ws.close(); } catch (e) {}
          resolve();
        }
      };

      ws.onerror = function() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        log("❌ WebSocket error", "err");
        log("→ السبب: Cloudflare/Origin mismatch", "warn");
        setStatus("connStatus", "❌ فشل الاتصال", "err");
        resolve();
      };

      ws.onclose = function(ev) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        log("🔌 انقطع (code: " + ev.code + ")", "err");
        setStatus("connStatus", "❌ انقطع الاتصال", "err");
        resolve();
      };

    } catch (e) {
      log("❌ استثناء: " + e.message, "err");
      setStatus("connStatus", "❌ فشل", "err");
      resolve();
    }
  });
}

// ═══════════════════════════════════════════
//  اشتراك في الأصول
// ═══════════════════════════════════════════
function subscribeAssets(ws) {
  var assets = ["BTCUSD", "ETHUSD", "SOLUSD", "EURUSD"];
  assets.forEach(function(a, i) {
    setTimeout(function() {
      var payload = JSON.stringify(["subscribe_candles", {
        asset: a, period: 60
      }]);
      try {
        ws.send("42" + payload);
        log("📊 اشتراك في " + a, "info");
      } catch (e) {}
    }, i * 300);
  });
}

// ═══════════════════════════════════════════
//  الأسعار (يدوي)
// ═══════════════════════════════════════════
async function fetchPrices() {
  if (!state.token) {
    setStatus("priceStatus", "❌ اتصل أولاً", "err");
    return;
  }

  setStatus("priceStatus", "⏳ جاري الطلب...", "info");

  try {
    var res = await fetch("https://qxbroker.com/api/v1/quotes", {
      headers: {
        "Authorization": "Bearer " + state.token,
        "X-CSRF-Token": state.csrf
      }
    });
    if (res.ok) {
      var d = await res.json();
      log("✅ استلمت أسعار", "ok");
    } else {
      log("❌ فشل: " + res.status, "err");
    }
  } catch (e) {
    log("❌ CORS: " + e.message, "err");
    setStatus("priceStatus", "❌ CORS blocked", "err");
  }
}

// ═══════════════════════════════════════════
log("الصفحة جاهزة — أدخل Token + CSRF", "info");
</script>

</body>
</html>
