<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أسعار Yahoo Finance</title>
    <style>
        :root {
            --bg: #141126;
            --surface: #24203D;
            --text: #F5F2FF;
            --text-muted: #A9A5C6;
            --green: #39FF14;
            --red: #FF1A1A;
            --cyan: #58D9F5;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        .header h1 {
            color: var(--cyan);
            font-size: 24px;
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .status-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .error-msg {
            color: var(--red);
            font-weight: bold;
            display: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .quotes-grid {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quote-card {
            background-color: var(--surface);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3D355A;
            transition: transform 0.2s;
        }
        .quote-card:hover {
            transform: scale(1.02);
        }
        .symbol-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .symbol-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
        }
        .symbol-code {
            font-size: 12px;
            color: var(--text-muted);
        }
        .price-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: var(--text);
        }
        .change {
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: flex-end;
        }
        .up { color: var(--green); }
        .down { color: var(--red); }
        
        /* Loader */
        .loader {
            border: 4px solid var(--surface);
            border-top: 4px solid var(--cyan);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>اختبار Yahoo Finance API</h1>
        <p>تحديث تلقائي كل 5 ثوانٍ</p>
    </div>

    <div class="status-bar">
        <span id="last-update">جاري الاتصال...</span>
        <span id="timer">5s</span>
    </div>

    <div id="error-msg" class="error-msg"></div>
    <div id="loader" class="loader"></div>

    <div id="quotes-grid" class="quotes-grid">
        <!-- سيتم إدخال البيانات هنا بواسطة JS -->
    </div>

    <script>
        // الرموز التي نريد اختبارها
        const symbols = [
            "AAPL",      // سهم أبل
            "MSFT",      // سهم مايكروسوفت
            "TSLA",      // سهم تسلا
            "EURUSD=X",  // فوركس يورو/دولار
            "GBPUSD=X",  // فوركس جنيه/دولار
            "BTC-USD",   // بيتكوين
            "ETH-USD",   // إيثريوم
            "^GSPC"      // مؤشر S&P 500
        ];

        // خريطة لتسميات الرموز بشكل مقروء
        const symbolNames = {
            "AAPL": "Apple Inc. (سهم)",
            "MSFT": "Microsoft Corp. (سهم)",
            "TSLA": "Tesla Inc. (سهم)",
            "EURUSD=X": "EUR / USD (فوركس)",
            "GBPUSD=X": "GBP / USD (فوركس)",
            "BTC-USD": "Bitcoin (رقمية)",
            "ETH-USD": "Ethereum (رقمية)",
            "^GSPC": "S&P 500 (مؤشر)"
        };

        let countdown = 5;
        let timerInterval;
        let fetchInterval;

        async function fetchQuotes() {
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('error-msg');
            const grid = document.getElementById('quotes-grid');

            // إظهار التحميل فقط إذا كانت الشاشة فارغة
            if (grid.children.length === 0) loader.style.display = 'block';
            errorMsg.style.display = 'none';

            // استخدام وسيط لتجاوز حظر CORS من ياهو
            const yahooUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols.join(',')}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                if (!data.quoteResponse || !data.quoteResponse.result) {
                    throw new Error("Invalid data format from Yahoo");
                }

                const results = data.quoteResponse.result;
                renderData(results);
                
                // تحديث وقت آخر تحديث
                const now = new Date().toLocaleTimeString('ar-EG');
                document.getElementById('last-update').innerText = `آخر تحديث: ${now}`;
                
            } catch (error) {
                console.error("Fetch Error:", error);
                if (grid.children.length === 0) {
                    errorMsg.innerText = "❌ فشل جلب البيانات. قد يكون المزود محظوراً مؤقتاً أو هناك مشكلة في الاتصال.";
                    errorMsg.style.display = 'block';
                }
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderData(results) {
            const grid = document.getElementById('quotes-grid');
            grid.innerHTML = ''; // مسح البيانات القديمة

            results.forEach(quote => {
                const isUp = quote.regularMarketChange >= 0;
                const changeClass = isUp ? 'up' : 'down';
                const arrow = isUp ? '▲' : '▼';
                
                // تنسيق السعر (بعض الأرقام تحتاج لعدة خانات عشرية)
                const price = quote.regularMarketPrice ? quote.regularMarketPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 5 }) : 'N/A';
                const change = quote.regularMarketChange ? quote.regularMarketChange.toFixed(2) : '0.00';
                const changePercent = quote.regularMarketChangePercent ? quote.regularMarketChangePercent.toFixed(2) : '0.00';
                
                const displayName = symbolNames[quote.symbol] || quote.shortName || quote.symbol;

                const card = document.createElement('div');
                card.className = 'quote-card';
                card.innerHTML = `
                    <div class="symbol-info">
                        <span class="symbol-name">${displayName}</span>
                        <span class="symbol-code">${quote.symbol}</span>
                    </div>
                    <div class="price-info">
                        <span class="price">${price}</span>
                        <span class="change ${changeClass}">
                            ${arrow} ${Math.abs(change)} (${Math.abs(changePercent)}%)
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function startTimer() {
            countdown = 5;
            document.getElementById('timer').innerText = `${countdown}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                countdown--;
                if (countdown >= 0) {
                    document.getElementById('timer').innerText = `${countdown}s`;
                }
            }, 1000);
        }

        // بدء التشغيل
        function startApp() {
            fetchQuotes();
            startTimer();
            
            clearInterval(fetchInterval);
            fetchInterval = setInterval(() => {
                fetchQuotes();
                startTimer();
            }, 5000);
        }

        startApp();
    </script>
</body>
</html>
