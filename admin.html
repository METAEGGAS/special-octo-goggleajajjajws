<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استرداد البلاغات</title>
<style>
  :root {
    --bg: #04050a;
    --panel: #0a0b12;
    --red: #ff2b3d;
    --red-dim: #6b0f16;
    --green: #2bff88;
    --amber: #febc2e;
    --text: #c9ccd4;
    --muted: #6a6e7a;
    --mono: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #14070b 0%, var(--bg) 65%);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    user-select: none;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,43,61,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,61,.04) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  .panel {
    position: relative; z-index: 1;
    width: min(96vw, 440px);
    background: rgba(10,11,18,.92);
    border: 1px solid var(--red-dim);
    border-radius: 14px;
    box-shadow: 0 0 60px rgba(255,43,61,.14), inset 0 0 40px rgba(255,43,61,.04);
    backdrop-filter: blur(5px);
    overflow: hidden;
  }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid #14161f;
    background: rgba(255,43,61,.04);
  }
  .panel-head .title {
    font-size: 15px; font-weight: 800; color: #fff;
    display: flex; align-items: center; gap: 9px;
  }
  .panel-head .title::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 10px var(--red);
  }
  .panel-head .badge {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--red);
    border: 1px solid var(--red-dim);
    padding: 3px 9px; border-radius: 20px;
    letter-spacing: .5px;
  }

  .form-body { padding: 24px 22px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 700;
    color: var(--text);
    margin-bottom: 7px;
    letter-spacing: .3px;
  }
  .field label .req { color: var(--red); }

  .field input {
    width: 100%;
    padding: 13px 14px;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    background: rgba(0,0,0,.5);
    border: 1px solid var(--red-dim);
    border-radius: 9px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: var(--muted); }
  .field input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,43,61,.12);
  }

  /* حقل كلمة المرور مع زر الإظهار */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-left: 44px; }
  .pw-toggle {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    transition: color .2s;
  }
  .pw-toggle:hover { color: var(--red); }

  /* زر تنظيف البلاغات */
  .clean-btn {
    width: 100%;
    padding: 15px;
    font-family: inherit; font-size: 15.5px; font-weight: 800;
    color: #fff; letter-spacing: .4px;
    background: linear-gradient(180deg, #ff2b3d, #7a0a14);
    border: none; border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 5px 22px rgba(255,43,61,.35);
    transition: transform .12s, box-shadow .2s, opacity .2s;
    margin-top: 6px;
  }
  .clean-btn:hover  { box-shadow: 0 7px 30px rgba(255,43,61,.6); }
  .clean-btn:active { transform: scale(.98); }
  .clean-btn:disabled { opacity: .55; cursor: not-allowed; }

  /* ===== شاشة التنظيف ===== */
  .clean-screen {
    display: none;
    padding: 24px 22px;
  }
  .clean-screen.show { display: block; }

  .clean-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; color: var(--muted);
    margin-bottom: 14px;
  }
  .clean-head .pct {
    font-family: var(--mono); font-size: 14px;
    color: var(--red); font-weight: 700;
  }

  .progress-track {
    height: 6px;
    background: #0e0f16;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--red), #ff6b3d);
    box-shadow: 0 0 12px var(--red);
    border-radius: 4px;
    transition: width .25s ease;
  }

  .log-box {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.9;
    direction: ltr;
    text-align: left;
    background: rgba(0,0,0,.4);
    border: 1px solid #14161f;
    border-radius: 8px;
    padding: 12px 14px;
    max-height: 170px;
    overflow-y: auto;
    color: var(--text);
  }
  .log-box::-webkit-scrollbar { width: 4px; }
  .log-box::-webkit-scrollbar-thumb { background: var(--red-dim); border-radius: 2px; }

  .log-line { white-space: pre-wrap; }
  .log-line .ok   { color: var(--green); }
  .log-line .warn { color: var(--amber); }
  .log-line .dim  { color: var(--muted); }

  /* ===== حالة النجاح ===== */
  .success-state {
    display: none;
    padding: 28px 22px;
    text-align: center;
  }
  .success-state.show { display: block; animation: fadeUp .35s ease-out; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .success-icon {
    width: 66px; height: 66px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: var(--green);
    box-shadow: 0 0 30px rgba(43,255,136,.35);
    animation: okPulse 1.8s ease-in-out infinite;
  }
  @keyframes okPulse {
    50% { box-shadow: 0 0 50px rgba(43,255,136,.6); }
  }

  .success-title {
    font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px;
  }
  .success-desc {
    font-size: 13px; color: #9a9ea9; line-height: 1.8; margin-bottom: 20px;
  }
  .success-desc b { color: var(--green); }

  .again-btn {
    padding: 11px 28px;
    font-family: inherit; font-size: 13.5px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--red-dim);
    border-radius: 8px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .again-btn:hover { color: #fff; border-color: var(--red); }
</style>
</head>
<body>

<div class="panel">
  <div class="panel-head">
    <span class="title">استرداد البلاغات</span>
    <span class="badge">CLEANER</span>
  </div>

  <!-- نموذج الإدخال -->
  <div class="form-body" id="formBody">
    <div class="field">
      <label>اسم المستخدم <span class="req">*</span></label>
      <input id="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label>كلمة المرور <span class="req">*</span></label>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="off">
        <button class="pw-toggle" id="pwToggle" type="button" title="إظهار/إخفاء">👁</button>
      </div>
    </div>

    <button class="clean-btn" id="cleanBtn">🧹 تنظيف البلاغات</button>
  </div>

  <!-- شاشة التنظيف -->
  <div class="clean-screen" id="cleanScreen">
    <div class="clean-head">
      <span>جاري تنظيف البلاغات...</span>
      <span class="pct" id="pctText">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>

  <!-- حالة النجاح -->
  <div class="success-state" id="successState">
    <div class="success-icon">✔</div>
    <div class="success-title">تم تنظيف البلاغات</div>
    <div class="success-desc">
      تمت معالجة جميع البلاغات المرتبطة بالحساب <b id="doneName">—</b> بنجاح.
    </div>
    <button class="again-btn" id="againBtn">بدء من جديد</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const formBody    = document.getElementById("formBody");
  const usernameIn  = document.getElementById("username");
  const passwordIn  = document.getElementById("password");
  const pwToggle    = document.getElementById("pwToggle");
  const cleanBtn    = document.getElementById("cleanBtn");

  const cleanScreen = document.getElementById("cleanScreen");
  const progressFill= document.getElementById("progressFill");
  const pctText     = document.getElementById("pctText");
  const logBox      = document.getElementById("logBox");

  const successState= document.getElementById("successState");
  const doneName    = document.getElementById("doneName");
  const againBtn    = document.getElementById("againBtn");

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const rand  = (a, b) => Math.random() * (b - a) + a;

  /* ---------- إظهار/إخفاء كلمة المرور ---------- */
  pwToggle.addEventListener("click", () => {
    const isPw = passwordIn.type === "password";
    passwordIn.type = isPw ? "text" : "password";
    pwToggle.textContent = isPw ? "🙈" : "👁";
  });

  /* ---------- سطور السجل ---------- */
  const LOG_SCRIPT = [
    { t: "dim",  txt: "connecting to report database..." },
    { t: "ok",   txt: "[+] authenticated" },
    { t: "dim",  txt: "fetching reports for {TARGET}..." },
    { t: "warn", txt: "[!] 7 active reports found" },
    { t: "dim",  txt: "removing report #1 ..." },
    { t: "ok",   txt: "[+] report #1 removed" },
    { t: "dim",  txt: "removing report #2 ..." },
    { t: "ok",   txt: "[+] report #2 removed" },
    { t: "dim",  txt: "removing report #3 ..." },
    { t: "ok",   txt: "[+] report #3 removed" },
    { t: "dim",  txt: "removing report #4 ..." },
    { t: "ok",   txt: "[+] report #4 removed" },
    { t: "dim",  txt: "removing report #5 ..." },
    { t: "ok",   txt: "[+] report #5 removed" },
    { t: "dim",  txt: "removing report #6 ..." },
    { t: "ok",   txt: "[+] report #6 removed" },
    { t: "dim",  txt: "removing report #7 ..." },
    { t: "ok",   txt: "[+] report #7 removed" },
    { t: "ok",   txt: "[✔] all reports cleared" },
  ];

  function addLog(t, txt) {
    const line = document.createElement("div");
    line.className = "log-line";
    const target = (usernameIn.value.trim() || "unknown");
    const safe = txt.replace("{TARGET}", target);
    const cls = t === "ok" ? "ok" : t === "warn" ? "warn" : "dim";
    line.innerHTML = '<span class="' + cls + '">' + escapeHtml(safe) + '</span>';
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  /* ---------- بدء التنظيف ---------- */
  cleanBtn.addEventListener("click", async () => {
    const name = usernameIn.value.trim();
    const pass = passwordIn.value;

    if (!name) { usernameIn.focus(); flash(usernameIn); return; }
    if (!pass) { passwordIn.focus(); flash(passwordIn); return; }

    formBody.style.display = "none";
    cleanScreen.classList.add("show");
    logBox.innerHTML = "";
    progressFill.style.width = "0%";
    pctText.textContent = "0%";

    const total = LOG_SCRIPT.length;
    for (let i = 0; i < total; i++) {
      const step = LOG_SCRIPT[i];
      addLog(step.t, step.txt);
      const pct = Math.round(((i + 1) / total) * 100);
      progressFill.style.width = pct + "%";
      pctText.textContent = pct + "%";
      await sleep(rand(80, 220));
    }

    await sleep(500);
    cleanScreen.classList.remove("show");
    doneName.textContent = name;
    successState.classList.add("show");
  });

  function flash(el) {
    el.style.borderColor = "#ff2b3d";
    setTimeout(() => { el.style.borderColor = ""; }, 600);
  }

  /* ---------- إعادة ---------- */
  againBtn.addEventListener("click", () => {
    successState.classList.remove("show");
    cleanScreen.classList.remove("show");
    formBody.style.display = "block";
    usernameIn.value = "";
    passwordIn.value = "";
    logBox.innerHTML = "";
    progressFill.style.width = "0%";
    pctText.textContent = "0%";
    usernameIn.focus();
  });
})();
</script>
</body>
</html>
