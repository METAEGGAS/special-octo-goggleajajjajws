<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحقق أمني</title>
<style>
  :root {
    --bg: #05060a;
    --red: #ff2b3d;
    --dim: #6b0f16;
    --text: #c9ccd4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #12060a 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* شبكة خلفية خافتة */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,43,61,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,43,61,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    animation: gridPulse 6s ease-in-out infinite;
  }
  @keyframes gridPulse {
    0%,100% { opacity: .4; }
    50%     { opacity: .9; }
  }

  .panel {
    position: relative;
    z-index: 2;
    width: min(92vw, 460px);
    padding: 38px 28px;
    background: rgba(10, 6, 8, .85);
    border: 1px solid var(--dim);
    border-radius: 14px;
    box-shadow: 0 0 60px rgba(255,43,61,.15), inset 0 0 40px rgba(255,43,61,.05);
    text-align: center;
    backdrop-filter: blur(4px);
  }

  .warn-icon {
    font-size: 46px;
    color: var(--red);
    margin-bottom: 14px;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { opacity: .35; } }

  h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .sub {
    font-size: 13.5px;
    line-height: 1.8;
    color: #8d909a;
    margin-bottom: 26px;
  }

  .status-line {
    font-family: "Consolas", monospace;
    font-size: 11.5px;
    color: var(--red);
    opacity: .75;
    margin-bottom: 22px;
    direction: ltr;
    min-height: 16px;
    white-space: nowrap;
    overflow: hidden;
  }

  #strikeBtn {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(180deg, #ff2b3d, #a40d1a);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 6px 24px rgba(255,43,61,.4);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  #strikeBtn:hover  { box-shadow: 0 8px 34px rgba(255,43,61,.65); }
  #strikeBtn:active { transform: scale(.97); }
  #strikeBtn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- طبقة المؤثرات ---------- */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    overflow: hidden;
  }

  .glyph {
    position: absolute;
    font-family: monospace;
    font-weight: 700;
    color: var(--red);
    opacity: 0;
    text-shadow: 0 0 12px rgba(255,43,61,.9);
    animation: glyphFly 1.4s ease-out forwards;
  }
  @keyframes glyphFly {
    0%   { opacity: 0; transform: translateY(30px) scale(.4) rotate(0deg); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-180px) scale(1.6) rotate(25deg); }
  }

  .glitch-bar {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: var(--red);
    opacity: 0;
    animation: barFlash .35s ease-out forwards;
  }
  @keyframes barFlash {
    0%   { opacity: .9; transform: scaleX(0); }
    100% { opacity: 0; transform: scaleX(1); }
  }

  body.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%,90% { transform: translate(-2px, 1px); }
    20%,80% { transform: translate(4px, -2px); }
    30%,50%,70% { transform: translate(-6px, 2px); }
    40%,60% { transform: translate(6px, -1px); }
  }

  /* ---------- شاشة النتيجة ---------- */
  #result {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2, 0, 3, .94);
    opacity: 0;
    transition: opacity .35s ease;
  }
  #result.show { display: flex; opacity: 1; }

  .result-box {
    text-align: center;
    padding: 30px;
    animation: resultIn .5s ease-out;
  }
  @keyframes resultIn {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .check {
    width: 92px; height: 92px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 4px solid var(--red);
    display: flex; align-items: center; justify-content: center;
    font-size: 50px;
    color: var(--red);
    box-shadow: 0 0 40px rgba(255,43,61,.5), inset 0 0 30px rgba(255,43,61,.15);
    animation: checkPulse 1.6s ease-in-out infinite;
  }
  @keyframes checkPulse {
    0%,100% { box-shadow: 0 0 40px rgba(255,43,61,.5), inset 0 0 30px rgba(255,43,61,.15); }
    50%     { box-shadow: 0 0 75px rgba(255,43,61,.9), inset 0 0 45px rgba(255,43,61,.3); }
  }

  .result-title {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 10px;
  }
  .result-sub {
    font-size: 14px;
    color: #8d909a;
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .result-sub b { color: var(--red); }

  #againBtn {
    padding: 11px 30px;
    font-family: inherit;
    font-size: 13.5px;
    color: #8d909a;
    background: transparent;
    border: 1px solid var(--dim);
    border-radius: 8px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  #againBtn:hover { color: #fff; border-color: var(--red); }
</style>
</head>
<body>

<div class="panel">
  <div class="warn-icon">⚠</div>
  <h1>تحقق أمني مطلوب</h1>
  <p class="sub">
    تم رصد نشاط مشبوه مرتبط بهذا الحساب.<br>
    اضغط على الزر أدناه لمتابعة إجراء التحقق.
  </p>
  <div class="status-line" id="statusLine">SCANNING...</div>
  <button id="strikeBtn">ضرب الحساب</button>
</div>

<div id="fx"></div>

<div id="result">
  <div class="result-box">
    <div class="check">✔</div>
    <div class="result-title">تم ضرب الحساب بنجاح</div>
    <div class="result-sub">
      العملية نفّذت <b>موقتاً</b> حسب رغبتك.<br>
      هذا مجرد تأثير بصري — لا يوجد أي اختراق حقيقي.
    </div>
    <button id="againBtn">إعادة التجربة</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const btn        = document.getElementById("strikeBtn");
  const statusLine = document.getElementById("statusLine");
  const fxLayer    = document.getElementById("fx");
  const result     = document.getElementById("result");
  const againBtn   = document.getElementById("againBtn");

  /* رموز تُطلق أثناء المؤثرات */
  const GLYPHS = ["✖", "⚠", "×", "!", "⛔", "◉", "▮", "؟", "ERR", "0x00"];
  const GLYPH_COLORS = ["#ff2b3d", "#ff6b3d", "#ff2b6b", "#c9ccd4"];

  /* سطور الحالة الزائفة — تتغير بسرعة أثناء التنفيذ */
  const STATUS_STEPS = [
    "CONNECTING...",
    "BYPASSING SECURITY LAYER...",
    "TARGET ACQUIRED",
    "INJECTING PAYLOAD...",
    "OVERRIDING AUTH TOKENS...",
    "STRIKE IN PROGRESS...",
    "FINALIZING...",
  ];

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  /* إطلاق رمز عشوائي يطير لأعلى */
  function spawnGlyph() {
    const el = document.createElement("span");
    el.className = "glyph";
    el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    el.style.left = rand(5, 95) + "vw";
    el.style.top  = rand(45, 90) + "vh";
    el.style.fontSize = rand(18, 46) + "px";
    el.style.color = GLYPH_COLORS[Math.floor(Math.random() * GLYPH_COLORS.length)];
    fxLayer.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }

  /* شريط جليتش أفقي عشوائي */
  function spawnGlitchBar() {
    const bar = document.createElement("div");
    bar.className = "glitch-bar";
    bar.style.top = rand(5, 95) + "vh";
    bar.style.height = rand(1, 4) + "px";
    fxLayer.appendChild(bar);
    bar.addEventListener("animationend", () => bar.remove());
  }

  /* اهتزاز الشاشة */
  function shake() {
    document.body.classList.add("shake");
    setTimeout(() => document.body.classList.remove("shake"), 460);
  }

  /* تشغيل كل المؤثرات لمدة ms */
  function runEffects(ms) {
    const end = performance.now() + ms;
    const tick = () => {
      if (performance.now() > end) return;
      spawnGlyph();
      if (Math.random() < 0.35) spawnGlitchBar();
      if (Math.random() < 0.25) shake();
      setTimeout(tick, rand(40, 120));
    };
    tick();
  }

  /* تحديث سطر الحالة بسرعة */
  function runStatus(ms, done) {
    const end = performance.now() + ms;
    let i = 0;
    const tick = () => {
      statusLine.textContent = STATUS_STEPS[i % STATUS_STEPS.length];
      i++;
      if (performance.now() > end) { done(); return; }
      setTimeout(tick, rand(90, 180));
    };
    tick();
  }

  /* ---------- التدفق الرئيسي ---------- */
  function strike() {
    btn.disabled = true;
    btn.textContent = "جارٍ التنفيذ...";

    const DURATION = 2600; // مدة المؤثرات الكلية

    runEffects(DURATION);
    runStatus(DURATION, () => {
      statusLine.textContent = "DONE";
      result.classList.add("show");
    });
  }

  btn.addEventListener("click", strike);

  againBtn.addEventListener("click", () => {
    result.classList.remove("show");
    btn.disabled = false;
    btn.textContent = "ضرب الحساب";
    statusLine.textContent = "SCANNING...";
    fxLayer.innerHTML = "";
  });

  /* تشغيل خفيف تلقائي في الخلفية قبل الضغط */
  setInterval(() => {
    if (!btn.disabled && Math.random() < 0.3) spawnGlitchBar();
  }, 1400);
})();
</script>
</body>
</html>
