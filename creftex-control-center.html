<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CREFTEX — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00BFFF;--bright-cyan:#18D8FF;--blue:#168CFF;--deep-blue:#0756C9;--purple:#9A45FF;--purple-2:#8B3DFF;--magenta:#D84CFF;--green:#00DFA2;--bright-green:#19F59D;--yellow:#FFD21C;--orange:#FF9D2E;--red:#FF3B4E;--white:#F5F8FF;--light-text:#D7E3F4;--muted:#8998AA;--secondary-text:#8B9AAF;--bg:#08111D;--card:#111D2A;--card-2:#162535;--border:#20384C}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:radial-gradient(900px 500px at 85% -5%,rgba(0,140,255,.10),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(139,61,255,.07),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(0,191,255,.06),transparent 60%),linear-gradient(180deg,#07111C 0%,#0B1622 50%,#101C29 100%);background-color:var(--bg);color:var(--white);min-height:100vh;display:flex;justify-content:center;zoom:.8}
.app{width:100%;max-width:430px;min-height:100vh;padding:15px 15px 120px;position:relative}
.glass{background:rgba(17,30,43,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(45,105,140,.35);box-shadow:0 10px 35px rgba(0,0,0,.35)}
svg{display:block}
.icon{width:22px;height:22px}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.brand-wrap{display:flex;align-items:center;gap:12px}
.brand{text-align:right}
.brand h1{font-size:26px;font-weight:900;letter-spacing:1px;line-height:1.05;background:linear-gradient(90deg,#19C9FF 20%,#8B5CFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(25,201,255,.45));direction:ltr}
.brand span{font-size:9px;font-weight:700;letter-spacing:4px;color:#66758A;direction:ltr;display:block;margin-top:2px}
.bolt-ring{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(24,216,255,.20),rgba(8,118,201,.10) 60%,rgba(8,20,33,.6));border:2px solid rgba(24,191,255,.65);box-shadow:0 0 25px rgba(0,191,255,.45),inset 0 0 18px rgba(24,216,255,.25);position:relative;flex-shrink:0;overflow:hidden}
.bolt-ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(139,61,255,.35);filter:blur(1px)}
.bolt-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.admin-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#10283A;border:1px solid #17638B;box-shadow:0 0 14px rgba(0,140,255,.18),inset 0 0 12px rgba(24,216,255,.06);color:var(--light-text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.admin-btn svg{width:17px;height:17px}
.admin-btn .crown{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{border-radius:20px;background:#111D2A;padding:16px 8px 14px;display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.stat .num{font-size:30px;font-weight:800;line-height:1;direction:ltr}
.stat .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.stat .col{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat svg,.stat .ic{width:26px;height:26px}
.stat.c{border:1.5px solid rgba(0,191,255,.75);box-shadow:0 0 18px rgba(0,191,255,.22),inset 0 0 22px rgba(0,191,255,.05)}
.stat.c .num{color:#18D8FF;text-shadow:0 0 14px rgba(24,216,255,.55)}
.stat.c svg,.stat.c .ic{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,191,255,.6))}
.stat.g{border:1.5px solid rgba(0,230,160,.7);box-shadow:0 0 18px rgba(0,223,162,.20),inset 0 0 22px rgba(0,223,162,.05)}
.stat.g .num{color:#19F59D;text-shadow:0 0 14px rgba(25,245,157,.5)}
.stat.g svg,.stat.g .ic{color:var(--green);filter:drop-shadow(0 0 6px rgba(0,223,162,.6))}
.stat.p{border:1.5px solid rgba(154,69,255,.75);box-shadow:0 0 18px rgba(154,69,255,.25),inset 0 0 22px rgba(154,69,255,.06)}
.stat.p .num{color:#B46BFF;text-shadow:0 0 14px rgba(180,107,255,.55)}
.stat.p svg,.stat.p .ic{color:var(--purple);filter:drop-shadow(0 0 6px rgba(154,69,255,.65))}
.mainnav{background:#101D2A;border:1px solid #1D3548;border-radius:22px;padding:8px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.navitem{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:16px;color:var(--secondary-text);font-size:13px;font-weight:700;cursor:pointer;position:relative;border:1px solid transparent}
.navitem svg{width:19px;height:19px;color:#93A6BC}
.navitem .dot{position:absolute;top:7px;left:22%;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(255,59,78,.9)}
.navitem.active{background:linear-gradient(135deg,#0876D9 0%,#0A4EC1 100%);border:1px solid var(--cyan);color:#fff;box-shadow:0 0 20px rgba(0,150,255,.5),inset 0 0 14px rgba(24,216,255,.25)}
.navitem.active svg{color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.6))}
.section{background:#111F2C;border:1px solid #203A4D;border-radius:28px;padding:18px 16px;margin-bottom:16px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:var(--white)}
.section-title svg{width:21px;height:21px;color:#4FC4FF;filter:drop-shadow(0 0 6px rgba(0,191,255,.5))}
.t-ic{width:21px;height:21px;border-radius:6px;object-fit:cover;filter:drop-shadow(0 0 6px rgba(0,191,255,.5))}
.count-badge{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#0876D9;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(8,118,217,.6)}
.refresh-btn{width:38px;height:38px;border-radius:12px;background:#10283A;border:1px solid #17638B;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(0,140,255,.15);overflow:hidden}
.refresh-btn svg{width:18px;height:18px;color:#35B6FF}
.r-ic{width:22px;height:22px;border-radius:6px;object-fit:cover;filter:drop-shadow(0 0 5px rgba(0,191,255,.6))}
.device-card{border-radius:25px;background:linear-gradient(160deg,#142231 0%,#131E30 60%,#1B1830 100%);border:2px solid transparent;background-clip:padding-box;position:relative;padding:18px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 0 24px rgba(0,175,255,.18),0 0 40px rgba(179,60,255,.10)}
.device-card::before{content:"";position:absolute;inset:-2px;border-radius:25px;background:linear-gradient(120deg,#00AFFF 0%,#2E7FE8 40%,#8B3DFF 75%,#B33CFF 100%);z-index:-1}
.status-dot{width:22px;height:22px;border-radius:50%;background:rgba(255,48,72,.12);border:1.5px solid rgba(255,48,72,.55);display:flex;align-items:center;justify-content:center;position:absolute;top:14px;left:14px}
.status-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,48,72,.95)}
.phone-mock{width:52px;height:78px;flex-shrink:0;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(0,140,255,.35))}
.phone-mock img{width:52px;height:78px;object-fit:contain;display:block}
.device-info{flex:1;min-width:0;direction:ltr;text-align:left}
.device-info h3{font-size:17px;font-weight:800;color:#F2F6FF;letter-spacing:.3px;margin-bottom:6px}
.device-info .row{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#8395A9;margin-top:4px;direction:ltr}
.device-info .row svg{width:14px;height:14px;color:#5E7A93;flex-shrink:0}
.device-info .row .ar{direction:rtl;unicode-bidi:plaintext}
.chev{width:30px;height:30px;border-radius:50%;border:1px solid rgba(139,154,175,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chev svg{width:14px;height:14px;color:#93A6BC}
.divider{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(0,191,255,.7) 30%,rgba(139,61,255,.7) 70%,transparent);margin:2px 0 16px;box-shadow:0 0 10px rgba(0,191,255,.35)}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#152432;border-radius:18px;padding:15px 14px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--light-text);border:1.5px solid}
.cmd .lead{display:flex;align-items:center;gap:9px}
.cmd svg,.cmd .ic{width:22px;height:22px}
.cmd .go{width:15px;height:15px;color:#6E8298}
.cmd.photos{border-color:rgba(22,140,255,.65);box-shadow:0 0 14px rgba(22,140,255,.16)}
.cmd.photos .ic{color:#8B5CFF;filter:drop-shadow(0 0 6px rgba(139,92,255,.7))}
.cmd.images{border-color:rgba(0,191,255,.65);box-shadow:0 0 14px rgba(0,191,255,.16)}
.cmd.images .ic{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,191,255,.7))}
.cmd.sms{border-color:rgba(0,223,162,.65);box-shadow:0 0 14px rgba(0,223,162,.15)}
.cmd.sms .ic{color:var(--green);filter:drop-shadow(0 0 6px rgba(0,223,162,.7))}
.cmd.notif{border-color:rgba(255,210,28,.6);box-shadow:0 0 14px rgba(255,210,28,.14)}
.cmd.notif .ic{color:var(--yellow);filter:drop-shadow(0 0 6px rgba(255,210,28,.65))}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,20,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.bitem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8A9AAD;cursor:pointer;padding:4px 0 2px;position:relative}
.bitem svg{width:22px;height:22px}
.bitem.active{color:#00C8FF}
.bitem.active svg{color:#00C8FF;filter:drop-shadow(0 0 8px rgba(0,200,255,.8))}
.bitem.active::after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:3px;background:#00C8FF;box-shadow:0 0 12px rgba(0,200,255,.9)}
</style>
</head>
