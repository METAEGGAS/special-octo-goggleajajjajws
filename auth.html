<script>var capCode='';function drawCap(){var c=document.getElementById('cap'),x=c.getContext('2d'),ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',cols=['#27ae60','#2980b9','#8e44ad','#c0392b','#16a085'];capCode='';x.fillStyle='#fff';x.fillRect(0,0,88,40);for(var i=0;i<3;i++){x.strokeStyle='rgba('+(Math.random()*150|0)+','+(Math.random()*150|0)+','+(Math.random()*150|0)+',.6)';x.beginPath();x.moveTo(Math.random()*88,Math.random()*40);x.lineTo(Math.random()*88,Math.random()*40);x.stroke()}for(i=0;i<4;i++){var t=ch[Math.random()*ch.length|0];capCode+=t;x.save();x.font='bold '+(20+Math.random()*6)+'px cursive';x.fillStyle=cols[Math.random()*cols.length|0];x.translate(10+i*19,26+Math.random()*5-2);x.rotate((Math.random()-.5)*.7);x.fillText(t,0,0);x.restore()}}drawCap();function epw(){var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'}function sw(e){document.getElementById('tE').className=e?'on':'';var i=document.getElementById('idIn');i.placeholder=e?'Email':'Phone';i.type=e?'email':'tel';i.value=''}setTimeout(function(){document.getElementById('ld').style.display='none'},900);function hideAll(){document.getElementById('lg').style.display='none';document.getElementById('reg').style.display='none';document.getElementById('rst').style.display='none'}function showPg(id,dir){hideAll();var e=document.getElementById(id);e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation=(dir?'pgR':'pgL')+' .38s cubic-bezier(.22,.9,.32,1) both';window.scrollTo(0,0)}function goReg(){showPg('reg',1)}function goRst(){showPg('rst',1)}function goLg(){showPg('lg',0)}function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2200)}function epw2(id){var p=document.getElementById(id);p.type=p.type==='password'?'text':'password'}try{history.replaceState(null,'','/pages/register/login')}catch(e){}document.addEventListener('contextmenu',fun Type':'application/json'},body:JSON.stringify({sender:{name:'CREFTX EXCHANGE',email:'noreply.eptinex@gmail.com'},to:[{email:em}],subject:'رمز التحقق',htmlContent:'<div dir="rtl" style="font-family:Arial;text-align:center"><h2>رمز التحقق الخاص بك</h2><p style="font-size:32px;font-weight:700;letter-spacing:6px;color:#6d5ef0">'+code+'</p><p>الرمز صالح لمدة 8 دقائق</p></div>'})});if(!r.ok)throw 0;toast('✓ تم ارسال الرمز بنجاح');let sec=60;s.textContent='60S';const t=setInterval(()=>{sec--;if(sec>0)s.textContent=sec+'S';else{clearInterval(t);s.textContent='Send';s.style.opacity='1';delete s.dataset.busy}},1e3)}catch(x){alert('Failed to send the code, please try again');delete s.dataset.busy;s.textContent='Send';s.style.opacity='1'}};window.login=function(){var v=document.getElementById('capIn').value.trim().toUpperCase();if(v&&v!==capCode){alert('Verification code is incorrect');drawCap();document.getElementById('capIn').value='';return}var em=document.getElementById('idIn').value.trim(),pw=document.getElementById('pw').value;if(!em||!pw){alert('Please enter your email and password');return}var b=document.querySelector('#lg .btn');b.textContent='Logging in...';b.style.opacity='.75';signInWithEmailAndPassword(auth,em,pw).then(function(){setTimeout(goHome,800)}).catch(function(x){alert(ar(x.code));b.textContent='Log In';b.style.opacity='1';drawCap();document.getElementById('capIn').value=''})};window.register=async function(){var e=document.getElementById('rEm').value.trim(),v=document.getElementById('rVc').value.trim(),p1=document.getElementById('rP1').value,p2=document.getElementById('rP2').value;if(!e||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){alert('Please enter a valid email address');return}if(!v){alert('Please enter the verification code');return}if(p1.length<6||p1.length>16){alert('Password must be 6-16 characters');return}if(p1!==p2){alert('Passwords do not match');return}if(!vc||v!==vc){alert('Incorrect verification code');return}if(Date.now()>ve){alert('Verificatio
